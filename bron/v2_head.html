<title>Boa Paraat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Mono:wght@500;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: rustige lichte kopbalk met modulenavigatie en profiel, één leeskolom (max 820px); op de telefoon een tabbalk onderaan.
   Kleur: koele grijsblauwe neutralen; gedempt uniformblauw als enige accent; een gedempte koperkleur (als van een insigne) alleen voor kleine markeringen. */
:root{--ring:rgba(44,74,115,.22);color-scheme:light;accent-color:var(--navy);caret-color:var(--navy);
  --paper:#f4f6f9; --surface:#ffffff; --sunk:#f7f8fb; --ink:#1c2533; --muted:#5b6676; --line:#dce1e8; --track:#e3e8ef;
  --navy:#2c4a73; --navy-ink:#ffffff; --tint:#e7edf5; --hivis:#a0823a; --hivis-ink:#1f1a10; --link:#2c4a73;
  --ok:#2f6b4f; --ok-bg:#e6f1ea; --bad:#a0564c; --bad-bg:#f6eae7; --warn-bg:#f6f1e4;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif; --f-body:"Public Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px; --rb:10px; --tabh:64px; --l-bg:#2c4a73; --l-mark:#ffffff; --l-ink:#ffffff; --l-check:#2c4a73;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ring:rgba(157,184,224,.32);
  --paper:#10151c; --surface:#171e28; --sunk:#131922; --ink:#e3e8ef; --muted:#9ba7b6; --line:#273140; --track:#232c39;
  --navy:#9db8e0; --navy-ink:#0f1a2b; --tint:#1d2939; --hivis:#cfab5c; --hivis-ink:#1f1a10; --link:#a6c0e6;
  --l-bg:#10151c; --l-mark:#9db8e0; --l-ink:#e3e8ef; --l-check:#10151c; --ok:#79c79e; --ok-bg:#14271d; --bad:#e8968b; --bad-bg:#2f1b19; --warn-bg:#272418; color-scheme:dark}}
:root[data-theme="dark"]{--ring:rgba(157,184,224,.32);
  --paper:#10151c; --surface:#171e28; --sunk:#131922; --ink:#e3e8ef; --muted:#9ba7b6; --line:#273140; --track:#232c39;
  --navy:#9db8e0; --navy-ink:#0f1a2b; --tint:#1d2939; --hivis:#cfab5c; --hivis-ink:#1f1a10; --link:#a6c0e6;
  --l-bg:#10151c; --l-mark:#9db8e0; --l-ink:#e3e8ef; --l-check:#10151c; --ok:#79c79e; --ok-bg:#14271d; --bad:#e8968b; --bad-bg:#2f1b19; --warn-bg:#272418; color-scheme:dark}
/* Licentie NS: blauw als accent, geel alleen als dunne markering (rustig, weinig afleidend) */
:root[data-lic="ns"]{--ring:rgba(0,48,130,.22);--navy:#003082;--navy-ink:#ffffff;--tint:#e8eef8;--link:#003082;--hivis:#e9b400;--warn-bg:#fdf6dc;--l-bg:#003082;--l-check:#003082}
@media (prefers-color-scheme: dark){:root[data-lic="ns"]:not([data-theme="light"]){--ring:rgba(143,176,234,.32);--navy:#8fb0ea;--navy-ink:#0b1730;--tint:#16233a;--link:#a3c0f0;--hivis:#ffc917;--warn-bg:#29240f;--l-bg:#10151c;--l-check:#10151c}}
:root[data-lic="ns"][data-theme="dark"]{--ring:rgba(143,176,234,.32);--navy:#8fb0ea;--navy-ink:#0b1730;--tint:#16233a;--link:#a3c0f0;--hivis:#ffc917;--warn-bg:#29240f;--l-bg:#10151c;--l-check:#10151c}
:root[data-lic="ns"] .bar{border-bottom:3px solid #ffc917}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{overflow-x:hidden}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;top:0;right:0;left:0;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* kopbalk + navigatie */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;min-height:58px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;flex:0 1 auto;min-width:0}
.mark{display:block;width:36px;height:36px;flex:none}
.mark svg{display:block;width:100%;height:100%}
.mark .m-sh{fill:var(--navy)}
.mark .m-rim{fill:none;stroke:#c9a24a;stroke-width:1.8}
.mark .m-ck{fill:none;stroke:var(--navy-ink);stroke-width:5.4;stroke-linecap:round;stroke-linejoin:round}
.mark .m-bl{fill:#c9a24a}
.bname{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand b{font-family:var(--f-display);font-weight:700;font-size:19px;font-stretch:92%;white-space:nowrap;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis}
.brand .tag{font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap;letter-spacing:.01em;margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.topnav{display:flex;gap:2px;margin-left:auto}
.topnav a{display:inline-flex;align-items:center;gap:7px;color:var(--muted);text-decoration:none;font-weight:600;font-size:15px;padding:8px 11px;border-radius:7px;white-space:nowrap}
.topnav .ic{display:inline-grid;place-items:center}
.topnav .ic svg{width:18px;height:18px}
.topnav a[aria-current="page"] .ic{color:var(--navy)}
@media (max-width:1140px){.topnav .ic{display:none}.topnav a{padding:8px 9px}}
@media (hover:hover){.topnav a:hover{color:var(--ink);background:var(--sunk)}}
.topnav a[aria-current="page"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--navy);border-radius:0}
.prof{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;font-weight:600;font-size:14px;white-space:nowrap}
@media (hover:hover){.prof:hover{background:var(--sunk)}}
.prof[aria-current="page"]{border-color:var(--navy)}
.ava{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--tint);color:var(--navy);font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.02em;flex:none}
.ava.lg{width:64px;height:64px;font-size:24px}
.timer{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums;background:var(--sunk);border:1px solid var(--line);padding:4px 10px;border-radius:6px}
.bar .timer,.bar .timer[hidden]+.barbtn{margin-left:auto}
/* inloggen en account */
.login .panel{max-width:520px}.lgoogle{width:100%;justify-content:center;min-height:52px;font-size:17px}
.lbezig{display:flex;align-items:center;gap:10px;margin:0;font-weight:600}
.lhint{margin:0;padding:10px 12px;border-radius:var(--r);background:var(--tint);border:1px solid var(--line);font-size:15px}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--navy);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.acc{display:flex;align-items:center;gap:12px;min-width:0}.accmail{overflow-wrap:anywhere}.accoff{color:var(--bad)}
/* licentie */
.liclogo{height:26px;width:auto;max-width:96px;object-fit:contain;flex:none;padding-left:10px;margin-left:2px;border-left:1px solid var(--line)}
.lichead{display:flex;align-items:center;gap:14px}.lichead .liclogo{height:34px;border:0;padding:0;margin:0}
.licrow{flex-wrap:nowrap}.licrow input{flex:1;min-width:0}.domvast{margin:0;padding:10px 12px;background:var(--tint);border-radius:var(--rb);color:var(--ink)}
/* foutenanalyse */
.fcta{border-left:3px solid var(--navy)}.fcta h2{margin:0 0 4px}
ol.zwak{list-style:none;margin:0;padding:0;display:grid;gap:12px}
ol.zwak li{display:flex;flex-direction:column;gap:12px}
.fsub{margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-family:var(--f-mono)}
.chip.rep{background:var(--warn-bg);color:var(--ink)}
.fkaart{display:flex;flex-direction:column;gap:14px;border-left:3px solid var(--bad)}
.fkkop{display:flex;align-items:center;gap:14px;min-width:0}.fkkop h2{margin:0;font-size:18px}
.fkn{display:grid;place-items:center;min-width:44px;height:44px;padding:0 8px;border-radius:12px;background:var(--bad-bg);color:var(--bad);font-weight:700;font-size:18px;flex:none}
.pbadge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;margin-left:4px;border-radius:999px;background:var(--bad-bg);color:var(--bad);font:600 12px/1 var(--f-mono);vertical-align:1px}
a.statlink{text-decoration:none;color:inherit}a.statlink .l{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
@media (hover:hover){a.statlink:hover{background:var(--sunk)}}
@media (min-width:700px){.fkaart{flex-direction:row;align-items:center;justify-content:space-between}}
.ftbl th{white-space:nowrap}.ftbl td.n .btn{font-family:var(--f-body)}
.timer.low{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.barbtn{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:14px}
@media (hover:hover){.barbtn:hover{background:var(--sunk)}}

/* tabbalk telefoon en tablet (aanraakscherm tot 1100 px breed, ook liggend) */
.tabbar{display:none}
@media (max-width:780px),(pointer:coarse) and (max-width:1099px){
  .topnav{display:none}
  .prof .lbl{display:none}
  .prof{padding:3px;margin-left:auto}
  .tabbar{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:var(--tabh);text-decoration:none;color:var(--muted);font-size:11px;font-weight:600;position:relative}
  .tabbar a .ic{display:grid;place-items:center;width:30px;height:24px;border-radius:6px;font-family:var(--f-display);font-weight:800;font-size:13px;font-stretch:85%}
  .tabbar a[aria-current="page"]{color:var(--ink)}
  .tabbar a[aria-current="page"] .ic{background:var(--tint);color:var(--navy)}
  .tabbar a[aria-current="page"]::before{content:"";position:absolute;top:0;left:26%;right:26%;height:2px;background:var(--navy);border-radius:0 0 2px 2px}
  body.tabs main{padding-bottom:calc(var(--tabh) + 40px)}
  body.tabs footer{padding-bottom:calc(var(--tabh) + 24px)}
}
.tabbar svg,.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

main{padding-block:24px 64px;min-height:60vh}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.15;margin:0}
h1{font-size:clamp(28px,6vw,40px);font-weight:800;font-stretch:85%}
h2{font-size:22px;font-weight:700;font-stretch:90%}
h3{font-size:17px;font-weight:700}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lede{color:var(--muted);max-width:62ch}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.section{margin-top:32px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:14px 16px;min-width:0}
.stat .v{font-family:var(--f-display);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;font-stretch:85%}
.stat .l{font-size:13px;color:var(--muted)}
@media (max-width:560px){.stats{grid-template-columns:1fr 1fr}}
.meter{height:6px;background:var(--track);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}
.small{font-size:14px;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--rb);padding:10px 16px;font-weight:600;font-size:15px;cursor:pointer;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink);min-height:44px}
@media (hover:hover){.btn:hover{border-color:var(--muted)}}
.btn.go{background:var(--surface);border-color:var(--navy);color:var(--navy)}
@media (hover:hover){.btn.go:hover{background:var(--tint)}}
.btn.hi{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
@media (hover:hover){.btn.hi:hover{filter:brightness(1.08)}}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.cats{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.cat{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"t b" "m b";gap:6px 16px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.cat .row{grid-area:m}
.cat:first-child{border-top:0}
.cat .t{grid-area:t;font-weight:600;min-width:0}
.cat .btn{grid-area:b}
@media (max-width:420px){.cat{grid-template-areas:"t t" "m b"}}
.blocks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.blocks{grid-template-columns:1fr}}
.block{display:flex;flex-direction:column;gap:8px;padding:16px;border:1px dashed var(--line);border-radius:var(--r);background:var(--sunk)}
.exam{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:var(--tint);color:var(--ink);border-radius:var(--r);padding:20px}
.exam .big{font-family:var(--f-display);font-stretch:75%;font-weight:800;font-size:56px;line-height:.9;color:var(--navy)}
.exam .small{color:var(--muted)}
@media (max-width:460px){.exam{grid-template-columns:1fr}}
.note{border-left:3px solid var(--hivis);background:var(--warn-bg);padding:12px 14px;border-radius:0 8px 8px 0;font-size:14px;margin:0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border:1px solid var(--line);border-radius:var(--r);background:var(--sunk)}
.seg button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:11px 13px;border:0;border-radius:calc(var(--r) - 4px);background:transparent;color:var(--ink);cursor:pointer;text-align:left;font-weight:700;font-family:var(--f-display);font-size:17px;min-width:0}
.seg button small{font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink);box-shadow:0 1px 3px rgba(10,20,40,.18)}
.seg button[aria-pressed="true"] small{color:var(--navy-ink);opacity:.86}
@media (hover:hover){.seg button:not([aria-pressed="true"]):hover{background:var(--surface)}}

/* vraag */
.qhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);color:var(--muted)}
.chip.ov{background:var(--tint);color:var(--navy);border-color:transparent;font-family:var(--f-mono)}
.progress{height:6px;background:var(--track);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--navy)}
.qtext{font-family:var(--f-display);font-size:clamp(20px,4.4vw,24px);font-weight:700;font-stretch:92%;line-height:1.3;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr) 20px;gap:12px;align-items:start;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;line-height:1.45}
@media (hover:hover){.opt:hover:not([disabled]){border-color:var(--muted)}}
.opt .k{font-family:var(--f-mono);font-weight:600;display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.opt .tx{padding-top:3px;min-width:0}
.opt.sel{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.opt.sel .k{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.fb{border-radius:var(--r);padding:14px 16px}
.fb.ok{background:var(--ok-bg)}
.fb.no{background:var(--bad-bg)}
.fb strong{display:block;font-size:16px;margin-bottom:2px}
.fb.ok strong{color:var(--ok)} .fb.no strong{color:var(--bad)}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.nav{font-family:var(--f-mono);font-size:13px;font-weight:600;height:38px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;position:relative;font-variant-numeric:tabular-nums}
.nav.done{background:var(--sunk);border-color:var(--muted)}
.nav.cur{outline:2px solid var(--navy);outline-offset:1px}
.nav.flag::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--hivis);box-shadow:0 0 0 1px var(--hivis-ink)}
.flagbtn.on{background:var(--warn-bg);border-color:var(--hivis);color:var(--ink)}
.confirm{border:2px solid var(--bad);background:var(--bad-bg);border-radius:var(--r);padding:14px 16px}
.kbd{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}
@media (hover:none){.kbdhint{display:none}}

/* resultaat */
.verdict{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.verdict.pass h2{color:var(--ok)} .verdict.fail h2{color:var(--bad)}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th,.tbl td{text-align:left;padding:9px 10px;border-top:1px solid var(--line);vertical-align:middle}
.tbl th{font-size:12px;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-top:0}
.tbl td.n{font-family:var(--f-mono);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.stoftbl td{vertical-align:top}.stoftbl th{overflow-wrap:normal;word-break:normal}.stoftbl td:first-child{white-space:nowrap}.stoftbl.tk td:first-child{white-space:normal}
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.review{position:relative;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:16px 16px 16px 32px;display:flex;flex-direction:column;gap:8px}
.review .yours{color:var(--bad)} .review .corr{color:var(--ok)}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.hist li:first-child{border-top:0}
.pill{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.pass{background:var(--ok-bg);color:var(--ok)} .pill.fail{background:var(--bad-bg);color:var(--bad)}

/* profiel */
.idcard{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:var(--r);padding:20px}
.idcard h2{font-size:26px;font-stretch:85%}
.idcard .small{color:var(--muted)}
.aktestat{grid-column:1/-1;display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:4px 12px;align-items:center;border-radius:var(--rb);padding:12px 14px;font-size:14px}
