let S=null,tick=null,confirmStop=false,confirmSubmit=false,confirmReset=false,showExport=false,showImport=false;
function start(opts){
  S={...opts,items:opts.qs.map(q=>({id:q.id,ord:shuffle([0,1,2,3]),pick:null,flag:false})),i:0,done:false,started:Date.now()};
  S.base=opts.base||opts.qs.map(q=>q.id);
  if(opts.min)S.end=Date.now()+opts.min*60000;
  confirmStop=false;confirmSubmit=false;
  if(location.hash!=="#sessie")location.hash="sessie";else render();
  startTimer();window.scrollTo(0,0);
}
function startTimer(){clearInterval(tick);if(S&&S.end&&!S.done){tick=setInterval(()=>{if(S.end-Date.now()<=0){submit(true);return}paintTimer()},1000)}}
function paintTimer(){
  const t=$("#timer");
  if(route()==="wv"&&W){const left=wvLeft();t.hidden=false;t.textContent=fmtClock(left);t.classList.toggle("low",left<10*60000);t.setAttribute("aria-label","Resterende tijd "+Math.ceil(left/60000)+" minuten");return}
  if(!S||!S.end||S.done||route()!=="sessie"){t.hidden=true;return}
  const left=Math.max(0,S.end-Date.now());const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);
  t.hidden=false;t.textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("low",left<5*60000);t.setAttribute("aria-label","Resterende tijd "+m+" minuten");
}
function submit(auto){
  if(!S||S.done)return;
  S.done=true;S.auto=!!auto;S.finished=Date.now();clearInterval(tick);
  if(S.mode==="oefen"){S.items=S.items.filter(x=>x.pick!==null)}else{S.items.forEach(it=>record(it.id,it.pick===0))}
  const r=score();
  if(S.mode!=="oefen"){store.h.unshift({d:Date.now(),t:S.title,m:S.mod,k:S.mode,g:r.good,n:r.n,p:r.pass?1:0});store.h=store.h.slice(0,50)}
  save();window.scrollTo(0,0);render();
}
function score(){
  const n=S.items.length;const good=S.items.filter(it=>it.pick===0).length;const wrong=n-good;let pass=null;
  if(S.pass&&S.pass.maxWrong!=null)pass=wrong<=S.pass.maxWrong;else if(S.pass&&S.pass.ratio)pass=good>=Math.ceil(n*S.pass.ratio);
  return {n,good,wrong,pass};
}

function icsFor(x){

// ---------- acties ----------
// Oefenexamen: welke vragen kunnen erin, en welke zaten in het vorige examen (per module en domein bewaard)
const examKey=mod=>mod+(mod==="phb1"&&dom()==="4"?":ov":"");
function examPool(m){return m.id==="phb1"?ALL.filter(inMtx):catsOf(m).flatMap(c=>inCat(c))}
// oefenexamen PHB 1: per toetsterm precies zoveel vragen als de toetsmatrijs voorschrijft (eerst vragen die niet in het vorige examen zaten)
function mtxExam(ex){let out=[];for(const g of mtxGroups()){const pool=freshOrder(mtxQs(g),ex).filter(q=>!out.includes(q));out=out.concat(pool.slice(0,g[2]))}return shuffle(out)}
function examCount(mod){return store.h.filter(x=>x.k==="examen"&&x.m===mod).length}
function poolOf(r){if(!r)return [];const d=r.d;
  if(r.act==="examen")return examPool(MODBY[d.mod]);
  if(r.act==="oefen")return inCat(d.cat);if(r.act==="mix")return d.mod==="phb1"?ALL.filter(inMtx):inMod(d.mod);if(r.act==="mtx"){const g=mtxGroups().find(x=>x[0]===d.g);return g?mtxQs(g):[]}
  if(r.act==="fouten")return (d.mod?inMod(d.mod):MODS.flatMap(m=>inMod(m.id))).filter(q=>lastWrong(q.id)&&(!d.cat||q.c===d.cat));
  if(r.act==="herhaal")return MODS.flatMap(m=>inMod(m.id)).filter(q=>ooitFout(q.id)&&lastOk(q.id));return []}
function launch(act,d,excl){
  if(act==="oefen"){const c=d.cat;start({mode:"oefen",title:"Oefenen · "+CATS[c][1],qs:shuffle(freshOrder(inCat(c),excl).slice(0,ROUND)),mod:CATS[c][0],redo:{act,d}})}
  else if(act==="mix"){const m=MODBY[d.mod];start({mode:"oefen",title:m.code+" · Gemengd oefenen",qs:m.id==="phb1"?shuffle(freshOrder(ALL.filter(inMtx),excl).slice(0,20)):sample(catsOf(m),20,excl),mod:m.id,redo:{act,d}})}
  else if(act==="mtx"){const g=mtxGroups().find(x=>x[0]===d.g);if(!g)return;start({mode:"oefen",title:"Toetsterm "+g[0]+" · "+g[1],qs:shuffle(freshOrder(mtxQs(g),excl).slice(0,ROUND)),mod:"phb1",redo:{act,d}})}
  else if(act==="fouten"){const list=poolOf({act,d});if(!list.length){toast(d.cat?"Geen open fouten meer in dit onderwerp":"Er staan geen open fouten meer");return}start({mode:"oefen",herh:true,title:"Fouten wegwerken"+(d.cat?" · "+CATS[d.cat][1]:d.mod?" · "+MODBY[d.mod].code:""),qs:shuffle(foutVolgorde(list).slice(0,20)),mod:d.mod||"",redo:{act,d}})}
  else if(act==="herhaal"){const list=poolOf({act,d});if(!list.length){toast("Nog geen opgeloste fouten om te herhalen");return}start({mode:"oefen",herh:true,title:"Opgeloste fouten herhalen",qs:shuffle(list.slice().sort((a,b)=>store.s[a.id][3]-store.s[b.id][3]).slice(0,20)),mod:"",redo:{act,d}})}
  else if(act==="toets"){const m=MODBY[d.mod];const b=blocksOf(m)[+d.b];start({mode:"toets",title:m.code+" · Toets "+b[0]+": "+b[1],qs:sample(b[2],20,excl),mod:m.id,pass:{ratio:.7},redo:{act,d}})}
  else if(act==="examen"){const m=MODBY[d.mod];const ov=m.id==="phb1"&&dom()==="4";const key=examKey(m.id);
    const ex=new Set([...(store.e[key]||[]),...(excl||[])]);
    const qs=m.id==="phb1"?mtxExam(ex):sample(catsOf(m),m.exam.n,ex);
    store.e[key]=qs.map(q=>q.id);save();
    start({mode:"examen",title:m.code+" · "+(m.exam.naam||"Oefenexamen "+m.name+(ov?" domein IV":"")),qs,mod:m.id,pass:{maxWrong:m.exam.maxWrong},min:m.exam.min,redo:{act,d}})}
}

  if((act.indexOf("lic-")===0||act==="ob-lic")&&licAct(act))return;
  if(["oefen","mix","fouten","herhaal","toets","examen","mtx"].includes(act)){launch(act,{...d});return}
  if(act==="akte-edit"){const go=()=>{const f=$("#pAkte");if(f){f.scrollIntoView({block:"center"});f.focus()}};if($("#pAkte"))go();else{location.hash="profiel";setTimeout(go,120)}return}
  if(act==="thema"){store.p.thema=d.v;save();applyTheme();render();toast(d.v==="donker"?"Donkere weergave":d.v==="licht"?"Lichte weergave":"Weergave volgt je systeem");return}
  if(act==="dom"){if(lic())return;store.p.dom=d.v;save();render();toast(d.v==="4"?"Domein IV openbaar vervoer gekozen":"Domein I–III gekozen");return}
  if(act==="ex-new"){exOpen=true;exEdit=null;lastAdded=null;render();const f=$("#exDatum");if(f)f.focus();return}
  if(act==="ex-alles"){exAlles=true;render();return}
  if(act==="ex-cal"){calFor=calFor===d.id?null:d.id;render();return}
  if(act==="ex-ics"){const x=store.x.find(x=>x.id===d.id);if(x)downloadIcs(x);return}
  if(act==="cal-close"){lastAdded=null;render();return}
  if(act==="ex-edit"){exEdit=d.id;exOpen=true;exDel=null;lastAdded=null;render();const w=document.getElementById("exFormWrap");if(w)w.scrollIntoView({block:"start"});return}
  if(act==="ex-cancel"){exEdit=null;exOpen=false;render();return}
  if(act==="ex-del"){exDel=d.id;render();return}
  if(act==="ex-del-no"){exDel=null;render();return}
  if(act==="ex-del-yes"){store.x=store.x.filter(x=>x.id!==d.id);exDel=null;if(exEdit===d.id)exEdit=null;save();render();toast("Examen verwijderd");return}
  if(act==="reset"){confirmReset=true;render();return}
  if(act==="reset-no"){confirmReset=false;render();return}
  if(act==="reset-yes"){store=blank();save();applyTheme();confirmReset=false;obDom=null;obExam=false;obErr={};obDraft=null;location.hash="home";render();toast("Alles gewist");return}
  if(act==="export"){showExport=!showExport;showImport=false;render();if(showExport){const t=$("#expCode");const code=t.value;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(code).then(()=>toast("Code gekopieerd"),()=>{t.focus();t.select();toast("Selecteer en kopieer de code")})}else{t.focus();t.select()}}return}
  if(act==="import"){showImport=!showImport;showExport=false;render();return}
  if(act==="import-go"){try{importCode($("#impCode").value);applyTheme();showImport=false;render();toast("Voortgang geladen")}catch(err){toast("Deze code klopt niet. Kopieer hem opnieuw, helemaal.")}return}
  if(!S)return;
  if(act==="pick"){const it=S.items[S.i];if(S.mode==="oefen"){if(it.pick!==null)return;it.pick=+d.o;record(it.id,it.pick===0);foutTerug(it);save()}else{it.pick=+d.o}render();return}
  if(act==="next"){if(S.i<S.items.length-1){S.i++;confirmSubmit=false;pageAnim=true;render();focusQ()}return}
  if(act==="prev"){if(S.i>0){S.i--;pageAnim=true;render();focusQ()}return}
  if(act==="go"){S.i=+d.k;render();focusQ();return}
  if(act==="flag"){S.items[S.i].flag=!S.items[S.i].flag;render();return}
  if(act==="finish"){submit(false);return}
  if(act==="ask-submit"){confirmSubmit=true;render();const c=document.querySelector(".confirm");if(c)c.scrollIntoView({block:"center"});return}
  if(act==="no-submit"){confirmSubmit=false;render();return}
  if(act==="submit"){confirmSubmit=false;submit(false);return}
  if(act==="redo-wrong"){const qs=[...new Set(S.items.filter(it=>it.pick!==0&&!(S.herh&&lastOk(it.id))).map(it=>it.id))].map(id=>BYID[id]);if(!qs.length){toast("Alle fouten uit deze ronde zijn opgelost");return}start({mode:"oefen",herh:!!S.herh,title:"Fouten opnieuw",qs:shuffle(qs),mod:S.mod,redo:S.redo,base:S.base});return}
  if(act==="redo-same"){const qs=[...new Set(S.items.map(it=>it.id))].map(id=>BYID[id]);start({mode:"oefen",title:"Dezelfde vragen opnieuw",qs:shuffle(qs),mod:S.mod,redo:S.redo,base:S.base});return}
  if(act==="again"){if(S.locked)return;const r=S.redo;if(r)launch(r.act,r.d,new Set(S.base));return}
  if(act==="stop-yes"){const m=S.mod;clearInterval(tick);S=null;confirmStop=false;location.hash=m||"home";return}
  if(act==="stop-no"){confirmStop=false;render();return}
});
document.addEventListener("change",e=>{
  if(e.target.id==="obRol"){obDraft=obCollect();delete obErr.rol;delete obErr.akte;render();const f=$(obDraft.rol==="werkend"?"#obAkte":"#obRol-cs");if(f)f.focus();return}
  if(e.target.id==="pRol"){const f=$("#pAkteF");if(f)f.hidden=e.target.value!=="werkend";return}
  if(e.target.id==="obHas"){obDraft=obCollect();obExam=e.target.checked;delete obErr.datum;render();const f=$("#obDatum");if(f&&obExam)f.focus()}});
document.addEventListener("submit",e=>{
  if(e.target.id==="obForm"){e.preventDefault();obSubmit();return}
  if(e.target.id==="ytForm"){e.preventDefault();ytSubmit();return}
  if(e.target.id==="exForm"){e.preventDefault();
    const v=id=>$("#"+id).value.trim().slice(0,80);
    const rec={mod:v("exMod"),soort:v("exSoort"),datum:v("exDatum"),tijd:v("exTijd"),loc:v("exLoc"),status:v("exStatus"),score:v("exScore"),note:v("exNote")};
    if(!rec.datum){toast("Vul een datum in");return}
    if(exEdit){const x=store.x.find(x=>x.id===exEdit);if(x)Object.assign(x,rec);lastAdded=exEdit;exEdit=null;toast("Examen gewijzigd")}
    else{rec.id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);store.x.push(rec);lastAdded=rec.id;toast(rec.status==="gepland"?"Examen opgeslagen":"Uitslag opgeslagen")}
    exOpen=false;save();render();const w=document.getElementById("exFormWrap");if(w)w.scrollIntoView({block:"start"});return}
  if(e.target.id!=="profForm")return;e.preventDefault();
  store.p.naam=$("#pNaam").value.trim().slice(0,60);store.p.werk=$("#pWerk").value.trim().slice(0,60);store.p.rol=$("#pRol").value;store.p.akte=store.p.rol==="werkend"?$("#pAkte").value:"";
  save();render();toast("Profiel opgeslagen");
});
$("#stopBtn").addEventListener("click",()=>{if(route()==="wv"&&W){wvCollect();wvAskStop=true;render();window.scrollTo(0,0);return}if(!S)return;if(S.mode==="oefen"&&S.items.some(x=>x.pick!==null)){submit(false);return}confirmStop=true;render();window.scrollTo(0,0)});
function focusQ(){const t=$("#qtext");if(t){t.setAttribute("tabindex","-1");t.focus({preventScroll:true});window.scrollTo(0,0)}}
document.addEventListener("keydown",e=>{
  if(!S||S.done||keysOpen||route()!=="sessie"||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.target.closest&&e.target.closest("input,textarea"))return;
  const k=e.key.toUpperCase();let pos=LET.indexOf(k);if(pos<0)pos=["1","2","3","4"].indexOf(k);
  const it=S.items[S.i];
  if(pos>-1){const btn=document.querySelectorAll(".opt")[pos];if(btn&&!btn.disabled){btn.click();e.preventDefault()}return}
  if(e.key==="Enter"&&S.mode==="oefen"&&it.pick!==null){const nb=document.querySelector('[data-act="next"],[data-act="finish"]');if(nb&&!(document.activeElement&&document.activeElement.closest("button,a"))){nb.click();e.preventDefault()}}
  if(S.mode!=="oefen"){if(e.key==="ArrowRight"&&S.i<S.items.length-1){S.i++;render()}if(e.key==="ArrowLeft"&&S.i>0){S.i--;render()}}
});
window.addEventListener("hashchange",()=>{
  if(W&&route()!=="wv"){wvCollect();wvSaveDraft();wvAskStop=true;location.hash="wv";return}
  if(route()!=="wv")wvAskStop=false;wvAskSubmit=false;wvDel=null;ytDel=null;if(route()!=="phb3")ytForm=null;
  if(S&&!S.done&&route()!=="sessie"&&S.mode!=="oefen"){location.hash="sessie";confirmStop=true;return}
  confirmReset=false;showExport=false;showImport=false;exEdit=null;exDel=null;exOpen=false;calFor=null;lastAdded=null;exAlles=false;pageAnim=true;render();
  const r=route();if(r.indexOf("stof-")===0){const el=document.getElementById("s-"+r.slice(5));if(el){el.scrollIntoView({block:"start"});return}}
  if(r==="profiel-phb3"){const el=document.getElementById("pmod-phb3");if(el){el.scrollIntoView({block:"start"});return}}
  window.scrollTo(0,0);
  // schermlezers: na een paginawissel de focus op de kop van de nieuwe pagina
  const h=document.querySelector("#app h1, #app h2");if(h&&r!=="sessie"){h.setAttribute("tabindex","-1");h.focus({preventScroll:true})}
});
if(route()==="sessie"&&!S)location.hash="home";
if(route()==="wv"&&!W&&store.wd&&wvGet(store.wd.sc,store.wd.seed)){W={...store.wd};if(W.phase==="film1"||W.phase==="film2")W.restart=1;if(W.phase==="pauze")W.p0=Date.now();wvTimer()}
render();window.__launchDone&&window.__launchDone();mldInit();nieuwCheck();
if(route()==="profiel-phb3"){const el=document.getElementById("pmod-phb3");if(el)el.scrollIntoView({block:"start"})}
(function(){const r=route();if(r.indexOf("stof-")===0){const el=document.getElementById("s-"+r.slice(5));if(el)el.scrollIntoView({block:"start"})}})();
})();
</script>
