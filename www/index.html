<script>const Q1 = [
["sr", "Welke staatsvorm kent Nederland volgens de Grondwet?", ["Een gedecentraliseerde eenheidsstaat.", "Een federale bondsstaat.", "Een centrale eenheidsstaat zonder lagere overheden.", "Een statenbond van zelfstandige provincies."], "De centrale overheid draagt een deel van haar regelgevende bevoegdheid over aan provincies, gemeenten en waterschappen. Die lagere overheden mogen zelf regels (verordeningen) maken.", "Grondwet", "q1gsivft"],
["sr", "Welke drie kenmerken moet een gebied hebben om een staat te zijn?", ["Grondgebied, bevolking en overheidsgezag.", "Grondwet, staatshoofd en parlement.", "Leger, munt en taal.", "Rechtspraak, politie en belastingen."], "Een staat heeft een eigen grondgebied, een bevolking die daar woont en een overheid die daar gezag uitoefent.", "", "qeuxg42"],
["sr", "Hoe noemen we de leer van de scheiding tussen de wetgevende, de uitvoerende en de rechterlijke macht?", ["Trias politica.", "Legaliteitsbeginsel.", "Opportuniteitsbeginsel.", "Dualisme."], "De trias politica verdeelt de staatsmacht over drie machten die elkaar in evenwicht houden. De rechterlijke macht is onafhankelijk.", "", "qx19mwl"],
["sr", "Wie vormen samen de regering volgens artikel 42 lid 1 van de Grondwet?", ["De Koning en de ministers.", "De ministers en de staatssecretarissen.", "De Koning, de ministers en de staatssecretarissen.", "De Eerste en Tweede Kamer samen."], "De regering bestaat uit de Koning en de ministers. Ministers en staatssecretarissen samen heten het kabinet.", "art. 42 lid 1 Gw", "qbavj74"],
["sr", "Uit wie bestaat het kabinet?", ["De ministers en de staatssecretarissen.", "De Koning en de ministers.", "De minister-president en de Tweede Kamer.", "De ministers en de Commissarissen van de Koning."], "Het kabinet is het beleidsvoerende orgaan: alle ministers en staatssecretarissen. De Koning hoort er niet bij.", "", "q19k4c5v"],
["sr", "De Koning is onschendbaar. Wie is volgens artikel 42 lid 2 van de Grondwet verantwoordelijk voor wat de Koning doet?", ["De ministers.", "De Eerste Kamer.", "De Raad van State.", "Niemand."], "Volgens de Grondwet is de Koning onschendbaar en zijn de ministers verantwoordelijk (ministeriële verantwoordelijkheid). Zij leggen verantwoording af aan de Staten-Generaal.", "art. 42 lid 2 Gw", "q8szqv1"],
["sr", "Welke Kamer heeft het recht van amendement, het recht om een wetsvoorstel te wijzigen?", ["Alleen de Tweede Kamer.", "Alleen de Eerste Kamer.", "Beide Kamers.", "Geen van beide; dat doet de Raad van State."], "De Tweede Kamer heeft het recht van initiatief en het recht van amendement. De Eerste Kamer kan een wetsvoorstel alleen aannemen of verwerpen.", "art. 84 Gw", "qwy948z"],
["sr", "Op welke manier worden de leden van de Eerste Kamer volgens artikel 55 van de Grondwet gekozen?", ["Indirect, door de leden van Provinciale Staten.", "Rechtstreeks door alle kiesgerechtigde Nederlanders.", "Door de gemeenteraden.", "Door de leden van de Tweede Kamer, na de verkiezingen."], "De Eerste Kamer wordt via getrapte verkiezingen gekozen door de leden van Provinciale Staten (aangevuld met kiescolleges voor Caribisch Nederland en niet-ingezetenen).", "art. 55 Gw", "q11sil2x"],
["sr", "In welk artikel van de Grondwet is het huisrecht geregeld?", ["Artikel 12.", "Artikel 10.", "Artikel 13.", "Artikel 15."], "Artikel 12 Grondwet: een woning binnentreden zonder toestemming van de bewoner mag alleen in de gevallen die bij of krachtens de wet zijn bepaald, door daartoe aangewezen personen. De Algemene wet op het binnentreden (Awbi) werkt dit uit. Artikel 10 gaat over de persoonlijke levenssfeer, artikel 13 over het brief- en telefoongeheim en artikel 15 over de persoonlijke vrijheid.", "art. 12 Gw", "q63byil"],
["sr", "Door wie wordt een wet in formele zin volgens artikel 81 van de Grondwet vastgesteld?", ["Door regering en Staten-Generaal samen.", "Alleen door de Tweede Kamer, na advies van de Raad van State.", "Door de regering alleen, bij koninklijk besluit.", "Door de Raad van State, als hoogste adviesorgaan."], "Een wet in formele zin komt tot stand door samenwerking van regering en Staten-Generaal. Voorbeelden: Wetboek van Strafrecht, Opiumwet, Gemeentewet.", "art. 81 Gw", "q91yzql"],
["sr", "Vanaf welk moment is een aangenomen wet verbindend?", ["Na bekendmaking in het Staatsblad.", "Direct na stemming in de Eerste Kamer.", "Na ondertekening door de minister-president.", "Na een positief advies van de Raad van State."], "Na aanname door beide Kamers volgt bekrachtiging door Koning en minister(s). De wet verbindt pas na bekendmaking in het Staatsblad.", "art. 88 Gw", "q475lci"],
["sr", "Wat verstaan we onder een algemene maatregel van bestuur (AMvB)?", ["Een wet in materiële zin, vastgesteld door de regering.", "Een wet in formele zin, vastgesteld door regering en parlement.", "Een verordening van de gemeenteraad met landelijke werking.", "Een uitspraak van de Hoge Raad die voor iedereen geldt."], "Een AMvB werkt een formele wet verder uit en mag daarmee niet in strijd zijn. Voorbeeld: het RVV 1990 en het Besluit buitengewoon opsporingsambtenaar.", "", "q8habne"],
["sr", "Welk bestuursorgaan stelt de Algemene Plaatselijke Verordening (APV) vast?", ["De gemeenteraad.", "De burgemeester.", "Het college van B&W.", "Gedeputeerde Staten."], "De gemeenteraad is het hoogste orgaan van de gemeente en stelt verordeningen zoals de APV vast. De APV geldt alleen binnen die gemeente.", "art. 147 Gemeentewet", "q1ueye6s"],
["sr", "Op welke manier en voor hoe lang wordt een burgemeester benoemd?", ["Bij koninklijk besluit, voor zes jaar.", "Door de gemeenteraad, voor vier jaar.", "Door de commissaris van de Koning, voor zes jaar.", "Rechtstreeks door de inwoners, voor vier jaar."], "De burgemeester wordt op voordracht van de minister van BZK bij koninklijk besluit benoemd voor zes jaar. Herbenoeming is mogelijk.", "art. 61 Gemeentewet", "qq14mrw"],
["sr", "Je houdt iemand aan zonder dat de wet je daarvoor een bevoegdheid geeft. Welk grondrecht schend je dan in de eerste plaats?", ["Het recht op persoonlijke vrijheid (artikel 15 Grondwet).", "Het huisrecht (artikel 12 Grondwet).", "Het recht op privacy van de burger (artikel 10 Grondwet).", "Het gelijkheidsbeginsel (artikel 1 Grondwet)."], "Artikel 15 lid 1 Grondwet: buiten de gevallen bij of krachtens de wet bepaald mag niemand zijn vrijheid worden ontnomen. Een aanhouding is vrijheidsbeneming en mag dus alleen als een wet (zoals het Wetboek van Strafvordering) daarvoor een bevoegdheid geeft.", "art. 15 Gw", "q5z2z5g"],
["sr", "Welk orgaan vormt het dagelijks bestuur van de provincie?", ["Gedeputeerde Staten.", "Provinciale Staten.", "De Eerste Kamer.", "Het waterschap."], "Provinciale Staten is de gekozen volksvertegenwoordiging. Gedeputeerde Staten (gedeputeerden en commissaris van de Koning) vormt het dagelijks bestuur.", "", "q1tum8e5"],
["sr", "Welke hoofdregel geldt voor de benoeming van een wethouder?", ["Hij wordt benoemd door de raad en is dan geen raadslid meer.", "Hij wordt benoemd door de burgemeester en blijft gewoon raadslid.", "Hij wordt rechtstreeks gekozen door de inwoners van de gemeente.", "Hij wordt bij koninklijk besluit benoemd voor een periode van zes jaar."], "Sinds de dualisering benoemt de raad de wethouders. Een wethouder kan niet tegelijk raadslid zijn.", "Gemeentewet", "q1kn7oj9"],
["sr", "Wat houdt het actief kiesrecht in?", ["Het recht om te kiezen.", "Het recht om gekozen te worden.", "Het recht om een wetsvoorstel in te dienen.", "Het recht om een minister te ondervragen."], "Actief kiesrecht is stemmen. Passief kiesrecht is het recht om gekozen te worden.", "", "q2dltq2"],
["sr", "Welk grondrecht beperk je in de eerste plaats als je iemand fouilleert door zijn kleding af te tasten?", ["De onaantastbaarheid van het lichaam (artikel 11 Grondwet).", "Het huisrecht (artikel 12 Grondwet).", "Het brief- en telefoongeheim (artikel 13 Grondwet).", "Het recht op eerbiediging van de persoonlijke levenssfeer (artikel 10 Grondwet)."], "Artikel 11 Grondwet beschermt het recht op onaantastbaarheid van het lichaam. Een fouillering beperkt dat recht en is daarom alleen toegestaan als een wet er een bevoegdheid voor geeft, zoals artikel 56 Sv bij een aangehouden verdachte.", "art. 11 Gw", "qjrz5n4"],
["sr", "Welke taak heeft de Raad van State bij een wetsvoorstel?", ["Hij adviseert de regering over het voorstel.", "Hij stemt als derde Kamer over het voorstel.", "Hij ondertekent het voorstel.", "Hij publiceert het voorstel in het Staatsblad."], "De Afdeling advisering van de Raad van State toetst wetsvoorstellen en AMvB's onder meer op strijd met hogere regels en verdragen.", "", "qbqjbuy"],
["ro", "De politierechter veroordeelt een verdachte. De verdachte is het niet eens met het vonnis. Welk rechtsmiddel kan hij instellen?", ["Hoger beroep bij het gerechtshof.", "Cassatie bij de Hoge Raad.", "Herziening bij de Hoge Raad.", "Beklag bij het gerechtshof."], "Tegen een vonnis van de rechtbank (ook van de politierechter) staat hoger beroep open bij het gerechtshof. De termijn is 14 dagen na de uitspraak. Pas tegen het arrest van het hof staat cassatie bij de Hoge Raad open. Herziening is een buitengewoon rechtsmiddel na een onherroepelijk vonnis, beklag gaat over het niet vervolgen.", "art. 404 en 408 Sv", "q1i9dnla"],
["ro", "Hoe noemen we de uitspraak van een gerechtshof of van de Hoge Raad?", ["Arrest.", "Vonnis.", "Beschikking.", "Dagvaarding."], "De rechtbank wijst een vonnis; het gerechtshof en de Hoge Raad wijzen een arrest.", "", "qms8vsg"],
["ro", "Welke rechter behandelt eenvoudige strafzaken waarin ten hoogste één jaar gevangenisstraf kan worden opgelegd?", ["De politierechter.", "De kantonrechter.", "De meervoudige kamer.", "De rechter-commissaris."], "De politierechter is een enkelvoudige rechter van de rechtbank voor eenvoudig te bewijzen zaken; hij kan ten hoogste één jaar gevangenisstraf opleggen.", "art. 369 Sv", "q4hl39x"],
["ro", "Welke strafzaken behandelt de kantonrechter vooral?", ["Overtredingen.", "Zware misdrijven.", "Hoger beroep.", "Ambtsmisdrijven van ministers."], "De kantonrechter is een enkelvoudige rechter die vooral overtredingen behandelt.", "", "qyak9pc"],
["ro", "Uit hoeveel rechters bestaat de meervoudige kamer van de rechtbank?", ["Drie.", "Twee.", "Vijf.", "Eén."], "Zwaardere en ingewikkelde misdrijven gaan naar de meervoudige kamer met drie rechters.", "", "q1nhi79z"],
["ro", "Waarop richt de Hoge Raad zich bij de behandeling in cassatie?", ["Op de toepassing van het recht en de vormvoorschriften.", "Op een nieuwe beoordeling van alle feiten en het bewijs in de zaak.", "Alleen op de hoogte van de straf die het hof heeft opgelegd.", "Op nieuw bewijs dat na de uitspraak bekend is geworden."], "In cassatie beoordeelt de Hoge Raad of het recht goed is toegepast en of de uitspraak voldoende gemotiveerd is. De feiten staan vast.", "", "qpmp0e"],
["ro", "Een veroordeelde wil een onherroepelijk vonnis laten herzien, omdat er een nieuw feit (novum) bekend is. Welk rechtsmiddel sluit hierop aan?", ["Herziening, een buitengewoon rechtsmiddel.", "Hoger beroep, een gewoon rechtsmiddel bij het hof.", "Cassatie, een gewoon rechtsmiddel bij de Hoge Raad.", "Verzet, een rechtsmiddel tegen een strafbeschikking."], "Herziening bij de Hoge Raad is een buitengewoon rechtsmiddel dat zich richt op een nieuw gebleken feit.", "", "q10161yr"],
["ro", "Wie kan als enige een strafzaak aan de strafrechter voorleggen?", ["Het Openbaar Ministerie.", "De politie.", "Het slachtoffer.", "De rechter-commissaris."], "Het Openbaar Ministerie heeft het vervolgingsmonopolie. Een rechter oordeelt alleen over zaken die het Openbaar Ministerie aan hem voorlegt.", "", "qtv79t4"],
["ro", "Wie treedt bij het gerechtshof op als aanklager?", ["De advocaat-generaal.", "De officier van justitie.", "De procureur-generaal bij de Hoge Raad.", "De rechter-commissaris."], "Bij de rechtbank is de officier van justitie aanklager, bij het gerechtshof de advocaat-generaal.", "", "qhf7jwe"],
["ro", "Wat houdt het opportuniteitsbeginsel van artikel 167 Sv in?", ["Het Openbaar Ministerie mag afzien van vervolging om redenen van algemeen belang.", "Het Openbaar Ministerie moet elk strafbaar feit vervolgen als het bewijs rond is.", "Een verdachte mag zelf kiezen voor welke rechter hij komt.", "De rechter mag zelf zaken aanbrengen als het Openbaar Ministerie stilzit."], "Het Openbaar Ministerie heeft geen vervolgingsplicht. Het mag seponeren, ook als de zaak haalbaar is, bijvoorbeeld bij een zeer gering feit.", "art. 167 Sv", "q15rhzym"],
["ro", "Een benadeelde is het niet eens met de beslissing om een verdachte niet te vervolgen. Waar kan hij terecht?", ["Bij het gerechtshof, met een beklag (artikel 12 Sv).", "Bij de Hoge Raad, via een cassatieberoep tegen het sepot.", "Bij de rechter-commissaris, via een verzoek tot vervolging.", "Bij de Nationale ombudsman, met een klacht over het Openbaar Ministerie."], "Met een artikel 12 Sv-procedure kan een rechtstreeks belanghebbende het gerechtshof vragen vervolging te bevelen.", "art. 12 Sv", "qjvz56c"],
["ro", "Welke straf kan de officier van justitie NIET opleggen met een strafbeschikking als bedoeld in artikel 257a Sv?", ["Een vrijheidsbenemende straf zoals gevangenisstraf.", "Een geldboete voor een misdrijf of voor een overtreding.", "Een taakstraf van maximaal 180 uur voor een misdrijf.", "Een ontzegging van de rijbevoegdheid tot zes maanden."], "Met een strafbeschikking kan het Openbaar Ministerie zelf straffen voor overtredingen en misdrijven met maximaal zes jaar gevangenisstraf. Vrijheidsbeneming blijft voorbehouden aan de rechter.", "art. 257a Sv", "qzeirdp"],
["ro", "Wat is de maximale duur van een ontzegging van de rijbevoegdheid die de officier van justitie met een strafbeschikking kan opleggen?", ["Zes maanden.", "Drie maanden.", "Een jaar.", "Vijf jaar."], "Een strafbeschikking kan een rijontzegging van ten hoogste zes maanden bevatten.", "art. 257a Sv", "q1i3fc73"],
["ro", "Welke taak heeft de rechter-commissaris in het strafproces?", ["Het onderzoek toetsen en bijvoorbeeld bewaring of woningdoorzoeking bevelen.", "Strafzaken op de openbare zitting behandelen en vonnis wijzen.", "De aanklacht opstellen en de verdachte dagvaarden voor de openbare zitting.", "Het vonnis ten uitvoer leggen en toezien op de tenuitvoerlegging."], "De rechter-commissaris behandelt geen zaken ter zitting maar heeft een toetsende rol in het onderzoek, met verdergaande bevoegdheden dan de officier van justitie.", "", "q1l768eu"],
["ro", "Welke van de onderstaande mogelijkheden is GEEN wettig bewijsmiddel als bedoeld in artikel 339 Sv?", ["Een vermoeden van de officier van justitie.", "Een verklaring van een getuige die onder ede is gehoord.", "Een schriftelijk bescheid zoals een proces-verbaal.", "De eigen waarneming van de rechter ter zitting."], "De wettige bewijsmiddelen zijn: eigen waarneming van de rechter, verklaringen van verdachte, getuige en deskundige, en schriftelijke bescheiden.", "art. 339 Sv", "q1pqmnh7"],
["ro", "De rechter vindt het feit bewezen, maar de verdachte handelde uit noodweer. Welke uitspraak volgt?", ["Ontslag van alle rechtsvervolging (OVAR).", "Vrijspraak wegens een rechtvaardigingsgrond.", "Niet-ontvankelijkheid van het Openbaar Ministerie.", "Schuldigverklaring zonder oplegging van straf."], "Bij OVAR is het feit bewezen, maar het feit of de dader is niet strafbaar door een strafuitsluitingsgrond. Bij vrijspraak is het feit niet bewezen.", "", "q1hli01g"],
["ro", "Wie bedoelen we met de 'staande magistratuur'?", ["De leden van het Openbaar Ministerie.", "De rechters die zitting hebben in de rechtbank.", "De raadsheren die rechtspreken bij de Hoge Raad.", "De griffiers die het proces-verbaal opmaken."], "Het Openbaar Ministerie staat op tijdens de zitting (staande magistratuur). Rechters zitten (zittende magistratuur) en spreken recht.", "", "q11d2z4k"],
["ro", "Op welke manier worden rechters benoemd?", ["Bij koninklijk besluit, voor het leven.", "Door de minister van Justitie en Veiligheid, voor zes jaar.", "Door de Tweede Kamer, voor een periode van vier jaar.", "Door de Hoge Raad zelf, voor een termijn van tien jaar."], "Benoeming voor het leven waarborgt de onafhankelijkheid. Ontslag kan alleen in wettelijk bepaalde gevallen, op vordering van de procureur-generaal bij de Hoge Raad.", "art. 117 Gw", "q5zgvu1"],
["ro", "Wat regelt de relatieve competentie?", ["Welke van de rechtbanken of gerechtshoven geografisch bevoegd is.", "Welk soort gerecht bevoegd is: rechtbank, gerechtshof of Hoge Raad.", "Welke straf de rechter in een bepaalde zaak maximaal mag opleggen.", "Of het Openbaar Ministerie een verdachte in een bepaalde zaak wel of niet mag vervolgen."], "Absolute competentie gaat over het soort gerecht (Wet RO). Relatieve competentie gaat over welk gerecht van die soort, dus waar (Wetboek van Strafvordering).", "", "q1vmv6e2"],
["ro", "Welke functionaris behoort NIET tot het Openbaar Ministerie?", ["De procureur-generaal bij de Hoge Raad.", "De officier van justitie.", "De advocaat-generaal bij het gerechtshof.", "Het College van procureurs-generaal in Den Haag."], "De procureur-generaal bij de Hoge Raad is onafhankelijk en hoort niet bij het Openbaar Ministerie. Hij kan wel cassatie in het belang der wet instellen.", "", "qkk5yy5"],
["ro", "Wie staat aan het hoofd van het Openbaar Ministerie?", ["Het College van procureurs-generaal.", "De minister-president als voorzitter van de ministerraad.", "De president van de Hoge Raad der Nederlanden.", "De hoofdofficier van het grootste parket."], "Het College van procureurs-generaal leidt het Openbaar Ministerie. Het valt onder de verantwoordelijkheid van de minister van Justitie en Veiligheid.", "", "q1xkig7i"],
["boa", "In welk artikel van het Wetboek van Strafvordering zijn de buitengewoon opsporingsambtenaren geregeld?", ["Artikel 142 Sv.", "Artikel 141 Sv.", "Artikel 27 Sv.", "Artikel 53 Sv."], "Art. 141 Sv noemt de algemene opsporingsambtenaren, art. 142 Sv de buitengewoon opsporingsambtenaren. Nadere regels staan in het Besluit buitengewoon opsporingsambtenaar.", "art. 142 Sv", "q19xgtrh"],
["boa", "Wie is GEEN algemeen opsporingsambtenaar in de zin van artikel 141 Sv?", ["Een boa in de openbare ruimte.", "Een politieambtenaar aangesteld voor de politietaak.", "Een officier van justitie.", "Een aangewezen militair van de Koninklijke Marechaussee."], "Art. 141 Sv: officier van justitie, politie (politietaak), aangewezen KMar-militairen en opsporingsambtenaren van de bijzondere opsporingsdiensten. Een boa valt onder art. 142 Sv.", "art. 141 Sv", "qy9lt1n"],
["boa", "Wat is het belangrijkste verschil tussen een algemeen en een buitengewoon opsporingsambtenaar?", ["De boa mag alleen de feiten uit zijn akte of aanwijzing opsporen.", "De boa mag alle strafbare feiten in heel Nederland opsporen.", "De boa valt niet onder het gezag van de officier van justitie.", "Er is geen verschil, alleen de werkgever verschilt."], "Algemene opsporingsambtenaren mogen in beginsel alle strafbare feiten opsporen. De boa heeft een beperkte opsporingsbevoegdheid: alleen de feiten en het gebied waarvoor hij is aangewezen.", "", "q16onpfp"],
["boa", "Aan welke eisen moet een boa voldoen om opsporingsbevoegdheid te krijgen?", ["Bekwaam en betrouwbaar zijn, een akte hebben en beëdigd zijn.", "Een mbo-4 diploma en een verklaring omtrent het gedrag hebben.", "Minstens vijf jaar bij de politie of marechaussee hebben gewerkt.", "Lid zijn van een erkende vakbond of beroepsvereniging voor boa's."], "De boa moet bekwaam en betrouwbaar zijn, een rechtsgrond voor zijn bevoegdheid hebben (meestal de akte) en de ambtseed of -belofte hebben afgelegd.", "Besluit boa", "q1qseubj"],
["boa", "Voor welke periode wordt de akte van opsporingsbevoegdheid van een boa ten hoogste verleend?", ["Vijf jaar.", "Eén jaar.", "Drie jaar.", "Onbeperkt."], "De opsporingsbevoegdheid wordt telkens voor maximaal vijf jaar verleend. De boa moet zijn bekwaamheid blijven aantonen via PHB.", "Besluit boa", "qhj0xuh"],
["boa", "Je bent boa en ziet een winkeldiefstal op heterdaad. Het feit valt NIET onder je akte van opsporingsbevoegdheid. Wat mag je doen?", ["De verdachte aanhouden, zoals iedereen dat mag bij heterdaad.", "Niets, want het feit valt buiten je opsporingsbevoegdheid.", "De verdachte staande houden en een proces-verbaal opmaken.", "De verdachte fouilleren en de buit in beslag nemen."], "Buiten je akte heb je geen opsporingsbevoegdheden. Wel mag je, net als iedere burger, een verdachte op heterdaad aanhouden (artikel 53 Sv). Je draagt hem daarna zo snel mogelijk over aan de politie. Fouilleren, in beslag nemen en een proces-verbaal opmaken voor dit feit horen niet bij je bevoegdheden.", "art. 53 Sv; art. 142 Sv", "q1b54tc9"],
["boa", "Wanneer mag een boa geweld gebruiken of handboeien aanleggen?", ["Alleen als die bevoegdheid is toegekend en hij er bekwaam voor is.", "Altijd, want elke opsporingsambtenaar mag geweld gebruiken.", "Alleen met toestemming van de burgemeester, per geval en altijd vooraf.", "Nooit; geweld en handboeien zijn altijd voorbehouden aan de politie."], "Politiebevoegdheden zoals geweld en vrijheidsbeperkende middelen komen een boa alleen toe als ze zijn toegekend en de vereiste (periodieke) toetsing met goed gevolg is afgelegd.", "art. 7 Politiewet 2012; Besluit boa", "q14vi2yx"],
["boa", "Wat verstaan we onder 'geweld' in de zin van de Ambtsinstructie?", ["Elke dwangmatige kracht van meer dan geringe betekenis op personen of zaken.", "Alleen het gebruik van een wapen of diensthond tegen personen.", "Elke vorm van lichamelijk contact met een persoon, hoe licht ook, bij een controle.", "Alleen kracht die letsel veroorzaakt of kan veroorzaken."], "Geweld is iedere dwangmatige krachtsuitoefening van meer dan geringe betekenis op personen of zaken. Het moet voldoen aan subsidiariteit en proportionaliteit.", "Ambtsinstructie", "q1ykptto"],
["boa", "Wat moet een boa gedaan hebben voordat hij zijn bevoegdheden mag uitoefenen?", ["De ambtseed of ambtsbelofte afleggen.", "Een proefexamen halen bij het examenbureau ExTH.", "Een jaar stage lopen bij de politie of marechaussee.", "Zich inschrijven bij de gemeente waar hij werkt."], "Pas na beëdiging mag de boa zijn opsporingsbevoegdheid en eventuele politiebevoegdheden uitoefenen. Zijn processen-verbaal maakt hij op ambtseed op.", "", "q1azzh4f"],
["boa", "Onder wiens gezag staat een boa volgens artikel 148 Sv bij de opsporing van strafbare feiten?", ["De officier van justitie.", "De burgemeester.", "Zijn werkgever.", "De korpschef van politie."], "Bij opsporing staat iedere opsporingsambtenaar, ook de boa, onder gezag van de officier van justitie.", "art. 148 Sv", "qq2errk"],
["boa", "Wat verstaan we volgens artikel 132a Sv onder opsporing?", ["Onderzoek naar strafbare feiten onder gezag van de officier van justitie, gericht op strafvorderlijke beslissingen.", "Alle controles die een ambtenaar zonder verdenking uitvoert om naleving van regels te bevorderen.", "Het houden van toezicht op de naleving van vergunningen en voorschriften.", "Het afnemen van een verklaring van een getuige op straat, zonder verdenking."], "Opsporing is gericht op strafvorderlijke beslissingen (vervolgen, seponeren). Toezicht gebeurt zonder verdenking en valt onder de Awb.", "art. 132a Sv", "q1ygn81e"],
["boa", "Wanneer is een boa bevoegd om een strafbaar feit op te sporen?", ["Als het feit in zijn akte staat en hij in functie en in zijn werkgebied is.", "Altijd, ook buiten diensttijd, als hij zijn legitimatiebewijs bij zich heeft.", "Als de politie hem ter plaatse om hulp vraagt, ook buiten zijn akte.", "Als het feit wordt gepleegd in de gemeente waar hij woont."], "Een boa is alleen bevoegd voor de strafbare feiten die in zijn akte (of domeinlijst) staan, binnen het werkgebied uit de akte en tijdens de uitoefening van zijn functie. Daarbuiten heeft hij dezelfde bevoegdheden als iedere burger.", "art. 142 Sv; Besluit boa", "q1dad92v"],
["boa", "Wat verstaan we onder een persoonsgegeven?", ["Alle informatie over een identificeerbare natuurlijke persoon.", "Alleen naam, adres, woonplaats en geboortedatum van een burger.", "Alleen gegevens die in een paspoort of identiteitskaart staan.", "Alleen medische en strafrechtelijke gegevens van een persoon."], "Een persoonsgegeven is elk gegeven dat direct of indirect iets zegt over een herkenbare persoon, bijvoorbeeld ook een kenteken of foto.", "art. 4 AVG", "q1eyd5pa"],
["boa", "Valt het alleen raadplegen (bekijken) van gegevens in een systeem onder het begrip 'verwerken'?", ["Ja, ook raadplegen is verwerken.", "Nee, alleen opslaan is verwerken.", "Nee, alleen verstrekken aan derden is verwerken.", "Alleen als de gegevens worden gewijzigd."], "Verwerken omvat vrijwel alles: verzamelen, vastleggen, ordenen, opslaan, wijzigen, opvragen, raadplegen, gebruiken, verstrekken en vernietigen.", "art. 4 AVG; art. 1 Wpg", "q6q5u5h"],
["boa", "Welke wet is van toepassing als een boa gegevens verwerkt in het kader van de opsporing van strafbare feiten?", ["De Wet politiegegevens (Wpg).", "De Wet justitiële en strafvorderlijke gegevens.", "Uitsluitend de AVG, net als andere overheden.", "De Archiefwet voor overheidsorganen."], "De Wpg is van toepassing op politie, boa's en bijzondere opsporingsdiensten bij de verwerking van politiegegevens. Voor andere verwerkingen geldt de AVG.", "Wpg", "q50gi40"],
["pol", "Wat is de taak van de politie volgens artikel 3 Politiewet 2012?", ["Onder het bevoegd gezag zorgen voor handhaving van de rechtsorde en hulpverlening.", "Regels opstellen en uitvoeren in opdracht van de minister van J&V.", "Verdachten berechten en straffen opleggen bij overtredingen.", "Alleen strafbare feiten opsporen, onder gezag van de burgemeester en de minister."], "De politietaak omvat handhaving van de openbare orde, strafrechtelijke handhaving van de rechtsorde en hulpverlening aan hen die dat behoeven.", "art. 3 Politiewet 2012", "q8wcowc"],
["pol", "Wie heeft het gezag over de politie bij de handhaving van de openbare orde en de hulpverlening?", ["De burgemeester.", "De officier van justitie.", "De korpschef.", "De minister van Defensie."], "Bij openbare orde en hulpverlening heeft de burgemeester het gezag. Bij strafrechtelijke handhaving is dat de officier van justitie.", "art. 11 Politiewet 2012", "qzkakti"],
["pol", "Wie heeft het gezag over de politie bij de strafrechtelijke handhaving van de rechtsorde?", ["De officier van justitie.", "De burgemeester.", "De commissaris van de Koning.", "De politiechef van de eenheid."], "De officier van justitie heeft het gezag bij opsporing. Hij valt onder het College van procureurs-generaal, dat weer onder de minister van J&V valt.", "art. 12 Politiewet 2012", "qky0xmo"],
["pol", "Wie is verantwoordelijk voor het beheer van de Nationale Politie?", ["De minister van Justitie en Veiligheid.", "De burgemeester van Den Haag als korpsbeheerder.", "Het College van procureurs-generaal in Den Haag.", "De minister van Binnenlandse Zaken en Koninkrijksrelaties."], "Er is één landelijk korps onder beheer van de minister van J&V. De korpschef heeft de dagelijkse leiding.", "Politiewet 2012", "q26hoqx"],
["pol", "Welke hoofdregel geldt volgens artikel 7 Politiewet 2012 voordat je geweld gebruikt?", ["Er gaat zo mogelijk een waarschuwing aan vooraf.", "Je vraagt eerst toestemming aan de officier van justitie.", "Je wacht tot er een politieambtenaar ter plaatse is.", "Je waarschuwt alleen als de persoon jonger is dan 18 jaar."], "Aan het gebruik van geweld gaat zo mogelijk een waarschuwing vooraf. Zo krijgt de ander nog de kans om zich vrijwillig aan te passen. Alleen als dat niet kan, bijvoorbeeld bij direct gevaar, gebruik je geweld zonder waarschuwing.", "art. 7 Politiewet 2012", "qba6awq"],
["pol", "Wie nemen deel aan het lokale driehoeksoverleg?", ["De burgemeester, de officier van justitie en de politiechef.", "De burgemeester, de wethouder van veiligheid en de gemeenteraad.", "De minister, de korpschef en de commissaris van de Koning samen.", "De rechter, de officier van justitie en de advocaat van de verdachte."], "In de driehoek stemmen gezag (burgemeester en officier van justitie) en politie de inzet af.", "", "qqdgmj5"],
["pol", "Waar is de bevoegdheid van de politie om geweld te gebruiken geregeld?", ["Artikel 7 Politiewet 2012.", "Artikel 52 Wetboek van Strafvordering.", "Artikel 41 Wetboek van Strafrecht.", "Artikel 12 van de Grondwet (huisrecht)."], "Art. 7 Politiewet 2012 regelt geweld (lid 1), veiligheidsfouillering (lid 3) en vervoersfouillering (lid 4). Lid 9 maakt toekenning aan boa's mogelijk.", "art. 7 Politiewet 2012", "q1pequxi"],

["bev", "Aan welke voorwaarde moet zijn voldaan voor een Halt-afdoening als bedoeld in artikel 77e Sr?", ["Hij is 12 tot 18 jaar, erkent het feit en stemt in met Halt.", "De jongere is 16 tot 23 jaar en heeft het feit volledig erkend.", "De jongere heeft eerder een Halt-straf gehad en die afgerond.", "De ouders hebben aangifte gedaan en stemmen in met de Halt-straf."], "Halt is bedoeld voor jongeren van 12 tot 18 jaar die een aangewezen licht feit hebben gepleegd en dat erkennen. De Halt-afdoening bedraagt ten hoogste 20 uur.", "art. 77e Sr", "q1qlqk2i"],
["bev", "Je verwijst een jongere van 14 jaar naar Halt. Wie moet daarnaast instemmen?", ["Zijn ouders of wettelijk vertegenwoordiger.", "De burgemeester van de gemeente waar hij woont.", "De schoolleiding of zijn mentor op de school waar hij zit.", "De kinderrechter bij de rechtbank in zijn arrondissement."], "Bij jongeren onder de 16 jaar moeten de ouders of verzorgers ook instemmen.", "", "qdvb9hu"],
["vrij", "Wat is het doel van strafvorderlijk staande houden op grond van artikel 52 Sv?", ["Naar de identiteitsgegevens van de verdachte vragen.", "De verdachte meenemen naar het politiebureau voor verhoor.", "De verdachte fouilleren op wapens en gevaarlijke voorwerpen.", "Een getuige ter plaatse verhoren over wat hij heeft gezien."], "Iedere opsporingsambtenaar mag een verdachte staande houden om naar zijn naam, voornamen, geboorteplaats en -datum en adres te vragen.", "art. 52 Sv", "q18qi511"],
["vrij", "Wie mag een opsporingsambtenaar strafvorderlijk staande houden?", ["Alleen een verdachte.", "Iedereen die hij tegenkomt.", "Ook een getuige.", "Alleen een minderjarige."], "Art. 52 Sv geldt alleen voor verdachten. Van een getuige kan op grond van de Wet op de identificatieplicht wel inzage van een identiteitsbewijs worden gevorderd als dat nodig is voor de taak.", "art. 52 Sv", "q1m1p1dg"],
["vrij", "Een staande gehouden verdachte geeft een valse naam op. Welke stelling is juist?", ["Het opgeven van een valse naam is strafbaar.", "Dat is toegestaan, want hij hoeft niet mee te werken.", "Dat is alleen strafbaar bij verdenking van een misdrijf.", "Dat mag zolang hij zijn identiteitsbewijs laat zien."], "De verdachte hoeft geen gegevens te geven, maar het opgeven van een valse naam aan een ambtenaar is strafbaar.", "art. 435 Sr", "q159unwc"],
["vrij", "Vanaf welke leeftijd geldt de algemene identificatieplicht (toonplicht) van artikel 2 Wid?", ["14 jaar.", "12 jaar.", "16 jaar.", "18 jaar."], "Vanaf 14 jaar moet iemand op vordering van een bevoegde ambtenaar een identiteitsbewijs tonen.", "art. 2 Wid; art. 447e Sr", "q1xxlq41"],
["vrij", "Iemand weigert op jouw vordering zijn identiteitsbewijs ter inzage te geven. Welk strafbaar feit pleegt hij?", ["Een overtreding van artikel 447e Sr.", "Wederspannigheid tegen een ambtenaar.", "Een misdrijf van artikel 184 Sr (ambtelijk bevel).", "Geen strafbaar feit, alleen een bestuurlijke boete."], "Het niet voldoen aan de toonplicht is een overtreding (art. 447e Sr).", "art. 447e Sr", "qk60p1x"],
["vrij", "Wanneer mag een opsporingsambtenaar inzage van een identiteitsbewijs vorderen?", ["Als dat redelijkerwijs nodig is voor de uitvoering van zijn taak.", "Altijd, ook zonder reden of aanleiding, bij iedereen die hij op straat ziet.", "Alleen bij een verdachte van een misdrijf waarop gevangenisstraf staat.", "Alleen met toestemming van de officier van justitie of hulpofficier."], "Er hoeft geen verdenking te zijn, maar wel een aanleiding: de vordering moet nodig zijn voor de taak.", "art. 8 Politiewet 2012; Wid", "q7bp8ru"],
["vrij", "Welk document is GEEN wettelijk erkend identiteitsbewijs als bedoeld in artikel 1 Wid?", ["Een bankpas.", "Een paspoort.", "Een Nederlandse identiteitskaart.", "Een Nederlands rijbewijs."], "Erkend zijn onder meer paspoort, identiteitskaart, vreemdelingendocument en rijbewijs. Een bankpas, ov-chipkaart of studentenpas niet.", "art. 1 Wid", "q6uvrif"],
["vrij", "Wanneer is er volgens artikel 128 Sv sprake van ontdekking op heterdaad?", ["Als het feit wordt ontdekt terwijl of direct nadat het wordt begaan.", "Als het feit binnen 24 uur na het plegen wordt ontdekt of bij de politie gemeld.", "Als er een getuige is die de dader later kan aanwijzen bij de politie.", "Als de dader het feit kort daarna zelf aan een opsporingsambtenaar bekent."], "Heterdaad vraagt om directe, verse ontdekking. Een aangifte de volgende dag is buiten heterdaad.", "art. 128 Sv", "qw2vqf5"],
["vrij", "Wie mag op grond van artikel 53 Sv een verdachte op heterdaad aanhouden?", ["Iedereen.", "Alleen opsporingsambtenaren.", "Alleen politieambtenaren.", "Alleen de (hulp)officier van justitie."], "Bij ontdekking op heterdaad is iedereen bevoegd de verdachte aan te houden, ook voor een overtreding.", "art. 53 Sv", "q266oo0"],
["vrij", "Een burger houdt een winkeldief op heterdaad aan. Wat moet hij daarna doen?", ["De verdachte direct overdragen aan een opsporingsambtenaar.", "De verdachte zelf naar het bureau brengen en verhoren.", "De verdachte fouilleren en zijn tas doorzoeken.", "De verdachte laten gaan na het noteren van zijn naam."], "Een burger die aanhoudt, moet de verdachte direct aan een opsporingsambtenaar overdragen.", "art. 53 lid 2 Sv", "qtc2tc9"],
["vrij", "Bij welke strafbare feiten mag buiten heterdaad worden aangehouden?", ["Alleen bij verdenking van een feit waarvoor voorlopige hechtenis mag.", "Bij alle misdrijven en alle overtredingen waarop een vrijheidsstraf staat.", "Alleen bij overtredingen uit een APV of bijzondere wet, zoals de Wp2000.", "Alleen bij feiten waarop twaalf jaar of meer gevangenisstraf is gesteld."], "Aanhouding buiten heterdaad kan alleen bij een VH-feit, niet bij overtredingen.", "art. 54 Sv", "q1vqb4a2"],
["vrij", "Wanneer mag een opsporingsambtenaar buiten heterdaad zelfstandig, zonder bevel, aanhouden?", ["Als het bevel van de officier van justitie en de hulpofficier niet kan worden afgewacht.", "Altijd bij een overtreding, als de verdachte zijn naam en adres niet geeft.", "Alleen in een woning, met schriftelijke toestemming van de bewoner of eigenaar.", "Nooit; buiten heterdaad is altijd een bevel van de rechter-commissaris nodig."], "Primair beveelt de officier van justitie; als dat niet kan worden afgewacht de hulpofficier van justitie; als ook dat niet kan, mag de opsporingsambtenaar zelf aanhouden.", "art. 54 Sv", "q1lm2ynj"],
["vrij", "Wat verstaan we onder VH-feiten?", ["Misdrijven met vier jaar of meer gevangenisstraf, plus enkele genoemde misdrijven.", "Alle misdrijven uit het Wetboek van Strafrecht en de overtredingen met hechtenis.", "Alleen misdrijven waarop acht jaar of meer gevangenisstraf staat.", "Alle feiten die op heterdaad zijn ontdekt, ongeacht de strafmaat."], "Voorbeelden van genoemde feiten onder de vier jaar zijn eenvoudige mishandeling en vernieling.", "art. 67 Sv", "q125vixd"],
["vrij", "Wat is het doel van de voorgeleiding van een aangehouden verdachte?", ["De aanhouding toetsen en beslissen over verdere vrijheidsbeneming.", "Vingerafdrukken en foto's afnemen voor de landelijke strafregistratie.", "De tenlastelegging opstellen voor de zitting bij de politierechter.", "De familie informeren en een advocaat regelen voor de aangehouden verdachte."], "Na voorgeleiding beslist de (hulp)officier van justitie: heenzenden, ophouden voor onderzoek of (daarna) inverzekeringstelling.", "art. 53, 54 en 56 Sv", "q1soey4f"],
["vrij", "Hoe lang mag een verdachte van een VH-feit ten hoogste worden opgehouden voor onderzoek?", ["9 uur, de tijd tussen 00:00 en 09:00 uur niet meegerekend.", "6 uur, waarbij de tijd tussen 00:00 en 09:00 uur wel wordt meegerekend.", "24 uur, inclusief de nachtelijke uren tussen 00:00 en 09:00.", "3 dagen, te verlengen met nog eens 3 dagen door de officier."], "Ophouden voor onderzoek: maximaal 9 uur bij een VH-feit en 6 uur bij overige feiten. De uren tussen middernacht en 09:00 uur tellen niet mee.", "art. 56a Sv", "q11hqb5f"],
["vrij", "Hoe lang mag een verdachte van een feit waarvoor GEEN voorlopige hechtenis is toegelaten, ten hoogste worden opgehouden voor onderzoek?", ["6 uur, de tijd tussen 00:00 en 09:00 uur niet meegerekend.", "9 uur, de tijd tussen 00:00 en 09:00 uur niet meegerekend.", "3 uur, de nachtelijke uren wel meegerekend.", "12 uur, de tijd tussen 00:00 en 09:00 uur niet meegerekend."], "Bij niet-VH-feiten is het maximum 6 uur. Lukt de identificatie niet, dan kan dit eenmaal met 6 uur worden verlengd.", "art. 56a Sv", "q14qnhf7"],
["vrij", "Een verdachte van een VH-feit wordt om 22:00 uur opgehouden voor onderzoek. Wanneer eindigt de termijn uiterlijk?", ["16:00 uur de volgende dag.", "07:00 uur de volgende dag.", "09:00 uur de volgende dag.", "13:00 uur de volgende dag."], "Van 22:00 tot 00:00 = 2 uur. De nacht (00:00–09:00) telt niet mee. Daarna nog 7 uur: van 09:00 tot 16:00.", "art. 56a Sv", "qgy7m6c"],
["vrij", "Wanneer kan de termijn van ophouden voor onderzoek met 6 uur worden verlengd om de identiteit vast te stellen?", ["Bij een niet-VH-feit als de identificatie niet binnen de termijn lukt.", "Bij elke verdachte die zwijgt over zijn naam en adres.", "Bij een verdachte van een VH-feit die geen ID bij zich heeft.", "Bij minderjarigen jonger dan 12 jaar, op verzoek van de ouders."], "Deze verlenging geldt alleen voor niet-VH-feiten en moet door de (hulp)officier van justitie worden bevolen.", "art. 56b Sv", "q18w9cj6"],
["vrij", "Hoe lang duurt een inverzekeringstelling ten hoogste, en wie kan haar verlengen?", ["Drie dagen; de officier van justitie kan bij dringende noodzaak eenmaal drie dagen verlengen.", "Zes uur; de hulpofficier van justitie kan haar daarna steeds met zes uur verlengen.", "14 dagen; de rechter-commissaris kan haar daarna steeds verlengen tot maximaal 90 dagen.", "Drie dagen; verlenging is niet mogelijk, daarna volgt altijd bewaring door de rechter-commissaris."], "De (hulp)officier van justitie kan in verzekering stellen bij een VH-feit in het belang van het onderzoek. Alleen de officier van justitie kan verlengen.", "art. 57 en 58 Sv", "q132mvst"],
["vrij", "Wie beveelt de bewaring, en voor hoe lang ten hoogste?", ["De rechter-commissaris, voor ten hoogste 14 dagen.", "De officier van justitie, voor ten hoogste 3 dagen.", "De hulpofficier van justitie, voor maximaal 9 uur per keer.", "De raadkamer van de rechtbank, voor ten hoogste 90 dagen."], "Met het bevel tot bewaring is een rechter betrokken. Daarna kan de raadkamer gevangenhouding bevelen.", "art. 63 en 64 Sv", "qblg2z"],
["vrij", "Mag een kind van 10 jaar in verzekering worden gesteld?", ["Nee.", "Ja, maximaal 3 dagen.", "Ja, bij een VH-feit.", "Ja, met toestemming van de ouders."], "Bij kinderen onder de 12 jaar is inverzekeringstelling niet toegestaan.", "art. 487 Sv", "q1c2lx9x"],
["vrij", "Bij welke aangehouden verdachten moeten foto's en vingerafdrukken worden genomen om de identiteit vast te stellen?", ["Bij VH-verdachten die worden opgehouden of in verzekering gesteld.", "Bij iedere staande gehouden verdachte die geen identiteitsbewijs heeft.", "Alleen bij minderjarigen, met schriftelijke toestemming van de ouders of voogd.", "Alleen bij verdachten zonder vaste woon- of verblijfplaats in Nederland."], "Bij twijfel over de identiteit van andere verdachten kan dit ook, op bevel van de (hulp)officier van justitie.", "art. 55c Sv", "q1f6xz51"],
["fou", "Waar is de veiligheidsfouillering geregeld?", ["Artikel 7 lid 3 Politiewet 2012.", "Artikel 56 Wetboek van Strafvordering.", "Artikel 55b Wetboek van Strafvordering.", "Artikel 9 Opiumwet (drugscontrole)."], "Bij een veiligheidsfouillering wordt de kleding afgetast en worden meegevoerde voorwerpen onderzocht om direct gevaar af te wenden.", "art. 7 lid 3 Politiewet 2012", "qwscrgg"],
["fou", "Wat is het doel van een veiligheidsfouillering?", ["Een gevaar voor leven of veiligheid afwenden.", "Bewijs vinden voor het gepleegde strafbare feit.", "De identiteit van de verdachte vaststellen en noteren.", "Gestolen goederen opsporen en in beslag nemen."], "Het gaat om veiligheid, bijvoorbeeld wanneer iemand mogelijk een wapen bij zich heeft.", "art. 7 lid 3 Politiewet 2012", "q14bwprv"],
["fou", "Wanneer mag een vervoersfouillering worden uitgevoerd?", ["Bij iemand die wordt vervoerd of ingesloten, om gevaar te voorkomen.", "Bij elke staande gehouden verdachte, om bewijs te vinden.", "Alleen op bevel van de officier van justitie of hulpofficier.", "Alleen bij minderjarigen die naar huis worden gebracht."], "Bij vervoer of insluiting in een cel of ophoudruimte mag de kleding worden afgetast en mogen meegevoerde voorwerpen worden onderzocht.", "art. 7 lid 4 Politiewet 2012", "qb5nv56"],
["fou", "Mag iedere boa een veiligheidsfouillering uitvoeren?", ["Nee, alleen als die bevoegdheid aan hem is toegekend.", "Ja, iedere opsporingsambtenaar mag dat bij acuut gevaar.", "Ja, als hij een uniform draagt en op dat moment in functie is.", "Nee, nooit; een fouillering mag alleen de politie uitvoeren."], "Politiebevoegdheden zoals fouilleren gelden voor een boa alleen als ze zijn toegekend en de bekwaamheid is aangetoond.", "art. 7 lid 9 Politiewet 2012", "q8t77w2"],
["fou", "Welke voorwaarde geldt voor een strafvorderlijk onderzoek aan de kleding?", ["De verdachte is aangehouden.", "De verdachte is alleen staande gehouden.", "De verdachte heeft toestemming gegeven.", "Er is een bevel van de rechter-commissaris."], "Onderzoek aan de kleding (in zakken en voering) is pas toegestaan na aanhouding. Uitzonderingen staan in bijzondere wetten zoals de Opiumwet en de Wet wapens en munitie.", "art. 56 Sv", "q1oxd85t"],
["fou", "Wie beveelt een onderzoek aan het lichaam?", ["De officier van justitie of de hulpofficier.", "Iedere opsporingsambtenaar die de verdachte aanhoudt.", "Alleen de rechter-commissaris, op vordering van de officier van justitie.", "De burgemeester, als gezagsdrager over de politie."], "Bij ernstige bezwaren tegen een aangehouden verdachte kan de (hulp)officier van justitie onderzoek aan het lichaam bevelen. Dit gebeurt op een besloten plaats door iemand van hetzelfde geslacht.", "art. 56 lid 1 Sv", "qj5brcp"],
["fou", "Je laat een verdachte zijn mond openen. Is dat een onderzoek aan of een onderzoek in het lichaam?", ["Aan het lichaam.", "In het lichaam.", "Aan de kleding.", "Geen van beide."], "Onderzoek aan het lichaam omvat de oppervlakte van het lichaam en het uitwendig schouwen van openingen en holten van het bovenlichaam, zoals mond, neus en oren.", "", "qmqjwbz"],
["fou", "Er wordt een röntgenfoto gemaakt om verborgen drugs te vinden. Is dat een onderzoek aan of een onderzoek in het lichaam?", ["In het lichaam.", "Aan het lichaam.", "Aan de kleding.", "Een veiligheidsfouillering."], "Onderzoek in het lichaam omvat onder meer schouwen van openingen van het onderlichaam, röntgen, echografie en inwendig manueel onderzoek.", "", "ql7vwep"],
["fou", "Door wie moet een onderzoek in het lichaam worden uitgevoerd?", ["Door een arts.", "Door de opsporingsambtenaar die aanhield.", "Door de hulpofficier zelf.", "Door een ambtenaar van hetzelfde geslacht."], "Onderzoek in het lichaam wordt door de officier van justitie bevolen en door een arts verricht.", "art. 56 lid 2 Sv", "q11nn4y7"],
["fou", "Waarop richt een identiteitsfouillering als bedoeld in artikel 55b Sv zich?", ["Op voorwerpen in kleding of bagage die de identiteit aantonen.", "Op wapens en andere gevaarlijke voorwerpen die hij bij zich draagt.", "Op drugs en andere verboden middelen in zijn jas, broekzakken en tas.", "Op het lichaam van de verdachte en op wat hij onder zijn kleding draagt."], "Bij een staande gehouden of aangehouden verdachte mag, als dat nodig is voor de identiteitsvaststelling, worden gezocht naar bijvoorbeeld een ID-kaart in jas, tas of dashboardkastje.", "art. 55b Sv", "q7m945w"],
["fou", "Hoort het doorzoeken van een tas die de aangehouden verdachte bij zich heeft bij het onderzoek aan de kleding?", ["Nee, daarvoor is toestemming of inbeslagneming nodig.", "Ja, een tas valt gewoon onder de kleding van de verdachte.", "Ja, maar alleen bij verdenking van een overtreding of licht misdrijf.", "Alleen als de tas open is en de inhoud van buitenaf zichtbaar."], "Meegevoerde voorwerpen vallen niet onder onderzoek aan de kleding. Zonder vrijwillige toestemming moeten ze eerst in beslag worden genomen.", "art. 95 en 96 Sv", "q1guagpf"],
["bes", "Wat verstaan we volgens artikel 134 Sv onder inbeslagneming?", ["Een voorwerp onder je nemen of houden ten behoeve van de strafvordering.", "Een voorwerp vernietigen omdat het gevaarlijk of verboden is.", "Iemand vragen een voorwerp te laten zien en het teruggeven.", "Een voorwerp beschrijven in het proces-verbaal en achterlaten."], "Mededelen alleen is niet genoeg; je moet het voorwerp daadwerkelijk onder je nemen. Ook veiligstellen geldt als inbeslagneming.", "art. 134 Sv", "q1eks6cv"],
["bes", "Welke voorwerpen zijn volgens artikel 94 Sv vatbaar voor inbeslagneming?", ["Voorwerpen die de waarheid aantonen, voordeel bewijzen of verbeurd of onttrokken kunnen worden.", "Alleen gestolen goederen en voorwerpen die bij het feit zijn gebruikt.", "Alleen wapens, drugs en andere voorwerpen die verboden zijn.", "Alle voorwerpen die de verdachte bij zich heeft, in zijn auto vervoert of in zijn woning bewaart."], "Vatbaar betekent: bruikbaar voor de strafvordering. Het heeft niets te maken met zichtbaarheid.", "art. 94 Sv", "q120w6k8"],
["bes", "Je houdt als boa een verdachte staande. Welke voorwerpen mag je in beslag nemen?", ["Vatbare voorwerpen die de verdachte met zich voert.", "Alle voorwerpen in de woning en auto van de verdachte.", "Niets, want inbeslagneming kan alleen na een aanhouding.", "Alleen voorwerpen die de verdachte vrijwillig afgeeft."], "Bij staande houden of aanhouden mag de opsporingsambtenaar vatbare voorwerpen die de verdachte bij zich heeft in beslag nemen.", "art. 95 Sv", "q8l4c6d"],
["bes", "Je wilt buiten heterdaad een vatbaar voorwerp in beslag nemen. Welke voorwaarde geldt?", ["Verdenking van een VH-feit.", "Toestemming van de burgemeester.", "Een machtiging van de rechter-commissaris.", "Een bekentenis van de verdachte."], "Bij een VH-feit mag hij buiten heterdaad in beslag nemen en daartoe elke plaats betreden, met uitzondering van een woning zonder toestemming.", "art. 96 Sv", "q1rw2tr2"],
["bes", "Aan wie mag GEEN bevel tot uitlevering van een voorwerp worden gegeven?", ["Aan de verdachte.", "Aan de houder die geen verdachte is.", "Aan een getuige.", "Aan een bedrijf."], "Een verdachte hoeft niet mee te werken aan zijn eigen veroordeling.", "art. 96a Sv", "qfwncpd"],
["bes", "Bij welk soort strafbaar feit kan een opsporingsambtenaar een bevel tot uitlevering geven?", ["Bij een VH-feit.", "Bij elk strafbaar feit.", "Alleen bij overtredingen.", "Alleen bij feiten waarop 8 jaar of meer staat."], "Het uitleveringsbevel kan bij heterdaad en buiten heterdaad worden gegeven, maar alleen bij verdenking van een VH-feit.", "art. 96a Sv", "q1xzauos"],
["bes", "Wie hoeven NIET te voldoen aan een bevel tot uitlevering?", ["Verschoningsgerechtigden, zoals een arts of advocaat.", "Familieleden van het slachtoffer en van de verdachte.", "Minderjarigen en hun wettelijk vertegenwoordigers.", "Ambtenaren die in functie zijn."], "Geheimhouders met een verschoningsrecht hoeven niet uit te leveren.", "art. 96a lid 3 Sv", "q157w0iq"],
["bes", "Iemand weigert opzettelijk te voldoen aan een bevoegd gegeven bevel tot uitlevering. Welk strafbaar feit pleegt hij?", ["Niet voldoen aan een ambtelijk bevel (artikel 184 Sr).", "Wederspannigheid tegen een ambtenaar (artikel 180 Sr).", "Verduistering van het voorwerp (artikel 321 Sr).", "Geen strafbaar feit."], "Opzettelijk niet voldoen aan een bevoegd gegeven bevel of vordering is een misdrijf.", "art. 184 Sr", "q6mbp0d"],
["bes", "Wat geef je na inbeslagneming in principe af aan de beslagene?", ["Een bewijs van ontvangst.", "Een dagvaarding.", "Een strafbeschikking.", "Een machtiging."], "Van de inbeslagneming wordt een kennisgeving opgemaakt en zo mogelijk krijgt de beslagene een bewijs van ontvangst.", "art. 94 Sv; Besluit inbeslaggenomen voorwerpen", "q1eahsv"],
["bes", "Wat is het verschil tussen een bezitter en een houder van een goed?", ["De bezitter houdt een goed voor zichzelf; de houder voor een ander.", "Er is geen verschil; beide zijn eigenaar van het goed.", "De houder is altijd de eigenaar; de bezitter huurt het goed.", "De bezitter houdt het goed voor een ander; de houder voor zichzelf."], "De bezitter gedraagt zich als eigenaar en wordt vermoed rechthebbende te zijn. Een houder (bijvoorbeeld een huurder) houdt het goed voor een ander.", "Burgerlijk Wetboek boek 3", "qk30ea"],
["bes", "Wanneer eindigt het beslag volgens artikel 116 Sv?", ["Als het belang van de strafvordering het niet meer vordert.", "Na 24 uur, tenzij de officier van justitie het beslag verlengt.", "Op de eerste zittingsdag, als de rechter het stuk heeft gezien.", "Als de verdachte of de eigenaar er schriftelijk om vraagt bij de officier van justitie."], "Het voorwerp gaat dan in principe terug naar de beslagene, tenzij die afstand heeft gedaan of anders is beslist.", "art. 116 Sv", "qfmm5af"],
["bes", "Je wilt een plaats laten doorzoeken, maar je bent daartoe zelf niet bevoegd. Wat mag je doen?", ["De situatie bevriezen tot een bevoegde functionaris er is.", "Zelf doorzoeken en het achteraf melden aan de officier van justitie.", "Niets; je moet de plaats verlaten tot er een schriftelijk bevel is.", "De eigenaar aanhouden en de plaats afsluiten."], "Bevriezen is geen in het Wetboek omschreven bevoegdheid. Het kan de vrijheid beperken, maar niet benemen.", "", "q1nghc7v"],

["pl", "Wat valt onder het begrip woning?", ["Een afgesloten plaats voor het privé huiselijk leven, zoals ook een bewoonde tent.", "Alleen een huis met een eigen adres en een eigen voordeur.", "Ook het gemeenschappelijk trappenhuis, de galerij en de bergingen van een flat.", "Alleen een koop- of huurwoning die op naam staat."], "Ook een caravan of onderverhuurde kamer kan een woning zijn. Een gemeenschappelijk trappenhuis niet.", "art. 12 Gw", "q1hyz00b"],

["sch", "Eén handeling valt onder twee strafbepalingen. Welke bepaling wordt toegepast?", ["Alleen de bepaling met de zwaarste hoofdstraf (eendaadse samenloop).", "Beide straffen opgeteld, omdat er twee strafbepalingen zijn overtreden.", "De lichtste straf, omdat twijfel in het voordeel van de verdachte uitvalt.", "De rechter kiest vrij, zonder wettelijk maximum."], "Bij eendaadse samenloop wordt slechts één strafbepaling toegepast: die met de zwaarste hoofdstraf.", "art. 55 Sr", "q1iv64p1"],

["amb", "Wat verstaan we onder huisvredebreuk?", ["Wederrechtelijk een woning, lokaal of erf binnendringen of daar blijven na vordering.", "Een ruzie in een woning waarbij de buren overlast hebben.", "Het binnengaan van een winkel buiten de openingstijden.", "Het weigeren een ambtenaar met een machtiging binnen te laten in de woning."], "Wie wederrechtelijk binnendringt, pleegt direct huisvredebreuk. Wie wederrechtelijk vertoeft, pleegt het pas als hij niet direct vertrekt na een vordering van de rechthebbende.", "art. 138 Sr", "q10trcj8"],

["amb", "Iemand verzet zich met geweld tegen je terwijl je hem als boa rechtmatig aanhoudt. Welk strafbaar feit pleegt hij?", ["Wederspannigheid.", "Ambtsdwang.", "Niet voldoen aan een bevel.", "Belediging."], "Wederspannigheid is verzet met geweld of bedreiging met geweld tegen een ambtenaar die bezig is met de rechtmatige uitoefening van zijn bediening.", "art. 180 Sr", "q1oub69l"],
["amb", "Iemand dwingt je met geweld om een ambtshandeling niet uit te voeren, nog voordat je eraan begonnen bent. Welk strafbaar feit sluit hierop aan?", ["Ambtsdwang.", "Wederspannigheid.", "Belemmering.", "Opschudding."], "Bij ambtsdwang wordt de ambtenaar gedwongen tot het verrichten of nalaten van een ambtshandeling. Bij wederspannigheid is de ambtenaar al bezig.", "art. 179 Sr", "qh2mlo0"],
["amb", "Wat is de maximale straf voor het opzettelijk niet voldoen aan een bevel of vordering van een ambtenaar (artikel 184 Sr)?", ["Drie maanden gevangenisstraf of een geldboete van de tweede categorie.", "Eén jaar gevangenisstraf of in plaats daarvan een geldboete van de derde categorie.", "Twee weken hechtenis of een geldboete van de eerste categorie.", "Alleen een geldboete van de eerste categorie en dus geen vrijheidsstraf."], "Ook het opzettelijk beletten, belemmeren of verijdelen van een ambtshandeling valt onder art. 184 Sr.", "art. 184 Sr", "qhusw"],

["amb", "Een voorbijganger scheldt je tijdens je werk als boa uit voor 'klootzak'. Welk strafbaar feit is dit?", ["Eenvoudige belediging van een ambtenaar in functie.", "Smaad, omdat het in het openbaar gebeurt waar anderen bij zijn.", "Laster, omdat de bewering onwaar is.", "Wederspannigheid tegen een ambtenaar in functie (artikel 180 Sr)."], "Eenvoudige belediging is een aantasting van iemands eer zonder het karakter van smaad. Tegen een ambtenaar in functie is dit ambtshalve vervolgbaar.", "art. 266 en 267 Sr", "q1g6bnss"],
["amb", "Iemand veroorzaakt opschudding bij een plaats waar een ambtenaar in het openbaar werkzaam is en vertrekt niet na een bevel. Wat kenmerkt dit feit?", ["Wanorde veroorzaken, de stilte verstoren of de normale gang van zaken verhinderen.", "Altijd geweld of bedreiging met geweld tegen de ambtenaar.", "Het beledigen van de ambtenaar in het bijzijn van publiek of via sociale media.", "Het weigeren een identiteitsbewijs te tonen aan de ambtenaar."], "Dit feit wordt gestraft met ten hoogste twee weken hechtenis of een geldboete van de tweede categorie.", "", "q1mvqk5v"],

["bp", "Een reiziger is zichtbaar dronken in de tram. Is dit een verstoring van orde, rust, veiligheid of goede bedrijfsgang?", ["Ja, kennelijk dronken of onder invloed van drugs zijn valt daaronder.", "Nee, alleen als hij agressief wordt tegen medereizigers of het personeel.", "Nee, die regel geldt alleen in de trein en niet in de tram, bus of metro.", "Alleen als hij geen geldig vervoerbewijs heeft."], "Art. 52 lid 1 onder d Bp2000 noemt dit uitdrukkelijk.", "art. 52 Bp2000; art. 72 Wp2000", "q1feibyy"],
["bp", "Welke gedraging valt volgens artikel 52 Bp2000 NIET zonder meer onder verstoring van de orde, rust, veiligheid of goede bedrijfsgang?", ["Zacht met een medereiziger praten.", "Bedelen in de trein.", "Vuurwerk afsteken op het perron.", "Een station betreden dat duidelijk gesloten is."], "Art. 52 noemt onder meer bedelen en collecteren, vuurwerk en hinderlijk geluid, en aanwezigheid in een gesloten station.", "art. 52 Bp2000", "q7ey6q5"],
["bp", "Mag een straatartiest zonder toestemming van de vervoerder muziek maken voor geld in een metrostation?", ["Nee, zonder toestemming diensten aanbieden is daar verboden.", "Ja, dat valt onder de vrijheid van meningsuiting.", "Ja, maar alleen buiten de spitsuren en niet op het perron zelf.", "Ja, als hij een vergunning van de gemeente heeft voor straatmuziek."], "Art. 52 lid 2 Bp2000: de verboden gelden niet als de vervoerder toestemming heeft gegeven.", "art. 52 Bp2000", "qaejszr"],
["bp", "Een reiziger steekt een sigaret op in een overdekt deel van het station waar een pictogram met een rookverbod hangt. Welk artikel is van toepassing?", ["Artikel 72 Wp2000 jo. artikel 52 Bp2000.", "Artikel 70 lid 1 Wp2000.", "Artikel 71 Wp2000 jo. artikel 45 Bp2000.", "Artikel 461 Sr (verboden toegang)."], "Roken waar de vervoerder dat heeft verboden, is een verstoring in de zin van art. 52. Het pictogram is bovendien een aanwijzing (art. 53 Bp2000).", "art. 52 Bp2000", "q1txdfc"],
["bp", "Wat zijn volgens artikel 53 Bp2000 ook 'aanwijzingen' in de zin van artikel 73 Wp2000?", ["Aanduidingen in beeld of geschrift die namens de vervoerder bekend zijn gemaakt.", "Alleen mondelinge opdrachten van een conducteur of machinist.", "Alleen schriftelijke bevelen van de politie of de officier van justitie.", "Adviezen van medereizigers en van ander stationspersoneel."], "Een bord 'Niet over het spoor lopen' of een pictogram is dus ook een aanwijzing die moet worden opgevolgd.", "art. 53 Bp2000", "q1wjirjo"],
["bp", "Moet een reiziger betalen voor een vouwfiets in de bus?", ["Nee, een vouwfiets geldt als handbagage.", "Ja, altijd.", "Alleen in de spits.", "Alleen als de vouwfiets uitgeklapt is meegenomen."], "Voor handbagage en een hond die een persoon met een gehandicaptenlegitimatie begeleidt, is geen vervoerprijs verschuldigd.", "art. 46 Bp2000", "q1vjo9pd"],
["ovt", "Een reiziger vraagt een boa OV om zijn legitimatie. Wat moet de boa doen?", ["Zijn legitimatiebewijs direct tonen.", "Weigeren, want hij draagt een uniform.", "Alleen zijn dienstnummer noemen als hij dat wil.", "Eerst om het vervoerbewijs vragen."], "Een toezichthouder heeft een legitimatiebewijs bij zich en toont dat desgevraagd direct (art. 5:12 Awb, van toepassing via art. 91 Wp2000).", "art. 5:12 Awb; art. 91 Wp2000", "qq1ylt2"],
["ovt", "Welk artikel van de Awb verplicht iedereen om de medewerking te verlenen die een toezichthouder redelijkerwijs kan vorderen?", ["Artikel 5:20 Awb.", "Artikel 5:12 Awb.", "Artikel 5:13 Awb.", "Artikel 5:15 Awb."], "Art. 5:20 Awb is via art. 91 Wp2000 van toepassing op de opsporingsambtenaren van art. 89. Wie met een geheimhoudingsplicht kan zich daarop beroepen.", "art. 5:20 Awb", "q5u9bxf"],
["ovt", "Wat houdt artikel 5:13 Awb in voor een toezichthouder in het openbaar vervoer?", ["Hij gebruikt zijn bevoegdheden alleen voor zover dat redelijkerwijs nodig is.", "Hij mag elke bevoegdheid altijd en volledig gebruiken zolang hij in functie is.", "Hij moet bij elke controle een collega of getuige meenemen.", "Hij moet elke controle vooraf aankondigen via de omroep in de trein, tram of bus."], "Dit is het evenredigheidsbeginsel bij toezicht.", "art. 5:13 Awb", "q1uenxbt"],
["ovt", "Een reiziger zonder geldig vervoerbewijs weigert zijn naam te geven. Wat kan een boa OV doen?", ["Hem staande houden, naar zijn identiteit vragen en een ID-bewijs vorderen.", "Hem direct in de boeien slaan en naar het bureau laten brengen.", "Hem laten gaan, want een verdachte hoeft niets te zeggen.", "Zijn tas doorzoeken op een identiteitsbewijs zonder verdere grond."], "Zwartrijden is een strafbaar feit, dus de reiziger is verdachte (art. 52 Sv). Weigert hij een identiteitsbewijs te tonen, dan pleegt hij een overtreding van art. 447e Sr. Bij een overtreding op heterdaad kan worden aangehouden als de identiteit niet kan worden vastgesteld.", "art. 52 Sv; art. 447e Sr", "q1saaucu"],
["ovt", "Mag een boa OV een zwartrijder van wie de identiteit niet kan worden vastgesteld, aanhouden?", ["Ja, bij ontdekking op heterdaad mag iedereen een verdachte aanhouden.", "Nee, zwartrijden is een overtreding en geen misdrijf.", "Nee, alleen de politie mag in het OV iemand aanhouden.", "Alleen met een voorafgaand bevel van de officier van justitie."], "Aanhouden op heterdaad kan bij alle strafbare feiten, ook overtredingen. Buiten heterdaad alleen bij een VH-feit.", "art. 53 Sv", "q7w7ndo"],
["ovt", "Een reiziger scheldt een boa OV uit nadat deze hem een bekeuring gaf voor zwartrijden. Is voor vervolging een klacht van de boa nodig?", ["Nee, belediging van een ambtenaar vanwege zijn werk is ambtshalve vervolgbaar.", "Ja, belediging is altijd een klachtdelict, ook bij ambtenaren.", "Ja, en de vervoerder als werkgever moet de klacht indienen.", "Nee, want een boa OV die in dienst is van een vervoerder is geen ambtenaar in strafrechtelijke zin."], "Ook een boa in dienst van een vervoerder is ambtenaar in strafrechtelijke zin. Belediging in verband met zijn werk valt onder art. 267 Sr.", "art. 267 en 269 Sr", "q1dcknem"],
["ovt", "Een reiziger blijft na een rechtmatige ontzegging in de trein zitten en duwt de boa weg als die hem eruit begeleidt. Wat pleegt hij?", ["Wederspannigheid, naast de overtreding van de ontzegging.", "Alleen een overtreding van artikel 70 Wp2000 (zwartrijden).", "Ambtsdwang tegen de boa (artikel 179 Sr).", "Opschudding bij een ambtenaar in functie."], "Verzet met geweld tegen een ambtenaar die rechtmatig zijn bevoegdheid uitoefent, is wederspannigheid (art. 180 Sr).", "art. 180 Sr; art. 98 Wp2000", "q70jk6l"],
["ovt", "Een boa OV vindt bij het staande houden van een zwartrijder een mes dat onder de Wet wapens en munitie valt. Mag hij het in beslag nemen?", ["Ja, vatbare voorwerpen bij een staande gehouden verdachte mag hij in beslag nemen.", "Nee, de Wet wapens en munitie staat niet op de domeinlijst voor boa's in domein IV.", "Alleen na een bevel van de hulpofficier van justitie.", "Alleen als de reiziger daarvoor uitdrukkelijk toestemming geeft."], "Inbeslagneming bij een staande gehouden verdachte is een bevoegdheid van iedere opsporingsambtenaar (art. 95 Sv). Voor het verdere optreden tegen het wapenfeit schakelt de boa zo nodig de politie in.", "art. 95 Sv", "qaw6pkn"],
["ovt", "Je houdt een reiziger zonder geldig vervoerbewijs staande. Wat moet je hem meedelen voordat je hem vragen stelt over het zwartrijden?", ["Dat hij niet verplicht is tot antwoorden.", "Dat hij recht heeft op een advocaat voordat hij zijn naam noemt.", "Dat hij de vervoerprijs binnen 14 dagen moet betalen.", "Dat alles wat hij zegt tegen hem kan worden gebruikt."], "De reiziger is verdachte van een strafbaar feit (artikel 70 Wp2000). Voor het verhoor geef je de cautie: hij is niet verplicht tot antwoorden (artikel 29 Sv). Vragen naar zijn identiteit mag je wel zonder cautie stellen. Vermeld de cautie in je proces-verbaal.", "art. 29 Sv; art. 70 Wp2000", "qa6fb7e"],
["ovt", "Een reiziger legt zijn voeten op de bank. Je vraagt hem dat te stoppen, maar hij blijft het doen. Welk artikel overtreedt hij in ieder geval?", ["Artikel 73 Wp2000 (aanwijzing niet opvolgen).", "Artikel 70 lid 1 Wp2000 (zonder geldig vervoerbewijs).", "Artikel 71 Wp2000 (misbruik van een vervoerbewijs).", "Artikel 98 Wp2000 (ontzegging overtreden)."], "Artikel 73 Wp2000 verplicht reizigers om duidelijk kenbaar gemaakte aanwijzingen van of namens de vervoerder op te volgen. Jouw opdracht om te stoppen is zo'n aanwijzing. Wie die niet opvolgt, pleegt een overtreding. Neem de gegeven aanwijzing woordelijk op in je proces-verbaal.", "art. 73 Wp2000", "q1sp8i39"],
["spw", "Wat verbiedt artikel 3 Spoorwegwet?", ["Gedrag waardoor gevaar op de spoorweg of hinder voor het spoorverkeer (kan) ontstaan.", "Reizen zonder geldig vervoerbewijs in een trein op het hoofdspoor.", "Roken op een perron of in de trein waar een rookverbod geldt.", "Een spoorweg aanleggen of exploiteren zonder concessie van de minister."], "Dit artikel lijkt op art. 5 WVW 1994 en gaat over de algemene veiligheid van het spoorverkeer.", "art. 3 Spoorwegwet", "q189t8zl"],
["spw", "Iemand legt opzettelijk een betonblok op het spoor, waardoor gevaar ontstaat voor een trein. Welk wetboek is hier vooral van toepassing?", ["Het Wetboek van Strafrecht, want het is een misdrijf.", "Alleen de Wet personenvervoer 2000, omdat het om het OV gaat.", "Alleen het Besluit personenvervoer 2000 (verstoring van de orde).", "Geen; dit is een civiele zaak tussen ProRail en de dader."], "De Spoorwegwet laat de misdrijven van art. 164 (opzet), 165 (schuld) en 351 (vernieling spoorwegwerken) Sr onverlet.", "Spoorwegwet; art. 164 Sr", "q1oc47q0"],
["spw", "Op welke manier deelt de Spoorwegwet spoorwegen in?", ["In hoofdspoorwegen (bij koninklijk besluit) en bijzondere spoorwegen.", "In nationale en internationale spoorwegen met elk eigen regels.", "In personen- en goederenspoorwegen, aangewezen door ProRail.", "In tram-, metro- en treinlijnen."], "Wat niet als hoofdspoorweg is aangewezen, is een bijzondere spoorweg.", "art. 2 Spoorwegwet", "q1f3h38d"],
["spw", "Een jongen loopt over een afgesloten metrobaan. Welke wet verbiedt dit in de eerste plaats?", ["De Wet lokaal spoor.", "De Spoorwegwet.", "De Wet op de identificatieplicht.", "De Algemene wet op het binnentreden."], "Art. 15 Wet lokaal spoor verbiedt onder meer het zich bevinden op of langs een voor personen afgesloten lokale spoorweg.", "art. 15 Wet lokaal spoor", "ql00uop"],
["wp", "Wanneer is er volgens artikel 1 Wp2000 sprake van openbaar vervoer?", ["Als het voor iedereen openstaand vervoer is volgens een dienstregeling.", "Als de overheid of de gemeente het vervoer betaalt.", "Als er minstens acht reizigers in het voertuig zitten.", "Als het vervoer door een concessiehouder met een taxi gebeurt."], "Beide voorwaarden moeten gelden: een dienstregeling en openstaand voor iedereen. Voorwaarden zoals een geldig vervoerbewijs mogen wel.", "art. 1 Wp2000", "q1p0acur"],
["wp", "Wanneer is een voertuig een 'bus' in de zin van de Wp2000?", ["Als het is ingericht voor meer dan acht personen, de bestuurder niet meegerekend.", "Als er op dat moment meer dan acht mensen in zitten, de chauffeur daarbij wel meegerekend.", "Als het een kenteken en een vergunning van een vervoerder heeft.", "Als het volgens een dienstregeling rijdt op een vaste lijn."], "Het gaat om de capaciteit van het voertuig, niet om het aantal reizigers op dat moment.", "art. 1 Wp2000", "q1ds4985"],
["wp", "Wat is volgens artikel 19 Wp2000 verboden?", ["Openbaar vervoer verrichten zonder concessie.", "Reizen zonder geldig vervoerbewijs in bus of tram.", "Het niet opvolgen van aanwijzingen van de vervoerder.", "Busvervoer zonder geldig rijbewijs D."], "Een vergunning alleen is niet genoeg: voor openbaar vervoer heb je ook een concessie nodig.", "art. 19 Wp2000", "q1o73yvb"],
["ovt", "Een servicemedewerker van het station, die geen toezichthouder of boa is, vraagt iemand de roltrap vrij te maken. Is dit een aanwijzing in de zin van artikel 73 Wp2000?", ["Nee: het gaat om aanwijzingen van boa's OV, toezichthouders of borden en pictogrammen.", "Ja, iedere medewerker van de vervoerder mag namens de vervoerder zo'n aanwijzing geven.", "Ja, als de medewerker herkenbaar is aan een uniform of badge.", "Alleen als de politie of een boa erbij aanwezig is."], "Neem een gegeven aanwijzing in het proces-verbaal woordelijk op. Ook een bord of sticker beschrijf je in het proces-verbaal.", "art. 73 Wp2000", "qaswx74"],
["ovt", "Een zwartrijder van 13 jaar heeft zijn identiteitskaart bij zich, maar weigert die bewust te tonen. Welk strafbaar feit pleegt hij?", ["Niet voldoen aan een bevel of vordering (artikel 184 Sr).", "Alleen de strafverzwaring van artikel 101 lid 2 Wp2000 voor zwartrijden.", "Wederspannigheid.", "Geen, want hij is jonger dan 14 jaar en hoeft niets te tonen."], "De strafverzwaring van art. 101 lid 2 geldt als hij het bewijs niet bij zich heeft. Bewust weigeren terwijl hij het wel heeft, is art. 184 Sr.", "art. 92 Wp2000; art. 184 Sr", "q18nwtod"],
["ovt", "Een toezichthouder in het OV wil het vervoerbewijs kopiëren. Wat is volgens het evenredigheidsbeginsel het beste?", ["De gegevens overschrijven en het vervoerbewijs bij de reiziger laten.", "Het vervoerbewijs altijd meenemen naar kantoor om het te kopiëren.", "Het vervoerbewijs innemen tot de reiziger de boete heeft betaald.", "Een foto maken van de reiziger en van zijn vervoerbewijs."], "Art. 5:17 Awb staat kort meenemen toe tegen een schriftelijk bewijs, maar dan reist iemand tijdelijk zonder vervoerbewijs. Overschrijven is minder belastend.", "art. 5:17 Awb; art. 5:13 Awb", "qck7ecf"]
];
const Q6 = [
["aig", "Je duwt een deur open die een verdachte van binnen dichthoudt. Is dit geweld in de zin van de Ambtsinstructie?", ["Ja, ook dwangmatige kracht van meer dan geringe betekenis op zaken is geweld.", "Nee, geweld gaat alleen over dwangmatige kracht die je op personen uitoefent.", "Nee, alleen het gebruik van een geweldmiddel telt als geweld.", "Alleen als de deur daarbij beschadigd raakt."], "Geweld is elke dwangmatige kracht van meer dan geringe betekenis, uitgeoefend op personen óf zaken. Een deur openduwen die iemand dichthoudt, valt daar dus onder.", "art. 1 Ambtsinstructie", "q4vd277"],
["aig", "Je begeleidt een verdachte die volledig meewerkt, door hem licht bij de arm vast te houden. Is dit geweld in de zin van de Ambtsinstructie?", ["Nee, de kracht is niet van meer dan geringe betekenis.", "Ja, elk lichamelijk contact met een verdachte is geweld.", "Ja, omdat de verdachte van zijn vrijheid is beroofd.", "Alleen als je hem niet vooraf hebt gewaarschuwd."], "Geweld is dwangmatige kracht van meer dan geringe betekenis. Licht begeleiden van iemand die meewerkt, haalt die grens niet en is dus geen geweld (en hoeft niet te worden gemeld).", "art. 1 Ambtsinstructie", "qfeiu7v"],
["aig", "Wat houdt het subsidiariteitsbeginsel in bij het gebruik van geweld?", ["Je gebruikt alleen geweld als het doel niet op een minder ingrijpende manier te bereiken is.", "Het geweld staat in een redelijke verhouding tot het doel dat je met je optreden wilt bereiken.", "Je gebruikt alleen geweld als je in dat middel bent opgeleid en geoefend.", "Je gebruikt alleen geweld na toestemming van de hulpofficier van justitie."], "Subsidiariteit: kan het met minder, dan moet het met minder. Geweld mag alleen als het doel niet anders te bereiken is (artikel 7 Politiewet 2012). De verhouding tussen middel en doel is proportionaliteit.", "art. 7 Politiewet 2012", "q9lzqa1"],
["aig", "Wat houdt het proportionaliteitsbeginsel in bij het gebruik van geweld?", ["Het geweld staat in redelijke verhouding tot het doel dat je wilt bereiken.", "Je gebruikt alleen geweld als er geen enkel ander, minder ingrijpend middel meer over is.", "Je gebruikt hetzelfde geweldmiddel als je tegenstander.", "Je mag geweld gebruiken tot de verdachte geboeid is."], "Proportionaliteit: het geweld moet in verhouding tot het beoogde doel redelijk en gematigd zijn. Een licht feit rechtvaardigt geen zwaar geweld.", "art. 7 Politiewet 2012", "q11e7fxo"],
["aig", "Een verdachte verzet zich eerst hevig tegen zijn aanhouding, maar geeft zich daarna volledig over. Wat betekent dit voor jouw geweldgebruik?", ["Je stopt met het geweld, want het doel is bereikt.", "Je mag het geweld nog even voortzetten om herhaling te voorkomen.", "Je mag pepperspray gebruiken als waarschuwing voor de volgende keer.", "Het verzet rechtvaardigt geweld tot het einde van de aanhouding."], "Geweld moet redelijk en gematigd blijven. Zodra het doel is bereikt, is verder geweld niet meer nodig en dus niet meer toegestaan. Geweld is nooit een straf.", "art. 7 Politiewet 2012", "q11vla56"],
["aig", "Wanneer mag je geweld gebruiken zonder vooraf te waarschuwen?", ["Als de omstandigheden een waarschuwing redelijkerwijs niet toelaten.", "Altijd; een waarschuwing is alleen een advies.", "Als je in uniform bent, want dan is je bevoegdheid duidelijk.", "Als een collega de persoon eerder op de dag al duidelijk heeft gewaarschuwd."], "Aan het gebruik van geweld gaat zo mogelijk een waarschuwing vooraf. Alleen als de situatie dat redelijkerwijs niet toelaat, bijvoorbeeld bij een plotselinge aanval, laat je de waarschuwing achterwege.", "art. 7 Politiewet 2012; art. 12b en 12f Ambtsinstructie", "q45cmuk"],
["aig", "Aan welke voorwaarden moet je volgens artikel 4 van de Ambtsinstructie voldoen voordat je een geweldmiddel mag gebruiken?", ["Je bent ervoor bevoegd, gebruikt het voor je taak en bent erin geoefend.", "Je hebt het middel zelf aangeschaft en het staat op je akte.", "Je hebt vooraf toestemming van de officier van justitie gekregen.", "Je hebt de basisopleiding boa gehaald; daarna is verder oefenen niet meer nodig."], "Een geweldmiddel mag alleen worden gebruikt door wie daartoe bevoegd is, voor de taak waarvoor het is verstrekt, en wie in het gebruik ervan is geoefend. Daarom moet je jaarlijks de RTGB-toetsen halen.", "art. 4 Ambtsinstructie", "q1m5nmmy"],
["aig", "Je treedt op onder leiding van een aanwezige meerdere. Wanneer mag je dan geweld gebruiken?", ["Na zijn uitdrukkelijke opdracht, tenzij hij vooraf anders heeft bepaald.", "Altijd zelfstandig, ook als de meerdere erbij is.", "Alleen als de meerdere het geweld achteraf schriftelijk goedkeurt.", "Alleen als ook de hulpofficier van justitie ter plaatse is."], "Wie onder leiding van een aanwezige meerdere optreedt, gebruikt geen geweld dan na diens uitdrukkelijke last. De meerdere kan vooraf anders bepalen.", "art. 5 Ambtsinstructie", "qwdolh4"],
["aig", "Vanaf welk moment mag je als boa de geweldsbevoegdheid uit artikel 7 van de Politiewet 2012 uitoefenen?", ["Nadat die op je akte is aangetekend en je je bekwaamheid hebt aangetoond.", "Direct na je beëdiging als boa, ook zonder aantekening van de bevoegdheid op de akte.", "Zodra je werkgever je een geweldmiddel heeft uitgereikt.", "Na een jaar werkervaring als boa zonder klachten."], "Een boa mag de bevoegdheden uit artikel 7 Politiewet 2012 pas uitoefenen als die bevoegdheid is aangetekend op de akte van beëdiging en de vereiste bekwaamheid is aangetoond.", "art. 39 Ambtsinstructie", "q121kgyb"],
["aig", "Mag je als boa buiten je diensttijd je geweldsbevoegdheid gebruiken?", ["Nee, alleen in de rechtmatige uitoefening van je functie.", "Ja, als je je legitimatiebewijs bij je hebt.", "Ja, bij elk strafbaar feit dat je toevallig ziet.", "Ja, maar alleen met je wapenstok."], "De geweldsbevoegdheid geldt alleen in de rechtmatige uitoefening van je functie. Buiten diensttijd ben je burger; je kunt je dan wel verdedigen in noodweer (artikel 41 Sr), maar dat is iets anders dan je ambtelijke bevoegdheid.", "art. 7 Politiewet 2012", "q11cf9hq"],
["aim", "Bij wie meld je volgens artikel 17 van de Ambtsinstructie dat je geweld hebt gebruikt?", ["Bij de hulpofficier van justitie die belast is met de registratie.", "Bij de officier van justitie van het arrondissement.", "Bij je direct toezichthouder.", "Bij de korpschef van de politie."], "Je meldt het geweld zo spoedig mogelijk bij de hulpofficier van justitie die belast is met de registratie: schriftelijk de aard, het geweldmiddel en de gevolgen; mondeling de feiten, omstandigheden en de reden.", "art. 17 Ambtsinstructie", "q1xlw9n4"],
["aim", "Binnen welke termijn meld je dat je geweld hebt gebruikt?", ["Zo spoedig mogelijk.", "Binnen 24 uur.", "Binnen drie dagen.", "Binnen een week."], "De melding gebeurt zo spoedig mogelijk na het geweldgebruik, terwijl de feiten nog vers zijn.", "art. 17 Ambtsinstructie", "q1uzlqsg"],
["aim", "Wat meld je schriftelijk nadat je geweld hebt gebruikt?", ["De aard van het geweld, het gebruikte geweldmiddel en de gevolgen.", "De feiten en omstandigheden waaronder je optrad en de reden van het geweld.", "Alleen de personalia van de verdachte en de getuigen.", "Je eigen mening over de schuld van de verdachte."], "Schriftelijk: aard, geweldmiddel en gevolgen (ezelsbruggetje SAGG: Schriftelijk Aard, Geweldmiddel, Gevolgen). De feiten, omstandigheden en reden licht je mondeling toe.", "art. 17 Ambtsinstructie", "qmmmxjm"],
["aim", "Wat licht je mondeling toe aan de hulpofficier van justitie nadat je geweld hebt gebruikt?", ["De feiten en omstandigheden en de reden waarom je geweld gebruikte.", "Alleen welk geweldmiddel je hebt gebruikt.", "De aard van het geweld en de gevolgen, zonder verdere toelichting.", "Niets; een mondelinge toelichting is alleen nodig na vuurwapengebruik."], "Mondeling licht je de feiten en omstandigheden en de reden van het geweld toe (ezelsbruggetje MONFOR: MONdeling Feiten, Omstandigheden, Reden). Zo kan de hulpofficier beoordelen of registratie nodig is.", "art. 17 Ambtsinstructie", "q7w1ouu"],
["aim", "Je gebruikt geweld op uitdrukkelijke opdracht van een aanwezige meerdere. Wie doet de melding?", ["De meerdere die de opdracht gaf.", "Jij zelf, want jij gebruikte het geweld.", "De hulpofficier van justitie.", "Jullie samen, in één gezamenlijke melding."], "Is het geweld gebruikt op uitdrukkelijke last van een aanwezige meerdere, dan doet de meerdere de melding.", "art. 17 Ambtsinstructie", "q1asjxm4"],
["aim", "In welk geval registreert de hulpofficier van justitie het gemelde geweld?", ["Bij de dood, letsel van meer dan geringe betekenis, vuurwapengebruik of op eigen oordeel.", "Alleen als de verdachte een klacht indient over het optreden van de boa.", "Alleen als er een geweldmiddel zoals pepperspray of een wapenstok is gebruikt.", "Bij elke melding van geweld, ook als niemand gewond is geraakt of er geen middel is gebruikt."], "Registratie volgt bij de dood of lichamelijk letsel van meer dan geringe betekenis, bij het gebruik van een vuurwapen, of als de hulpofficier daartoe aanleiding ziet.", "art. 17 Ambtsinstructie", "q1iw0n5k"],
["aim", "Je gebruikt geweld bij een aanhouding. Niemand raakt gewond en er is geen vuurwapen gebruikt. Welke hoofdregel geldt?", ["Je meldt het; registratie volgt alleen als de hulpofficier van justitie er aanleiding toe ziet.", "Je hoeft het geweld niet te melden, omdat er niemand gewond is geraakt en er geen vuurwapen was.", "Het geweld wordt altijd geregistreerd en gemeld aan de officier van justitie.", "Je meldt het alleen als de verdachte daar zelf om vraagt."], "Elk geweldgebruik meld je. Zonder letsel en zonder vuurwapen is registratie niet verplicht, tenzij de hulpofficier daartoe aanleiding ziet. In de praktijk wordt de melding dan alleen vastgelegd (een mutatie).", "art. 17 Ambtsinstructie", "q1g8rl3s"],
["aim", "Wat verstaan we onder lichamelijk letsel van meer dan geringe betekenis?", ["Letsel dat door een arts of verpleegkundige is behandeld of had moeten worden.", "Elk letsel dat zichtbaar is, zoals een rode plek op de huid.", "Alleen letsel waarvoor iemand in het ziekenhuis wordt opgenomen of geopereerd.", "Letsel waardoor iemand langer dan vier weken niet kan werken."], "In de lesstof geweldsbeheersing geldt als letsel van meer dan geringe betekenis: letsel dat door een arts of verpleegkundige is behandeld, of dat medisch gezien behandeld had moeten worden. Dit letsel leidt tot registratie.", "Lesstof geweldsbeheersing; art. 17 Ambtsinstructie", "q1nhzedm"],
["aim", "Welk letsel valt onder zwaar lichamelijk letsel als bedoeld in artikel 82 Sr?", ["Letsel waarvan geen volledige genezing te verwachten is.", "Een schaafwond die door een verpleegkundige is verbonden.", "Een blauwe plek die na een week weer verdwenen is.", "Een bloedneus die na een paar minuten vanzelf stopt."], "Zwaar lichamelijk letsel is onder meer ziekte zonder uitzicht op volkomen genezing, blijvende ongeschiktheid voor het beroep, verlies van een zintuig, verminking en storing van de verstandelijke vermogens die langer dan vier weken duurt.", "art. 82 Sr; art. 18 Ambtsinstructie", "q1wiz52z"],
["aim", "Wanneer wordt de officier van justitie volgens artikel 18 van de Ambtsinstructie terstond in kennis gesteld van geweldgebruik?", ["Bij de dood of zwaar lichamelijk letsel, of bij vuurwapengebruik met letsel.", "Bij elk geweldgebruik waarbij een geweldmiddel is ingezet.", "Alleen als de verdachte een advocaat heeft ingeschakeld.", "Bij letsel van meer dan geringe betekenis, zoals een wond die gehecht moest worden."], "Terstond bij de dood of zwaar lichamelijk letsel (of als daarmee rekening moet worden gehouden) en bij vuurwapengebruik met letsel. In andere gevallen zo spoedig mogelijk, als de functionaris daartoe aanleiding ziet.", "art. 18 Ambtsinstructie", "q11ljxsc"],
