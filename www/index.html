["sr","Welk orgaan stelt de Algemene Plaatselijke Verordening (APV) vast?",["De gemeenteraad","De burgemeester","Het college van B&W","Gedeputeerde Staten"],"De gemeenteraad is het hoogste orgaan van de gemeente en stelt verordeningen zoals de APV vast. De APV geldt alleen binnen die gemeente.","art. 147 Gemeentewet"],
["sr","Hoe wordt een burgemeester benoemd?",["Bij koninklijk besluit, voor zes jaar","Door de gemeenteraad, voor vier jaar","Door de Commissaris van de Koning, voor zes jaar","Rechtstreeks door de inwoners, voor vier jaar"],"De burgemeester wordt op voordracht van de minister van BZK bij koninklijk besluit benoemd voor zes jaar. Herbenoeming is mogelijk.","art. 61 Gemeentewet"],
["sr","Wie is voorzitter van zowel Provinciale Staten als Gedeputeerde Staten?",["De Commissaris van de Koning","De oudste gedeputeerde van de provincie","De minister van Binnenlandse Zaken (BZK)","De burgemeester van de hoofdstad van de provincie"],"De CdK wordt bij koninklijk besluit benoemd voor zes jaar en zit beide organen van de provincie voor.","Provinciewet"],
["sr","Welk orgaan vormt het dagelijks bestuur van de provincie?",["Gedeputeerde Staten","Provinciale Staten","De Eerste Kamer","Het waterschap"],"Provinciale Staten is de gekozen volksvertegenwoordiging. Gedeputeerde Staten (gedeputeerden en CdK) vormt het dagelijks bestuur.",""],
["sr","Wat geldt voor een wethouder?",["Hij wordt benoemd door de raad en is dan geen raadslid meer","Hij wordt benoemd door de burgemeester en blijft gewoon raadslid","Hij wordt rechtstreeks gekozen door de inwoners van de gemeente","Hij wordt bij koninklijk besluit benoemd voor een periode van zes jaar"],"Sinds de dualisering benoemt de raad de wethouders. Een wethouder kan niet tegelijk raadslid zijn.","Gemeentewet"],
["sr","Wat is actief kiesrecht?",["Het recht om te kiezen","Het recht om gekozen te worden","Het recht om een wetsvoorstel in te dienen","Het recht om een minister te ondervragen"],"Actief kiesrecht is stemmen. Passief kiesrecht is het recht om gekozen te worden.",""],
["sr","Wie mag naast Nederlanders stemmen bij gemeenteraadsverkiezingen?",["EU-burgers en anderen die minstens vijf jaar legaal in Nederland wonen","Alleen EU-burgers die in de gemeente staan ingeschreven","Iedereen die in de gemeente woont, ongeacht de duur van het verblijf hier","Niemand: alleen Nederlanders mogen stemmen voor de gemeenteraad"],"Voor de gemeenteraad mogen ook ingezetenen zonder Nederlandse nationaliteit stemmen: EU-onderdanen en anderen na vijf jaar rechtmatig verblijf.","Kieswet"],
["sr","Welke rol heeft de Raad van State bij een wetsvoorstel?",["Hij adviseert de regering over het voorstel","Hij stemt als derde Kamer over het voorstel","Hij ondertekent het voorstel","Hij publiceert het voorstel in het Staatsblad"],"De Afdeling advisering van de Raad van State toetst wetsvoorstellen en AMvB's onder meer op strijd met hogere regels en verdragen.",""],
["ro","Hoeveel rechtbanken en gerechtshoven heeft Nederland?",["11 rechtbanken en 4 gerechtshoven","10 rechtbanken en 4 gerechtshoven","19 rechtbanken en 5 gerechtshoven","12 rechtbanken en 3 gerechtshoven"],"Er zijn 11 rechtbanken (werkgebied: arrondissement), 4 gerechtshoven (werkgebied: ressort) en 1 Hoge Raad.","Wet RO"],
["ro","Hoe heet de uitspraak van een gerechtshof of van de Hoge Raad?",["Arrest","Vonnis","Beschikking","Dagvaarding"],"De rechtbank wijst een vonnis; het gerechtshof en de Hoge Raad wijzen een arrest.",""],
["ro","Welke rechter behandelt eenvoudige strafzaken waarin maximaal één jaar gevangenisstraf kan worden opgelegd?",["De politierechter","De kantonrechter","De meervoudige kamer","De rechter-commissaris"],"De politierechter is een enkelvoudige rechter van de rechtbank voor eenvoudig te bewijzen zaken; hij kan ten hoogste één jaar gevangenisstraf opleggen.","art. 369 Sv"],
["ro","Welke zaken behandelt de kantonrechter in strafzaken vooral?",["Overtredingen","Zware misdrijven","Hoger beroep","Ambtsmisdrijven van ministers"],"De kantonrechter is een enkelvoudige rechter die vooral overtredingen behandelt.",""],
["ro","Uit hoeveel rechters bestaat de meervoudige kamer van de rechtbank?",["Drie","Twee","Vijf","Eén"],"Zwaardere en ingewikkelde misdrijven gaan naar de meervoudige kamer met drie rechters.",""],
["ro","Waarop richt de Hoge Raad zich in cassatie?",["Op de toepassing van het recht en de vormvoorschriften","Op een nieuwe beoordeling van alle feiten en het bewijs in de zaak","Alleen op de hoogte van de straf die het hof heeft opgelegd","Op nieuw bewijs dat na de uitspraak bekend is geworden"],"In cassatie beoordeelt de Hoge Raad of het recht goed is toegepast en of de uitspraak voldoende gemotiveerd is. De feiten staan vast.",""],
["ro","Een veroordeelde wil een onherroepelijk vonnis laten herzien omdat er een nieuw feit (novum) is. Welk rechtsmiddel is dit?",["Herziening, een buitengewoon rechtsmiddel","Hoger beroep, een gewoon rechtsmiddel bij het hof","Cassatie, een gewoon rechtsmiddel bij de Hoge Raad","Verzet, een rechtsmiddel tegen een strafbeschikking"],"Herziening bij de Hoge Raad is een buitengewoon rechtsmiddel dat zich richt op een nieuw gebleken feit.",""],
["ro","Wie kan als enige een strafzaak aan de strafrechter voorleggen?",["Het Openbaar Ministerie","De politie","Het slachtoffer","De rechter-commissaris"],"Het OM heeft het vervolgingsmonopolie. Een rechter oordeelt alleen over zaken die het OM aan hem voorlegt.",""],
["ro","Wie treedt als aanklager op bij het gerechtshof?",["De advocaat-generaal","De officier van justitie","De procureur-generaal bij de Hoge Raad","De rechter-commissaris"],"Bij de rechtbank is de officier van justitie aanklager, bij het gerechtshof de advocaat-generaal.",""],
["ro","Wat houdt het opportuniteitsbeginsel in?",["Het OM mag afzien van vervolging om redenen van algemeen belang","Het OM moet elk strafbaar feit vervolgen als het bewijs rond is","Een verdachte mag zelf kiezen voor welke rechter hij komt","De rechter mag zelf zaken aanbrengen als het OM stilzit"],"Het OM heeft geen vervolgingsplicht. Het mag seponeren, ook als de zaak haalbaar is, bijvoorbeeld bij een zeer gering feit.","art. 167 Sv"],
["ro","Een benadeelde is het niet eens met het besluit om een verdachte niet te vervolgen. Waar kan hij terecht?",["Bij het gerechtshof, met een beklag (art. 12 Sv)","Bij de Hoge Raad, via een cassatieberoep tegen het sepot","Bij de rechter-commissaris, via een verzoek tot vervolging","Bij de Nationale ombudsman, met een klacht over het OM"],"Met een artikel 12 Sv-procedure kan een rechtstreeks belanghebbende het gerechtshof vragen vervolging te bevelen.","art. 12 Sv"],
["ro","Welke straf kan de officier van justitie NIET opleggen met een strafbeschikking?",["Een vrijheidsbenemende straf zoals gevangenisstraf","Een geldboete voor een misdrijf of voor een overtreding","Een taakstraf van maximaal 180 uur voor een misdrijf","Een ontzegging van de rijbevoegdheid tot zes maanden"],"Met een strafbeschikking kan het OM zelf straffen voor overtredingen en misdrijven met maximaal zes jaar gevangenisstraf. Vrijheidsbeneming blijft voorbehouden aan de rechter.","art. 257a Sv"],
["ro","Wat is de maximale duur van een ontzegging van de rijbevoegdheid via een strafbeschikking?",["Zes maanden","Drie maanden","Een jaar","Vijf jaar"],"Een strafbeschikking kan een rijontzegging van ten hoogste zes maanden bevatten.","art. 257a Sv"],
["ro","Welke taak heeft de rechter-commissaris?",["Het onderzoek toetsen en bijv. bewaring of woningdoorzoeking bevelen","Strafzaken op de openbare zitting behandelen en vonnis wijzen","De aanklacht opstellen en de verdachte dagvaarden voor de openbare zitting","Het vonnis ten uitvoer leggen en toezien op de tenuitvoerlegging"],"De RC behandelt geen zaken ter zitting maar heeft een toetsende rol in het onderzoek, met verdergaande bevoegdheden dan de OvJ.",""],
["ro","Welk van de volgende is GEEN wettig bewijsmiddel?",["Een vermoeden van de officier van justitie","Een verklaring van een getuige die onder ede is gehoord","Een schriftelijk bescheid zoals een proces-verbaal","De eigen waarneming van de rechter ter zitting"],"De wettige bewijsmiddelen zijn: eigen waarneming van de rechter, verklaringen van verdachte, getuige en deskundige, en schriftelijke bescheiden.","art. 339 Sv"],
["ro","De rechter vindt het feit bewezen, maar de verdachte handelde uit noodweer. Welke uitspraak volgt?",["Ontslag van alle rechtsvervolging (OVAR)","Vrijspraak wegens een rechtvaardigingsgrond","Niet-ontvankelijkheid van het OM","Schuldigverklaring zonder oplegging van straf"],"Bij OVAR is het feit bewezen, maar het feit of de dader is niet strafbaar door een strafuitsluitingsgrond. Bij vrijspraak is het feit niet bewezen.",""],
["ro","Wat wordt bedoeld met de 'staande magistratuur'?",["De leden van het Openbaar Ministerie","De rechters die zitting hebben in de rechtbank","De raadsheren die rechtspreken bij de Hoge Raad","De griffiers die het proces-verbaal opmaken"],"Het OM staat op tijdens de zitting (staande magistratuur). Rechters zitten (zittende magistratuur) en spreken recht.",""],
["ro","Hoe worden rechters benoemd?",["Bij koninklijk besluit, voor het leven","Door de minister van Justitie en Veiligheid, voor zes jaar","Door de Tweede Kamer, voor een periode van vier jaar","Door de Hoge Raad zelf, voor een termijn van tien jaar"],"Benoeming voor het leven waarborgt de onafhankelijkheid. Ontslag kan alleen in wettelijk bepaalde gevallen, op vordering van de PG bij de Hoge Raad.","art. 117 Gw"],
["ro","Wat regelt de relatieve competentie?",["Welke van de rechtbanken of gerechtshoven geografisch bevoegd is","Welk soort gerecht bevoegd is: rechtbank, gerechtshof of Hoge Raad","Welke straf de rechter in een bepaalde zaak maximaal mag opleggen","Of het OM een verdachte in een bepaalde zaak wel of niet mag vervolgen"],"Absolute competentie gaat over het soort gerecht (Wet RO). Relatieve competentie gaat over welk gerecht van die soort, dus waar (Wetboek van Strafvordering).",""],
["ro","Welke functionaris behoort NIET tot het Openbaar Ministerie?",["De procureur-generaal bij de Hoge Raad","De officier van justitie","De advocaat-generaal bij het gerechtshof","Het College van procureurs-generaal in Den Haag"],"De PG bij de Hoge Raad is onafhankelijk en hoort niet bij het OM. Hij kan wel cassatie in het belang der wet instellen.",""],
["ro","Wie staat aan het hoofd van het Openbaar Ministerie?",["Het College van procureurs-generaal","De minister-president als voorzitter van de ministerraad","De president van de Hoge Raad der Nederlanden","De hoofdofficier van het grootste parket"],"Het College van PG's leidt het OM. Het valt onder de verantwoordelijkheid van de minister van Justitie en Veiligheid.",""],
["boa","In welk artikel van het Wetboek van Strafvordering staan de buitengewoon opsporingsambtenaren?",["Artikel 142 Sv","Artikel 141 Sv","Artikel 27 Sv","Artikel 53 Sv"],"Art. 141 Sv noemt de algemene opsporingsambtenaren, art. 142 Sv de buitengewoon opsporingsambtenaren. Nadere regels staan in het Besluit buitengewoon opsporingsambtenaar.","art. 142 Sv"],
["boa","Wie is GEEN algemeen opsporingsambtenaar in de zin van art. 141 Sv?",["Een boa in de openbare ruimte","Een politieambtenaar aangesteld voor de politietaak","Een officier van justitie","Een aangewezen militair van de Koninklijke Marechaussee"],"Art. 141 Sv: OvJ, politie (politietaak), aangewezen KMar-militairen en opsporingsambtenaren van de bijzondere opsporingsdiensten. Een boa valt onder art. 142 Sv.","art. 141 Sv"],
["boa","Wat is het verschil tussen een algemeen en een buitengewoon opsporingsambtenaar?",["De boa mag alleen de feiten uit zijn akte of aanwijzing opsporen","De boa mag alle strafbare feiten in heel Nederland opsporen","De boa valt niet onder het gezag van de officier van justitie","Er is geen verschil, alleen de werkgever verschilt"],"Algemene opsporingsambtenaren mogen in beginsel alle strafbare feiten opsporen. De boa heeft een beperkte opsporingsbevoegdheid: alleen de feiten en het gebied waarvoor hij is aangewezen.",""],
["boa","Aan welke eisen moet een boa voldoen om opsporingsbevoegdheid te krijgen?",["Bekwaam en betrouwbaar zijn, een akte hebben en beëdigd zijn","Een mbo-4 diploma en een verklaring omtrent het gedrag hebben","Minstens vijf jaar bij de politie of marechaussee hebben gewerkt","Lid zijn van een erkende vakbond of beroepsvereniging voor boa's"],"De boa moet bekwaam en betrouwbaar zijn, een rechtsgrond voor zijn bevoegdheid hebben (meestal de akte) en de ambtseed of -belofte hebben afgelegd.","Besluit boa"],
["boa","Voor hoe lang wordt de akte van opsporingsbevoegdheid van een boa ten hoogste verleend?",["Vijf jaar","Eén jaar","Drie jaar","Onbeperkt"],"De opsporingsbevoegdheid wordt telkens voor maximaal vijf jaar verleend. De boa moet zijn bekwaamheid blijven aantonen via PHB.","Besluit boa"],
["boa","Welk domein hoort bij boa's in het openbaar vervoer?",["Domein IV","Domein I","Domein III","Domein VI"],"I Openbare ruimte, II Milieu, welzijn en infrastructuur, III Onderwijs, IV Openbaar vervoer, V Werk en inkomen, VI Generieke opsporing.","Beleidsregels boa"],
["boa","Wanneer mag een boa geweld of handboeien gebruiken?",["Alleen als die bevoegdheid is toegekend en hij er bekwaam voor is","Altijd, want elke opsporingsambtenaar mag geweld gebruiken","Alleen met toestemming van de burgemeester, per geval en altijd vooraf","Nooit; geweld en handboeien zijn altijd voorbehouden aan de politie"],"Politiebevoegdheden zoals geweld en vrijheidsbeperkende middelen komen een boa alleen toe als ze zijn toegekend en de vereiste (periodieke) toetsing met goed gevolg is afgelegd.","art. 7 Politiewet 2012; Besluit boa"],
["boa","Wat is 'geweld' in de zin van de Politiewet 2012?",["Elke dwangmatige kracht van meer dan geringe betekenis op personen of zaken","Alleen het gebruik van een wapen of diensthond tegen personen","Elke vorm van lichamelijk contact met een persoon, hoe licht ook, bij een controle","Alleen kracht die letsel veroorzaakt of kan veroorzaken"],"Geweld is iedere dwangmatige krachtsuitoefening van meer dan geringe betekenis op personen of zaken. Het moet voldoen aan subsidiariteit en proportionaliteit.","Ambtsinstructie"],
["boa","Wat moet een boa gedaan hebben voordat hij zijn bevoegdheden mag uitoefenen?",["De ambtseed of ambtsbelofte afleggen","Een proefexamen halen bij het examenbureau ExTH","Een jaar stage lopen bij de politie of marechaussee","Zich inschrijven bij de gemeente waar hij werkt"],"Pas na beëdiging mag de boa zijn opsporingsbevoegdheid en eventuele politiebevoegdheden uitoefenen. Zijn pv's maakt hij op ambtseed op.",""],
["boa","Onder wiens gezag staat een boa bij de opsporing van strafbare feiten?",["De officier van justitie","De burgemeester","Zijn werkgever","De korpschef van politie"],"Bij opsporing staat iedere opsporingsambtenaar, ook de boa, onder gezag van de officier van justitie.","art. 148 Sv"],
["boa","Wat is opsporing volgens het Wetboek van Strafvordering?",["Onderzoek naar strafbare feiten onder gezag van de OvJ, gericht op strafvorderlijke beslissingen","Alle controles die een ambtenaar zonder verdenking uitvoert om naleving van regels te bevorderen","Het houden van toezicht op de naleving van vergunningen en voorschriften","Het afnemen van een verklaring van een getuige op straat, zonder verdenking"],"Opsporing is gericht op strafvorderlijke beslissingen (vervolgen, seponeren). Toezicht gebeurt zonder verdenking en valt onder de Awb.","art. 132a Sv"],
["boa","Sinds wanneer geldt de AVG?",["25 mei 2018","1 januari 2016","1 maart 2017","1 juli 2020"],"De Algemene verordening gegevensbescherming geldt sinds 25 mei 2018. Voor de verwerking van politiegegevens geldt de Wet politiegegevens (Wpg).",""],
["boa","Wat is een persoonsgegeven?",["Alle informatie over een identificeerbare natuurlijke persoon","Alleen naam, adres, woonplaats en geboortedatum van een burger","Alleen gegevens die in een paspoort of identiteitskaart staan","Alleen medische en strafrechtelijke gegevens van een persoon"],"Een persoonsgegeven is elk gegeven dat direct of indirect iets zegt over een herkenbare persoon, bijvoorbeeld ook een kenteken of foto.","art. 4 AVG"],
["boa","Valt het alleen raadplegen (bekijken) van gegevens in een systeem onder 'verwerken'?",["Ja, ook raadplegen is verwerken","Nee, alleen opslaan is verwerken","Nee, alleen verstrekken aan derden is verwerken","Alleen als de gegevens worden gewijzigd"],"Verwerken omvat vrijwel alles: verzamelen, vastleggen, ordenen, opslaan, wijzigen, opvragen, raadplegen, gebruiken, verstrekken en vernietigen.","art. 4 AVG; art. 1 Wpg"],
["boa","Welke wet geldt voor boa's als zij gegevens verwerken in het kader van de opsporing van strafbare feiten?",["De Wet politiegegevens (Wpg)","De Wet justitiële en strafvorderlijke gegevens","Uitsluitend de AVG, net als andere overheden","De Archiefwet voor overheidsorganen"],"De Wpg is van toepassing op politie, boa's en bijzondere opsporingsdiensten bij de verwerking van politiegegevens. Voor andere verwerkingen geldt de AVG.","Wpg"],
["pol","Wat is de taak van de politie volgens de Politiewet 2012?",["Onder het bevoegd gezag zorgen voor handhaving van de rechtsorde en hulpverlening","Regels opstellen en uitvoeren in opdracht van de minister van J&V","Verdachten berechten en straffen opleggen bij overtredingen","Alleen strafbare feiten opsporen, onder gezag van de burgemeester en de minister"],"De politietaak omvat handhaving van de openbare orde, strafrechtelijke handhaving van de rechtsorde en hulpverlening aan hen die dat behoeven.","art. 3 Politiewet 2012"],
["pol","Wie heeft het gezag over de politie bij handhaving van de openbare orde en hulpverlening?",["De burgemeester","De officier van justitie","De korpschef","De minister van Defensie"],"Bij openbare orde en hulpverlening heeft de burgemeester het gezag. Bij strafrechtelijke handhaving is dat de officier van justitie.","art. 11 Politiewet 2012"],
["pol","Wie heeft het gezag over de politie bij de strafrechtelijke handhaving van de rechtsorde?",["De officier van justitie","De burgemeester","De Commissaris van de Koning","De politiechef van de eenheid"],"De OvJ heeft het gezag bij opsporing. Hij valt onder het College van PG's, dat weer onder de minister van J&V valt.","art. 12 Politiewet 2012"],
["pol","Wie is verantwoordelijk voor het beheer van de (landelijke) politie?",["De minister van Justitie en Veiligheid","De burgemeester van Den Haag als korpsbeheerder","Het College van procureurs-generaal in Den Haag","De minister van Binnenlandse Zaken en Koninkrijksrelaties"],"Er is één landelijk korps onder beheer van de minister van J&V. De korpschef heeft de dagelijkse leiding.","Politiewet 2012"],
["pol","Hoe is de Nationale Politie ingedeeld?",["In tien regionale eenheden, één landelijke eenheid en het PDC","In 25 regiokorpsen die elk een eigen korpschef hebben","In twaalf eenheden, één per provincie, met een eigen korpschef","In vier ressorten met elk een landelijke en regionale eenheid"],"Er zijn tien regionale eenheden (gelijk aan de arrondissementen), één landelijke eenheid en een PDC voor ondersteuning.",""],
["pol","Wie nemen deel aan het lokale driehoeksoverleg?",["De burgemeester, de officier van justitie en de politiechef","De burgemeester, de wethouder van veiligheid en de gemeenteraad","De minister, de korpschef en de commissaris van de Koning samen","De rechter, de officier van justitie en de advocaat van de verdachte"],"In de driehoek stemmen gezag (burgemeester en OvJ) en politie de inzet af.",""],
["pol","Waar is de bevoegdheid van de politie geregeld om geweld te gebruiken?",["Artikel 7 Politiewet 2012","Artikel 52 Wetboek van Strafvordering","Artikel 41 Wetboek van Strafrecht","Artikel 12 van de Grondwet (huisrecht)"],"Art. 7 Politiewet 2012 regelt geweld (lid 1), veiligheidsfouillering (lid 3) en vervoersfouillering (lid 4). Lid 9 maakt toekenning aan boa's mogelijk.","art. 7 Politiewet 2012"],
["pol","Welke dienst doet onafhankelijk onderzoek naar strafbare feiten door bijvoorbeeld politieambtenaren?",["De Rijksrecherche","De Inspectie Justitie en Veiligheid","De Landelijke Eenheid","De Koninklijke Marechaussee"],"De Rijksrecherche werkt onder gezag van het College van PG's en onderzoekt onder meer integriteitszaken bij politie en openbaar bestuur.",""],
["pol","Waar is een politieambtenaar bevoegd zijn taak uit te voeren?",["In heel Nederland, al werkt hij meestal in zijn eigen gebied","Alleen in het werkgebied van zijn eigen basisteam en de aangrenzende wijken","Alleen in de gemeente waar hij is aangesteld en waar hij is beëdigd","Alleen in zijn eigen regionale eenheid, behalve bij heterdaad"],"De politieambtenaar is landelijk bevoegd. Hij wordt wel in een bepaald gebied tewerkgesteld.",""],
["pol","Hoeveel veiligheidsregio's heeft Nederland?",["25","10","12","43"],"Er zijn 25 veiligheidsregio's. De voorzitter is een burgemeester uit de regio, meestal die van de grootste gemeente.","Wet veiligheidsregio's"],
["str","Tot welk rechtsgebied behoort het strafrecht?",["Publiekrecht","Privaatrecht","Burgerlijk recht","Arbeidsrecht"],"Publiekrecht regelt de verhouding burger–overheid (staatsrecht, bestuursrecht, strafrecht). Privaatrecht regelt de verhoudingen tussen burgers onderling.",""],
["str","Wat regelt het materieel strafrecht?",["Wat strafbaar is, wie strafbaar is en welke straf erop staat","Hoe de opsporing, vervolging en berechting in de praktijk verlopen","Welke bevoegdheden een opsporingsambtenaar heeft bij verdenking","Hoe een rechtszaak bij de rechter wordt ingeleid en behandeld"],"Materieel strafrecht (vooral het Wetboek van Strafrecht) zegt wat strafbaar is. Formeel strafrecht (Wetboek van Strafvordering) zegt hoe het strafrecht wordt toegepast.",""],
["str","Waar staan de opsporingsbevoegdheden zoals staande houden en aanhouden?",["In het Wetboek van Strafvordering (formeel strafrecht)","In het Wetboek van Strafrecht (materieel strafrecht), Boek 1","In de Grondwet","In de APV"],"Bevoegdheden horen bij het formele strafrecht en staan in het Wetboek van Strafvordering en bijzondere wetten.",""],
["str","Wat houdt het legaliteitsbeginsel in?",["Geen feit is strafbaar dan uit kracht van een daaraan voorafgegane wettelijke strafbepaling","Het OM hoeft niet elk strafbaar feit te vervolgen als het algemeen belang dat vraagt","De Nederlandse strafwet geldt voor iedereen die op Nederlands grondgebied een feit pleegt","Bijzondere wetten gaan altijd voor algemene wetten als ze hetzelfde regelen"],"Er moet al vóór het feit een wettelijke strafbepaling bestaan. Straffen met terugwerkende kracht is niet mogelijk.","art. 1 lid 1 Sr; art. 16 Gw"],

["kl","Een vrouw steelt geld van haar echtgenoot; zij zijn niet van tafel en bed of van goederen gescheiden. Kan zij worden vervolgd?",["Nee, vervolging is dan uitgesloten","Ja, ambtshalve","Ja, maar alleen op klacht van de echtgenoot","Ja, maar alleen bij een bedrag boven € 500"],"Tussen niet gescheiden echtgenoten is strafvervolging voor deze vermogensdelicten uitgesloten. Na scheiding van tafel en bed of van goederen kan het op klacht.","art. 316 lid 1 Sr"],
["kl","Is eenvoudige mishandeling een klachtdelict?",["Nee, mishandeling is altijd ambtshalve vervolgbaar","Ja, het is een absoluut klachtdelict in alle gevallen","Ja, het is een relatief klachtdelict","Alleen als dader en slachtoffer familie van elkaar zijn"],"Ook als het slachtoffer geen aangifte doet, kan het OM mishandeling vervolgen.","art. 300 Sr"],
["kl","Iemand doet aangifte van een diefstal waarvan hij weet dat die niet heeft plaatsgevonden. Wat pleegt hij?",["Een valse aangifte","Meineed","Smaad","Geen strafbaar feit"],"Het opzettelijk aangifte doen van een strafbaar feit, wetende dat het niet is gepleegd, is strafbaar.","art. 188 Sr"],

["sch","Welke formulering in een delictsomschrijving wijst op schuld (culpa) en niet op opzet?",["'Redelijkerwijs moest vermoeden'","'Wetende dat'","'Met het oogmerk van wederrechtelijke toe-eigening'","'Opzettelijk en wederrechtelijk'"],"Culpa is aanmerkelijke onvoorzichtigheid of grove nalatigheid. Andere aanduidingen: 'aan wiens schuld te wijten', 'ernstige reden heeft om te vermoeden'.",""],
["sch","Is bij een overtreding opzet of schuld een bestanddeel dat bewezen moet worden?",["Meestal niet; enige schuld wordt verondersteld","Ja, bij een overtreding moet altijd opzet worden bewezen","Ja, altijd schuld in de vorm van grove nalatigheid","Ja, opzet en schuld moeten beide worden bewezen"],"Bij de meeste overtredingen is opzet of schuld geen bestanddeel. Wel moet er 'enige schuld' zijn; bij afwezigheid van alle schuld volgt geen straf.",""],
["sch","Wanneer is een poging strafbaar?",["Bij een misdrijf, als het voornemen blijkt uit een begin van uitvoering","Bij elk strafbaar feit, ook een overtreding, zodra iemand het plan heeft opgevat","Alleen bij overtredingen die meerdere keren door dezelfde persoon worden gepleegd","Alleen als er schade is ontstaan bij het slachtoffer"],"Poging tot een overtreding is niet strafbaar. Er moet een begin van uitvoering zijn, niet alleen voorbereiding.","art. 45 Sr"],

["sch","Wanneer zijn voorbereidingshandelingen strafbaar?",["Bij misdrijven waarop acht jaar of meer gevangenisstraf staat","Bij alle misdrijven waarop een gevangenisstraf of hechtenis staat","Bij alle overtredingen en misdrijven uit het Wetboek van Strafrecht","Nooit; alleen poging is strafbaar"],"Voorbereiding is strafbaar bij zware misdrijven (8 jaar of meer). Het maximum wordt met de helft verminderd.","art. 46 Sr"],
["sch","Een inbreker staat al aan een raam te wrikken, maar ziet ervan af omdat hij spijt krijgt. Is hij strafbaar voor poging?",["Nee, bij vrijwillige terugtred is de poging niet strafbaar","Ja, want hij was al begonnen met de uitvoering","Ja, maar de maximumstraf wordt met een derde verminderd","Alleen als het raam beschadigd is of iemand hem zag"],"Vrijwillige terugtred maakt de poging straffeloos. Stopt hij door omstandigheden van buitenaf (zoals een alarm), dan blijft hij strafbaar. Een eventuele vernieling kan wel apart strafbaar zijn.","art. 46b Sr"],

["sch","A laat B, die psychisch ernstig ziek en ontoerekeningsvatbaar is, een auto in brand steken. Welke deelnemingsvorm past bij A?",["Doen plegen","Uitlokking","Medeplegen","Medeplichtigheid"],"Bij doen plegen gebruikt de dader een ander als 'werktuig' die zelf niet strafbaar is. Bij uitlokking is de uitgelokte wel strafbaar.","art. 47 Sr"],
["sch","Wat is uitlokking?",["Een strafbare ander met een wettelijk middel opzettelijk tot een feit bewegen","Samen met een ander in nauwe en bewuste samenwerking een strafbaar feit plegen","Een ander die zelf niet strafbaar is een feit laten plegen","Opzettelijk hulp of middelen bieden aan een ander bij het plegen van een misdrijf"],"Uitlokkingsmiddelen zijn onder meer giften, beloften, misbruik van gezag, geweld, bedreiging, misleiding en het verschaffen van gelegenheid, middelen of inlichtingen.","art. 47 lid 1 sub 2 Sr"],
["sch","Wat is medeplegen?",["Bewuste en nauwe samenwerking van twee of meer personen bij een feit","Het opzettelijk verlenen van hulp of middelen aan een ander die het feit pleegt","Het bedenken en plannen van een feit dat een ander vervolgens uitvoert","Het achteraf verbergen of verkopen van de buit"],"Iedere medepleger wordt als dader gestraft. Medeplegen kan bij misdrijven en overtredingen.","art. 47 Sr"],
["sch","Wat geldt voor medeplichtigheid aan een overtreding?",["Die is niet strafbaar","Die wordt gestraft als dader","Het maximum wordt met een derde verminderd","Het maximum wordt gehalveerd"],"Medeplichtigheid is alleen strafbaar bij misdrijven. Het maximum wordt dan met een derde verminderd.","art. 48, 49 en 52 Sr"],
["sch","Kan een rechtspersoon, zoals een bv of een gemeente, een strafbaar feit begaan?",["Ja","Nee, alleen natuurlijke personen","Alleen een bv, geen gemeente","Alleen bij overtredingen"],"Strafbare feiten kunnen worden begaan door natuurlijke personen en rechtspersonen.","art. 51 Sr"],
["sch","Wat is het verschil tussen een rechtvaardigingsgrond en een schulduitsluitingsgrond?",["Een rechtvaardigingsgrond neemt de wederrechtelijkheid weg, een schulduitsluitingsgrond de verwijtbaarheid","Een rechtvaardigingsgrond neemt de verwijtbaarheid weg, een schulduitsluitingsgrond de wederrechtelijkheid","Een schulduitsluitingsgrond geldt alleen voor ambtenaren in functie","Een rechtvaardigingsgrond geldt alleen bij overtredingen, niet bij misdrijven"],"Rechtvaardigingsgronden: noodweer, noodtoestand, wettelijk voorschrift, bevoegd ambtelijk bevel. Schulduitsluitingsgronden: ontoerekenbaarheid, psychische overmacht, noodweerexces, onbevoegd bevel (te goeder trouw), AVAS.",""],

["sch","Een boa voert in opdracht van de wet een handeling uit die anders strafbaar zou zijn. Welke strafuitsluitingsgrond?",["Wettelijk voorschrift","Bevoegd ambtelijk bevel","Noodweer","Psychische overmacht"],"Wie een feit begaat ter uitvoering van een wettelijk voorschrift, is niet strafbaar.","art. 42 Sr"],
["sch","Een ondergeschikte voert een onbevoegd gegeven ambtelijk bevel uit. Wanneer is hij toch niet strafbaar?",["Als hij het te goeder trouw bevoegd achtte en het binnen zijn ondergeschiktheid lag","Altijd, want een ondergeschikte moet een bevel van zijn leidinggevende opvolgen","Nooit; een onbevoegd bevel rechtvaardigt nooit iets","Alleen als hij eerst schriftelijk bezwaar maakte bij zijn meerdere"],"Een bevoegd gegeven bevel rechtvaardigt. Een onbevoegd gegeven bevel sluit alleen onder deze voorwaarden de schuld uit.","art. 43 Sr"],
["sch","Wat bedoelt men met ontoerekeningsvatbaarheid?",["De dader kan het feit niet worden toegerekend door een psychische stoornis","De dader handelde uit noodweer of noodweerexces","De dader was zwaar onder invloed van alcohol of drugs toen hij het feit pleegde","De dader was minderjarig en daarom niet strafrechtelijk aansprakelijk voor het feit"],"De dader is dan niet strafbaar; de rechter kan wel een maatregel opleggen, zoals tbs.","art. 39 Sr"],
["sch","Wat is AVAS?",["Afwezigheid van alle schuld, een ongeschreven schulduitsluitingsgrond","Aanvullende vervolging van alle strafbare feiten: een strafverzwaringsgrond","Een rechtsmiddel tegen een strafbeschikking","Een vorm van deelneming naast medeplegen en uitlokken"],"AVAS komt uit de rechtspraak (Melk-en-waterarrest, 1916): wie redelijkerwijs niets te verwijten valt, wordt niet gestraft.",""],

["amb","Een voorbijganger scheldt een boa in functie uit voor 'klootzak'. Welk feit is dit?",["Eenvoudige belediging van een ambtenaar in functie","Smaad, omdat het in het openbaar gebeurt waar anderen bij zijn","Laster, omdat de bewering onwaar is","Wederspannigheid tegen een ambtenaar in functie (art. 180 Sr)"],"Eenvoudige belediging is een aantasting van iemands eer zonder het karakter van smaad. Tegen een ambtenaar in functie is dit ambtshalve vervolgbaar.","art. 266 en 267 Sr"],

["agr","Wat kenmerkt frustratieagressie?",["Ze komt voort uit onmacht of teleurstelling en het gevoel niet gehoord te worden","Ze wordt bewust en berekenend ingezet om iets gedaan te krijgen van de boa of anderen","Ze komt alleen voor bij jongeren en mensen onder invloed","Ze is altijd vooraf gepland en gericht op een bepaald doel"],"Bij frustratieagressie werkt de-escaleren goed: erkennen, luisteren, kalm blijven en uitleg geven.",""],
["agr","Wat kenmerkt instrumentele agressie?",["Ze wordt doelbewust ingezet om iets gedaan te krijgen","Ze ontstaat uit verdriet of teleurstelling over een besluit","Ze verdwijnt zodra je meer begrip toont","Ze is altijd onschuldig en gaat na een paar minuten vanzelf voorbij"],"Bij instrumentele agressie werkt toegeven averechts. Begrenzen, duidelijk zijn en consequenties benoemen is dan passend.",""],
["agr","Iemand is boos omdat hij een bekeuring krijgt en begint te schreeuwen. Wat is de beste eerste stap?",["Kalm blijven, de emotie erkennen en grenzen helder aangeven","Terug schreeuwen om het overwicht in het gesprek zelf te houden","Direct aanhouden wegens belediging of bedreiging","Weglopen zonder iets te zeggen, tot hij vanzelf weer is afgekoeld"],"Erkennen ('Ik zie dat u boos bent') kan de spanning verlagen zonder dat je toegeeft op de inhoud.",""],
["agr","Waarom is een ruime afstand en een schuine positie (ongeveer 45 graden) tegenover iemand verstandig?",["Het is minder confronterend en geeft jou reactieruimte","Zo kun je makkelijker schrijven en je bon of rapport invullen","Dan kan de ander je niet goed verstaan en blijft hij rustig","Dat is wettelijk verplicht bij elke staandehouding"],"Recht tegenover iemand staan voelt bedreigend. Afstand geeft tijd om te reageren bij gevaar.",""],
["agr","Wanneer is de-escaleren met woorden niet meer de juiste reactie?",["Bij direct gevaar voor jezelf of anderen; dan gaat veiligheid voor","Zodra iemand zijn stem verheft of begint te vloeken","Nooit, want praten werkt in elke situatie het best","Als je haast hebt en nog meer meldingen moet afhandelen"],"Veiligheid gaat voor. Afstand nemen, assistentie vragen of (als je bevoegd bent) proportioneel ingrijpen.",""],
["agr","Waarom is het verstandig om bij een escalerend gesprek een collega de leiding te laten nemen?",["Een nieuw gezicht kan de spanning doorbreken als het contact is vastgelopen","Omdat je dan zelf even kunt pauzeren en iets kunt drinken","Dat is altijd verplicht volgens de geweldsinstructie voor boa's die in functie zijn","Om de persoon te intimideren met meer uniformen"],"Afwisselen van gesprekspartner is een bekende de-escalatietechniek.",""],
["agr","Wat is een goede manier om een grens te stellen?",["Het gedrag benoemen, de grens aangeven en het gevolg noemen als het doorgaat","Dreigen met zware straffen, ook als je die zelf niet kunt of niet mag opleggen","Niets zeggen en hopen dat het gedrag vanzelf stopt","De persoon belachelijk maken waar anderen bij zijn"],"Wees duidelijk en consequent. Noem alleen gevolgen die je ook echt kunt en mag uitvoeren.",""],
["agr","Een persoon onder invloed reageert verward en onvoorspelbaar. Waar let je vooral op?",["Eigen veiligheid, korte duidelijke zinnen en zo nodig medische hulp","Een uitgebreide uitleg over de regels die hij overtreedt","Zo snel mogelijk een verklaring van hem afnemen","Hem alleen laten zodat hij tot rust kan komen"],"Iemand onder invloed verwerkt informatie slecht en kan medische zorg nodig hebben.",""],
["prof","Wat bedoelen we met een professionele beroepshouding van een boa?",["Integer, neutraal, respectvol en consequent optreden","Zo veel mogelijk bekeuringen schrijven om de norm te halen","Altijd toegeven om conflicten met burgers te voorkomen","Je eigen mening laten meewegen in elke beslissing"],"Burgers moeten erop kunnen vertrouwen dat iedereen op dezelfde manier wordt behandeld.",""],
["prof","Een kennis van je wordt betrapt op een overtreding. Wat doe je?",["Je handelt zoals bij ieder ander, of laat een collega optreden","Je laat hem gaan met een mondelinge waarschuwing, omdat je hem goed kent","Je geeft hem een extra hoge boete om partijdigheid te vermijden","Je vraagt hem het te herstellen en meldt verder niets"],"Vermijd belangenverstrengeling. Gelijke behandeling is een basisprincipe.",""],
["prof","Waarom spreek je een burger in principe aan met 'u'?",["Het toont respect en houdt professionele afstand","Dat is wettelijk verplicht voor ambtenaren in uniform","Omdat 'je' in alle situaties onbeleefd is","Zo hoef je minder uit te leggen aan de burger tegenover je"],"In sommige situaties kan 'je' contact makkelijker maken (bijvoorbeeld bij jongeren), maar 'u' is het neutrale startpunt.",""],
["prof","Wat is het doel van je uitleg bij een sanctie ('waarom krijg ik deze boete?')?",["Begrip en acceptatie van de sanctie vergroten","De burger laten inzien dat hij dom heeft gehandeld","Het gesprek rekken tot de burger vanzelf vertrekt","Uitleg is niet nodig; de boete spreekt voor zich"],"Uitleg verhoogt de acceptatie, ook als iemand het niet eens is met de beslissing.",""],
["prof","Wat doe je na een ingrijpend of agressief incident tijdens je dienst?",["Het incident melden en gebruikmaken van nazorg of een gesprek","Doorwerken alsof er niets is gebeurd, om sterk over te komen","Op sociale media vertellen wat er gebeurde, als waarschuwing","Afwachten of het nog eens gebeurt voordat je iets meldt"],"Melden is belangrijk voor beleid, nazorg en eventuele aangifte. Gebruik collegiale opvang.",""],
["waa","Wat is een objectieve waarneming?",["Een waarneming van controleerbare feiten, zonder eigen interpretatie","Een waarneming waarin je ook je gevoel en indruk beschrijft","Een conclusie over de bedoeling van iemand, op basis van je eigen ervaring","Een waarneming die je van een collega of getuige hebt gehoord"],"'De man liep zwalkend en rook naar alcohol' is waarneming. 'De man was dronken' is een conclusie.",""],
["waa","Welke zin is een interpretatie en geen waarneming?",["'De man was agressief.'","'De man balde zijn vuisten.'","'De man riep: Ik sla je in elkaar.'","'De man stond op ongeveer een meter van mij.'"],"Beschrijf het gedrag dat je zag en hoorde. De lezer moet zelf kunnen concluderen dat iemand agressief was.",""],
["waa","Welke factoren kunnen een waarneming vertekenen?",["Vooroordelen, stress, verwachtingen en slecht zicht of licht","Alleen het weer, zoals regen of mist","Alleen de leeftijd en het geslacht van de waarnemer","Niets, een getrainde boa neemt altijd juist waar"],"Wees je bewust van eigen filters. Leg ook omstandigheden zoals afstand, licht en zicht vast.",""],
["waa","In welke volgorde beschrijf je een signalement meestal?",["Van algemeen naar details, en kleding van boven naar beneden","Willekeurig, in de volgorde waarin het je opviel","Eerst de schoenen en kleding, dan pas het gezicht en het postuur","Alleen opvallende kenmerken zoals tatoeages, littekens en piercings"],"Een vaste volgorde zorgt dat je niets vergeet en dat collega's het snel kunnen gebruiken.",""],
["waa","Welke informatie hoort bij de beschrijving van een plaats van een voorval?",["De exacte plek, zoals straat en huisnummer, en omstandigheden zoals licht","Alleen de naam van de stad en de wijk","Alleen de postcode, zodat de lezer de plek later zelf kan opzoeken op een kaart","Je eigen mening over de buurt en de mensen die er wonen"],"De lezer moet de plaats kunnen terugvinden en de situatie kunnen voorstellen.",""],
["waa","Wat is het verschil tussen eigen waarneming en informatie van horen zeggen?",["Eigen waarneming zag of hoorde je zelf; horen zeggen heb je van een ander","Er is geen verschil zolang je het in het pv zet","Horen zeggen is altijd onbetrouwbaar en mag niet in een verslag","Eigen waarneming is altijd schriftelijk, horen zeggen mondeling"],"In een pv moet duidelijk zijn wat je zelf waarnam en wat je van anderen hoorde, met wie dat was.",""],
["pv","Welke vragen moet een goed verslag of proces-verbaal beantwoorden?",["Wie, wat, waar, wanneer, waarom, hoe en waarmee","Alleen wie en wat, de rest is bijzaak","Alleen wanneer en waar het gebeurde","Alleen welke straf passend is voor de dader"],"Met deze vragen (de 'gouden W's') controleer je of je verslag volledig is.",""],
["pv","In welke vorm schrijf je een proces-verbaal van bevindingen?",["In de ik-vorm en in de verleden tijd","In de wij-vorm en in de toekomende tijd","In de derde persoon en in de tegenwoordige tijd","Maakt niet uit"],"Je beschrijft wat jij hebt waargenomen of gedaan, dus 'Ik zag…', 'Ik hoorde…'.",""],
["pv","Waarom heeft een proces-verbaal van een opsporingsambtenaar bijzondere bewijskracht?",["Het is opgemaakt op ambtseed of ambtsbelofte","Omdat het altijd getypt en digitaal opgeslagen is","Omdat de verdachte het altijd ondertekent","Omdat het door de officier van justitie wordt geschreven"],"Het pv geldt als wettig bewijsmiddel. Een pv van één opsporingsambtenaar kan in beginsel voldoende zijn voor het bewijs.","art. 344 Sv"],
["pv","Hoe neem je een opvallende uitspraak van een verdachte op in je pv?",["Letterlijk tussen aanhalingstekens","Samengevat in eigen woorden","Helemaal niet, alleen zijn naam","Alleen als hij het er later mee eens is"],"Letterlijke weergave voorkomt misverstanden en vergroot de bewijswaarde.",""],
["pv","Moet de cautie in het proces-verbaal worden vermeld?",["Ja","Nee","Alleen bij een misdrijf","Alleen als de verdachte heeft bekend"],"Uit het pv moet blijken dat de cautie is gegeven. Anders kan de verklaring van het bewijs worden uitgesloten.","art. 29 Sv"],
["pv","Wat hoort NIET in een objectief proces-verbaal?",["Je persoonlijke mening over het karakter van de verdachte","Het tijdstip en de datum van het voorval","De plaats van het voorval en de omstandigheden die er toen waren","Wat de verdachte letterlijk zei, tussen aanhalingstekens geplaatst"],"Houd het feitelijk. Een oordeel over het karakter van iemand is niet controleerbaar.",""],
["pv","Je ontdekt na het afronden dat je een fout in je pv hebt gemaakt. Wat doe je?",["Een aanvullend proces-verbaal opmaken","Het origineel aanpassen alsof er niets was","De fout negeren","Het pv vernietigen"],"Wijzigen na ondertekening gebeurt via een aanvullend pv, zodat duidelijk is wat er veranderd is.",""],
["pv","Waarom vermeld je in je pv hoe je tot je bevindingen kwam (bijvoorbeeld: 'Ik stond op ongeveer 10 meter afstand bij daglicht')?",["Zodat de lezer de betrouwbaarheid kan beoordelen","Om het pv langer en daardoor overtuigender te maken","Omdat de verdachte dat altijd wil weten","Dat is niet nodig; alleen de bevindingen zelf tellen"],"De rechter moet kunnen nagaan hoe je waarneming tot stand kwam.",""],
["avg","Welke grondslag gebruikt een gemeente meestal voor het verwerken van persoonsgegevens bij handhaving?",["Noodzakelijk voor een taak van algemeen belang of openbaar gezag","Toestemming van de betrokkene, gevraagd bij de controle","Gerechtvaardigd belang van de gemeente als organisatie","Uitvoering van een overeenkomst tussen gemeente en burger"],"Een overheidsorgaan kan voor zijn publieke taken niet steunen op gerechtvaardigd belang. Toestemming is bij handhaving ook niet vrijwillig.","art. 6 AVG"],
["avg","Binnen welke termijn moet een organisatie een datalek in principe melden bij de Autoriteit Persoonsgegevens?",["Binnen 72 uur na ontdekking","Binnen 24 uur na ontdekking","Binnen 14 dagen na ontdekking","Binnen een maand na ontdekking"],"Tenzij het lek waarschijnlijk geen risico oplevert. Bij een hoog risico moeten ook de betrokkenen worden geïnformeerd.","art. 33 AVG"],
["avg","Je stuurt per ongeluk een pv met persoonsgegevens naar het verkeerde e-mailadres. Wat is dit?",["Een datalek dat je direct intern moet melden","Geen probleem, want het was een ongeluk","Alleen een probleem als de ontvanger klaagt","Iets wat je zelf mag oplossen zonder melding"],"Meld een (mogelijk) datalek direct bij je leidinggevende of de privacy-functionaris, zodat de organisatie kan beoordelen of het binnen 72 uur gemeld moet worden.",""],
["avg","Wat houdt het beginsel van doelbinding in?",["Gegevens alleen gebruiken voor het doel waarvoor ze zijn verzameld","Gegevens mogen voor elk doel worden gebruikt zodra ze zijn verzameld","Gegevens moeten altijd openbaar zijn voor de betrokkene","Alleen de politie mag gegevens gebruiken voor handhaving"],"Gegevens uit een handhavingszaak mag je bijvoorbeeld niet gebruiken om iemand privé na te zoeken.","art. 5 AVG"],
["avg","Mag een boa uit nieuwsgierigheid de gegevens van zijn buurman opzoeken in een politiesysteem?",["Nee, raadplegen mag alleen als dat nodig is voor zijn taak","Ja, als hij het niet doorvertelt aan anderen","Ja, boa's hebben onbeperkte toegang tot alle politiesystemen","Ja, als het buiten diensttijd en op eigen apparatuur gebeurt"],"Onrechtmatig raadplegen is een schending van de Wpg en kan tuchtrechtelijke en strafrechtelijke gevolgen hebben. Raadplegingen worden gelogd.","Wpg"],
["avg","Welk gegeven is een bijzonder persoonsgegeven volgens de AVG?",["Een gegeven over iemands gezondheid","Iemands postcode en huisnummer van zijn woning","Het kenteken van iemands auto","De naam van iemands werkgever"],"Bijzondere persoonsgegevens zijn onder meer ras of etniciteit, politieke opvattingen, religie, gezondheid en seksuele leven. Voor verwerking gelden extra strenge regels.","art. 9 AVG"],
["avg","Wie houdt in Nederland toezicht op de naleving van de AVG en de Wpg?",["De Autoriteit Persoonsgegevens","De Inspectie Justitie en Veiligheid","De Nationale ombudsman","Het Openbaar Ministerie"],"De AP kan onderzoek doen en boetes opleggen.",""],
["avg","Welk recht heeft een betrokkene op grond van de AVG?",["Het recht op inzage in zijn persoonsgegevens","Het recht om alle gegevens van anderen in te zien","Het recht om een boete of bekeuring te weigeren","Het recht om een boa te kiezen"],"Andere rechten zijn onder meer rectificatie, verwijdering en bezwaar. Voor politiegegevens gelden aangepaste regels in de Wpg.","art. 15 AVG"],
["avg","Wat is dataminimalisatie?",["Niet meer gegevens verwerken dan nodig is voor het doel","Gegevens zo klein mogelijk opslaan om opslagruimte te sparen","Alleen digitale gegevens bewaren en al het papier vernietigen","Gegevens zo snel mogelijk delen met partners"],"Noteer alleen wat je nodig hebt voor je taak.","art. 5 AVG"],
["wijk","Wat is de kern van wijkgericht werken voor een boa?",["Zichtbaar en aanspreekbaar zijn en met bewoners en partners problemen aanpakken","Zo veel mogelijk bekeuringen schrijven in één wijk om de norm te halen","Alleen reageren op meldingen die via de meldkamer binnenkomen","Uitsluitend surveilleren met de auto, zodat je meer gebied dekt"],"De boa is de ogen en oren van de gemeente in de wijk en werkt samen met onder meer de wijkagent.",""],
["wijk","Met wie werkt een boa in de openbare ruimte vaak het meest samen in de wijk?",["De wijkagent","De rechter-commissaris","De advocaat-generaal","De Commissaris van de Koning"],"De boa is verplicht samen te werken met de politie. In de wijk is de wijkagent het eerste aanspreekpunt.",""],
["wijk","Je ziet bij een bewoner signalen van verwaarlozing of verwardheid. Wat doe je?",["Signaleren en doorgeven aan een partner, zoals het wijkteam of de GGD","Niets, het is geen strafbaar feit en dus geen taak voor jou","De bewoner direct bekeuren voor vervuiling of overlast","Het melden in de buurtapp zodat buren een oogje in het zeil houden"],"Wijkgericht werken gaat ook om zorgsignalen. Zorg dat ze bij de juiste hulpverlener terechtkomen.",""],
["wijk","Wat is het voordeel van informeel contact met bewoners en ondernemers?",["Je krijgt sneller informatie en vertrouwen, zodat problemen eerder opvallen","Je hoeft dan minder te handhaven, omdat mensen je kennen en je regels respecteren","Je kunt gunsten verlenen aan mensen die je helpen","Er is geen voordeel; het kost alleen extra tijd"],"Vertrouwen maakt het makkelijker om meldingen te krijgen en conflicten vroeg op te lossen.",""],
["wijk","Wat is een voorbeeld van een probleemgerichte aanpak bij steeds terugkerende overlast?",["Met partners de oorzaak analyseren en gerichte maatregelen combineren","Elke keer opnieuw dezelfde bekeuring schrijven zonder te kijken naar de oorzaak","De overlast negeren tot er een officiële klacht komt","Alleen een brief sturen naar alle bewoners en ondernemers van de straat"],"Kijk naar dader, slachtoffer en locatie, en combineer handhaving, preventie en zorg.",""],
["cult","Wat bedoelen we met cultureel vakmanschap?",["Professioneel omgaan met mensen met een andere achtergrond, zonder vooroordelen","Weten welke culturen 'lastig' zijn en daar extra op letten","Alleen optreden in de gemeenschap waaruit je zelf komt","Iedere culturele groep op een eigen manier handhaven en beoordelen"],"Het gaat om bewustzijn van eigen en andermans referentiekader, en om gelijke behandeling.",""],
["cult","Wat is etnisch profileren?",["Controleren op basis van etniciteit of uiterlijk zonder objectieve reden","Het noteren van een signalement met huidskleur in een pv","Het spreken met een tolk bij een gesprek met een burger","Het aanspreken van groepen jongeren die overlast veroorzaken"],"Etnisch profileren is discriminatie. Selecteer op gedrag en concrete informatie, niet op uiterlijk.","art. 1 Gw"],
["cult","Waarom is het belangrijk je bewust te zijn van je eigen vooroordelen?",["Omdat ze je waarneming en beslissingen onbewust kunnen beïnvloeden","Omdat je ze dan bewust kunt gebruiken bij het selecteren","Omdat het wettelijk verplicht is ze in je dienstrapport op te schrijven","Dat is niet belangrijk"],"Vooroordelen beïnvloeden wie je opvalt en hoe je iemand inschat. Bewustwording helpt om objectief te blijven.",""],
["cult","Een burger begrijpt je slecht vanwege de taal. Wat is een goede aanpak?",["Korte, eenvoudige zinnen, controleren of je begrepen wordt en zo nodig een tolk","Harder en langzamer praten tot de burger het begrijpt","Het gesprek beëindigen en de burger doorsturen naar het loket","Een omstander laten vertalen bij een verhoor zonder dat vast te leggen"],"Bij een verhoor van een verdachte is een tolk een recht. Bij gewone gesprekken helpt eenvoudige taal.",""],
["cult","Welk artikel van de Grondwet verbiedt discriminatie?",["Artikel 1","Artikel 12","Artikel 16","Artikel 42"],"Allen die zich in Nederland bevinden, worden in gelijke gevallen gelijk behandeld.","art. 1 Gw"]

const Q5 = [
["wp","Wat verbiedt art. 70 lid 1 Wp2000?",["Zonder geldig vervoerbewijs het OV of de daarvoor aangewezen voorzieningen gebruiken","Roken in een station of in een vervoermiddel van de vervoerder","Het niet opvolgen van aanwijzingen van de vervoerder of van zijn personeel op het station","Het gebruik van een zonder bevoegdheid gewijzigd vervoerbewijs"],"Het verbod geldt ook voor voorzieningen zoals het gedeelte van een station achter de poortjes, als de vervoerder duidelijk heeft gemaakt dat je daar een geldig vervoerbewijs moet hebben.","art. 70 Wp2000"],
["wp","Welke gedraging valt onder art. 71 Wp2000?",["De controle van vervoerbewijzen belemmeren of verhinderen","Reizen zonder geldig vervoerbewijs in de trein, bus, tram of metro","Hinder veroorzaken met harde muziek in een vervoermiddel of station","Een station betreden dat voor reizigers gesloten is"],"Art. 71 verbiedt drie dingen: een zonder bevoegdheid gewijzigd vervoerbewijs gebruiken, een vervoerbewijs misbruiken en de controle van vervoerbewijzen belemmeren of verhinderen.","art. 71 Wp2000"],
["wp","Een reiziger gebruikt een OV-chipkaart op naam van zijn broer. Welk artikel overtreedt hij in ieder geval?",["Art. 71 Wp2000 (misbruik van een vervoerbewijs)","Art. 72 Wp2000 (verstoring van de orde)","Art. 73 Wp2000 (aanwijzingen niet opvolgen)","Art. 98 Wp2000 (ontzegging overtreden)"],"Een vervoerbewijs op naam is alleen geldig als het overeenstemt met de identiteit van de houder. Het gebruik door een ander is misbruik.","art. 71 Wp2000; art. 47 lid 2 Bp2000"],
["wp","Wat verbiedt art. 72 Wp2000?",["Gedrag in of bij het OV dat orde, rust, veiligheid of bedrijfsgang kan verstoren","Reizen zonder geldig vervoerbewijs of met een persoonlijk vervoerbewijs van een ander","Een vervoerbewijs misbruiken of zonder bevoegdheid wijzigen","Weigeren een identiteitsbewijs te tonen aan een controleur in de trein"],"Het gaat ook om gedrag waardoor de orde kan worden verstoord; daadwerkelijke verstoring is niet nodig. Art. 52 Bp2000 werkt uit wat eronder valt.","art. 72 Wp2000"],
["wp","Wat schrijft art. 73 Wp2000 voor?",["Duidelijk kenbaar gemaakte aanwijzingen van of namens de vervoerder opvolgen","De vervoerder moet elke reiziger met een geldig vervoerbewijs een zitplaats geven","Een reiziger moet altijd een geldig identiteitsbewijs bij zich hebben in het OV","De vervoerder moet elke aanwijzing vooraf schriftelijk bevestigen"],"Ook pictogrammen en teksten van de vervoerder gelden als aanwijzing (art. 53 Bp2000).","art. 73 Wp2000"],

["wp","Een zwartrijder van 13 jaar weigert zijn identiteitsbewijs te tonen na een vordering van de boa die de overtreding heeft vastgesteld. Wat is het gevolg?",["Het strafmaximum stijgt tot vier maanden hechtenis of een boete van de derde categorie","Er is geen gevolg, want de algemene toonplicht van art. 2 WID geldt pas vanaf 14 jaar","Hij pleegt wederspannigheid en kan worden aangehouden voor verhoor","Hij moet direct naar Halt, met toestemming van zijn ouders"],"Art. 92 Wp2000 verplicht reizigers onder de 14 jaar die in strijd met art. 70 of 71 handelen, op vordering een identiteitsbewijs te tonen. Wie dat niet doet, krijgt het verhoogde strafmaximum van art. 101 lid 2.","art. 92 en 101 lid 2 Wp2000"],
["wp","Wat mag een bevoegde ambtenaar doen als een reiziger handelt in strijd met de artikelen 70 tot en met 73 Wp2000?",["Zijn vervoerbewijs intrekken en hem het OV ontzeggen, zo nodig met geweld","Hem altijd aanhouden en laten insluiten op het politiebureau voor verhoor","Hem een gevangenisstraf of taakstraf opleggen ter plaatse","Alleen zijn naam noteren en een brief sturen aan de vervoerder"],"Dit is de bevoegdheid van art. 98 lid 1 Wp2000. Voor geweld moet de boa wel geweldsbevoegd zijn en de regels van proportionaliteit en subsidiariteit volgen.","art. 98 lid 1 Wp2000"],
["wp","Een man verstoort op het perron de orde maar heeft geen vervoerbewijs nodig, want hij reist niet. Wat kan de boa doen?",["Hem de toegang tot het station of de halte ontzeggen, zo nodig met geweld","Niets, want art. 98 Wp2000 geldt alleen voor reizigers in het voertuig zelf","Zijn vervoerbewijs intrekken","Hem een ov-verbod van een jaar opleggen"],"Art. 98 lid 2 Wp2000 maakt het mogelijk iemand die in strijd handelt met art. 72 of 73 de toegang tot een station, halte of andere voorziening te ontzeggen.","art. 98 lid 2 Wp2000"],
["wp","Iemand die uit de trein is gezet, stapt direct weer in. Wat pleegt hij?",["Handelen in strijd met een ontzegging (art. 98 lid 4 Wp2000)","Wederspannigheid tegen de conducteur (art. 180 Sr)","Huisvredebreuk in een besloten ruimte (art. 138 Sr)","Niets, de ontzegging gold alleen voor die ene rit"],"Het is verboden in strijd te handelen met een opgelegde ontzegging. Dit is strafbaar via art. 101 lid 1 Wp2000.","art. 98 lid 4 Wp2000"],
["wp","Wanneer mag een boa OV de handbagage van een reiziger controleren op grond van de Wp2000?",["Bij een vermoeden dat de reiziger art. 72 overtreedt, in zijn aanwezigheid","Altijd, ook zonder concrete reden, bij elke reguliere controle van vervoerbewijzen","Alleen met een machtiging van de officier van justitie","Alleen als de reiziger is aangehouden voor een misdrijf"],"Art. 98 lid 5 Wp2000 geeft deze bevoegdheid. Onbevoegd meegenomen handbagage, zoals gevaarlijke stoffen, mag ook uit het vervoermiddel worden verwijderd.","art. 98 lid 5 Wp2000"],
["wp","Wie zijn volgens art. 87 lid 3 Wp2000 mede belast met het toezicht op de artikelen 70 tot en met 74?",["Personen die door de vervoerder zijn aangewezen","Alleen ambtenaren van politie en de marechaussee","De burgemeester van de gemeente waar het station ligt","De Autoriteit Consument en Markt"],"Naast de door de minister en de concessieverlener aangewezen personen kan de vervoerder zelf toezichthouders aanwijzen, zoals conducteurs.","art. 87 Wp2000"],
["wp","Welke bevoegdheid uit de Awb hebben toezichthouders van art. 87 Wp2000 uitdrukkelijk NIET?",["Zaken onderzoeken, opnemen en monsters nemen (art. 5:18 Awb)","Het vorderen van een identiteitsbewijs van een persoon (art. 5:16a Awb)","Het betreden van plaatsen, met uitzondering van woningen (art. 5:15 Awb)","Het vorderen van medewerking (art. 5:20 Awb)"],"Art. 90 Wp2000 sluit art. 5:18 Awb uit voor deze toezichthouders.","art. 90 Wp2000"],
["wp","Wat mogen de ambtenaren en personen van art. 87 en 89 Wp2000 doen als iemand onvoldoende meewerkt?",["Zelf de nodige maatregelen treffen, zo nodig met de sterke arm","Een bestuurlijke boete opleggen aan de reiziger","De reiziger in verzekering stellen voor maximaal drie dagen","Niets, zij moeten in dat geval altijd de politie bellen"],"Art. 97 Wp2000 geeft deze bevoegdheid om maatregelen te treffen als medewerking uitblijft.","art. 97 Wp2000"],
["wp","Waarvan hangt af welke strafbare feiten een boa OV mag opsporen?",["Van zijn akte van opsporingsbevoegdheid en de domeinlijst voor domein IV","Van de wensen en het handhavingsbeleid van de vervoerder bij wie hij in dienst is","Van de dienstregeling en de lijnen waarop hij is ingeroosterd","Van het tijdstip van de dienst en de plek van het station"],"Een boa heeft een beperkte opsporingsbevoegdheid. De domeinlijst bij de Beleidsregels boa bepaalt welke wetten en feiten in domein IV horen.","art. 142 Sv; Beleidsregels boa"],
["bp","Wanneer moet een reiziger zich volgens het Bp2000 voorzien van een geldig elektronisch vervoerbewijs?",["Voordat hij het voertuig of het afgesloten deel van een station betreedt","Pas als de controleur of conducteur erom vraagt","Uiterlijk bij het uitstappen, door uit te checken op zijn eindbestemming","Binnen 14 dagen na de reis, via de website van de vervoerder"],"Alleen waar een functionaris of apparaat voor afgifte aanwezig is, mag dat zo spoedig mogelijk na het betreden.","art. 47 lid 1 Bp2000"],
["bp","Wanneer is een elektronisch vervoerbewijs NIET geldig?",["Als het is gewijzigd of anderszins bewerkt","Als het een nationaal vervoerbewijs op naam is","Als het vertrekpunt elektronisch is geregistreerd","Als het saldo voldoende is voor de reis"],"Geldig is het als het door de concessiehouder is uitgegeven, toereikend is voor de reis, het vertrekpunt is geregistreerd (ingecheckt), en een vervoerbewijs op naam bij de houder hoort.","art. 47 lid 2 en 3 Bp2000"],
["bp","Een reiziger is vergeten in te checken, maar heeft genoeg saldo op zijn kaart. Heeft hij een geldig vervoerbewijs?",["Nee, het vertrekpunt moet elektronisch zijn geregistreerd","Ja, het saldo op zijn kaart is ruim voldoende voor de rit","Ja, als hij een abonnement op zijn kaart heeft staan","Ja, als hij nog maar één halte heeft gereisd"],"Inchecken is een voorwaarde voor geldigheid.","art. 47 lid 2 Bp2000"],
["bp","Welk kind mag zonder vervoerbewijs met de bus, tram of metro reizen?",["Een kind jonger dan 4 jaar onder begeleiding, zonder eigen zitplaats","Elk kind jonger dan 12 jaar, met of zonder begeleiding","Een kind jonger dan 6 jaar, ook als het alleen reist","Geen enkel kind; ook baby's hebben een kaartje nodig"],"Art. 45 Bp2000 noemt drie uitzonderingen op het verbod van art. 70 Wp2000. Deze uitzondering voor jonge kinderen geldt niet voor vervoer per trein; daar gelden de voorwaarden van de vervoerder.","art. 45 lid 1 en art. 5 Bp2000"],
["bp","Wie mag nog meer zonder vervoerbewijs reizen volgens art. 45 Bp2000?",["Een begeleider van een gehandicapte reiziger (met legitimatie) en toezichthouders in dienst","Alle familieleden die met een gehandicapte reiziger meereizen, ongeacht hun leeftijd of aantal","Alle ambtenaren in uniform, ook buiten diensttijd en tijdens privéreizen","Iedereen ouder dan 65 jaar en kinderen tot 12 jaar"],"Ambtenaren en personen van art. 87 en 89 Wp2000 die toezicht houden of opsporen, hebben geen vervoerbewijs nodig.","art. 45 lid 1 Bp2000"],
["bp","Wat moet een reiziger betalen die geen geldig vervoerbewijs kan tonen?",["De vervoerprijs plus een wettelijk vastgesteld vast bedrag","Alleen een strafrechtelijke boete van de tweede categorie","Alleen de vervoerprijs voor het afgelegde traject","Niets, als hij belooft het later bij de balie te regelen"],"Dit volgt uit art. 48 lid 1 en 2 Bp2000. Het bedrag is een vast bedrag, geen strafrechtelijke geldboete.","art. 48 Bp2000"],
["bp","Hoeveel tijd krijgt een reiziger om te betalen als hij de vervoerprijs en het vaste bedrag niet direct betaalt?",["14 dagen; daarna nog eens 14 dagen met administratiekosten","3 dagen; daarna volgt direct een strafbeschikking","Een maand; daarna gaat de zaak naar de kantonrechter","8 dagen; daarna nog eens 8 dagen zonder extra kosten"],"Na de tweede termijn wordt de zaak meestal verder geïnd of strafrechtelijk afgehandeld.","art. 48 lid 5 en 6 Bp2000"],
["bp","Wat is het gevolg als de reiziger het bedrag van art. 48 Bp2000 tijdig betaalt?",["De strafvervolging wegens zwartrijden (art. 70 lid 1 Wp2000) vervalt","Hij krijgt automatisch een ov-verbod van drie maanden","Hij moet alsnog voor de kantonrechter verschijnen","Het bedrag wordt verdubbeld bij een volgende overtreding binnen een jaar"],"Betaling werkt als een soort afdoening: de strafzaak voor zwartrijden vervalt.","art. 48 lid 7 Bp2000"],
["bp","Wat ontvangt een reiziger bij intrekking van zijn vervoerbewijs?",["Een bewijs van intrekking","Een dagvaarding","Een nieuwe OV-chipkaart","Een kennisgeving van inbeslagneming"],"De ambtenaren van art. 87 en 89 Wp2000 geven bij intrekking een bewijs daarvan af.","art. 51 Bp2000"],
["bp","Een reiziger is zichtbaar dronken in de tram. Is dit een verstoring van orde, rust, veiligheid of goede bedrijfsgang?",["Ja, kennelijk dronken of onder invloed van drugs zijn valt daaronder","Nee, alleen als hij agressief wordt tegen medereizigers of het personeel","Nee, die regel geldt alleen in de trein en niet in de tram, bus of metro","Alleen als hij geen geldig vervoerbewijs heeft"],"Art. 52 lid 1 onder d Bp2000 noemt dit uitdrukkelijk.","art. 52 Bp2000; art. 72 Wp2000"],
["bp","Welke gedraging valt volgens art. 52 Bp2000 NIET zonder meer onder verstoring van orde, rust, veiligheid of goede bedrijfsgang?",["Zacht met een medereiziger praten","Bedelen in de trein","Vuurwerk afsteken op het perron","Een station betreden dat duidelijk gesloten is"],"Art. 52 noemt onder meer bedelen en collecteren, vuurwerk en hinderlijk geluid, en aanwezigheid in een gesloten station.","art. 52 Bp2000"],
["bp","Mag een straatartiest zonder toestemming van de vervoerder muziek maken voor geld in een metrostation?",["Nee, zonder toestemming diensten aanbieden is daar verboden","Ja, dat valt onder de vrijheid van meningsuiting","Ja, maar alleen buiten de spitsuren en niet op het perron zelf","Ja, als hij een vergunning van de gemeente heeft voor straatmuziek"],"Art. 52 lid 2 Bp2000: de verboden gelden niet als de vervoerder toestemming heeft gegeven.","art. 52 Bp2000"],
["bp","Een reiziger steekt een sigaret op in een overdekt deel van het station waar een rookverbod-pictogram hangt. Welk artikel is van toepassing?",["Art. 72 Wp2000 jo. art. 52 Bp2000","Art. 70 lid 1 Wp2000","Art. 71 Wp2000 jo. art. 45 Bp2000","Art. 461 Sr (verboden toegang)"],"Roken waar de vervoerder dat heeft verboden, is een verstoring in de zin van art. 52. Het pictogram is bovendien een aanwijzing (art. 53 Bp2000).","art. 52 Bp2000"],

["ovt","Een reiziger vraagt een boa OV om zijn legitimatie. Wat moet de boa doen?",["Zijn legitimatiebewijs direct tonen","Weigeren, want hij draagt een uniform","Alleen zijn dienstnummer noemen als hij dat wil","Eerst om het vervoerbewijs vragen"],"Een toezichthouder heeft een legitimatiebewijs bij zich en toont dat desgevraagd direct (art. 5:12 Awb, van toepassing via art. 91 Wp2000).","art. 5:12 Awb; art. 91 Wp2000"],

["ovt","Een reiziger zonder geldig vervoerbewijs weigert zijn naam te geven. Wat kan een boa OV doen?",["Hem staande houden, naar zijn identiteit vragen en een ID-bewijs vorderen","Hem direct in de boeien slaan en naar het bureau laten brengen","Hem laten gaan, want een verdachte hoeft niets te zeggen","Zijn tas doorzoeken op een identiteitsbewijs zonder verdere grond"],"Zwartrijden is een strafbaar feit, dus de reiziger is verdachte (art. 52 Sv). Weigert hij een identiteitsbewijs te tonen, dan pleegt hij een overtreding van art. 447e Sr. Bij een overtreding op heterdaad kan worden aangehouden als de identiteit niet kan worden vastgesteld.","art. 52 Sv; art. 447e Sr"],

["ovt","Een reiziger blijft na een rechtmatige ontzegging in de trein zitten en duwt de boa weg als die hem eruit begeleidt. Wat pleegt hij?",["Wederspannigheid, naast de overtreding van de ontzegging","Alleen een overtreding van art. 70 Wp2000 (zwartrijden)","Ambtsdwang tegen de boa (art. 179 Sr)","Opschudding bij een ambtenaar in functie"],"Verzet met geweld tegen een ambtenaar die rechtmatig zijn bevoegdheid uitoefent, is wederspannigheid (art. 180 Sr).","art. 180 Sr; art. 98 Wp2000"],
["ovt","Een boa OV vindt bij het staande houden van een zwartrijder een mes dat onder de Wet wapens en munitie valt. Mag hij het in beslag nemen?",["Ja, vatbare voorwerpen bij een staande gehouden verdachte mag hij in beslag nemen","Nee, de Wet wapens en munitie staat niet op de domeinlijst voor boa's in domein IV","Alleen na een bevel van de hulpofficier van justitie","Alleen als de reiziger daarvoor uitdrukkelijk toestemming geeft"],"Inbeslagneming bij een staande gehouden verdachte is een bevoegdheid van iedere opsporingsambtenaar (art. 95 Sv). Voor het verdere optreden tegen het wapenfeit schakelt de boa zo nodig de politie in.","art. 95 Sv"],
