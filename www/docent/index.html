["wvw", "Wat is volgens het RVV 1990 de rangorde van verkeersvoorschriften, van hoog naar laag?", ["Aanwijzingen van bevoegde personen, verkeerslichten, verkeerstekens, verkeersregels.", "Verkeersregels, verkeerstekens, verkeerslichten, aanwijzingen van bevoegde personen.", "Verkeerslichten, aanwijzingen van bevoegde personen, verkeersregels, verkeerstekens.", "Verkeerstekens, verkeerslichten, verkeersregels, aanwijzingen van bevoegde personen."], "Artikel 63 RVV 1990 bepaalt de rangorde: aanwijzingen van bevoegde personen gaan voor verkeerslichten, verkeerslichten gaan voor verkeerstekens, en verkeerstekens gaan voor de verkeersregels.", "art. 63 RVV 1990", "q1f3ogjo"],
["wvw", "Een automobilist negeert het stopteken van een boa die bevoegd is om aanwijzingen in het verkeer te geven. Welk voorschrift overtreedt hij?", ["Artikel 82 RVV 1990: weggebruikers moeten de aanwijzingen van bevoegde personen opvolgen.", "Artikel 24 RVV 1990: het parkeren binnen vijf meter van een kruispunt.", "Artikel 447e Sr: het niet tonen van een identiteitsbewijs op vordering.", "Artikel 2:1 APV: het deelnemen aan een samenscholing of ordeverstoring."], "Weggebruikers zijn verplicht de aanwijzingen op te volgen die bevoegde personen met gebaren of anders geven (artikel 82 RVV 1990). Een stopteken van een daartoe bevoegde boa is zo'n aanwijzing.", "art. 82 RVV 1990", "qeqg0gd"],
["bijz", "Een slijter verkoopt een fles wodka aan een jongen zonder naar zijn leeftijd te vragen. De jongen blijkt 17 jaar. Wat overtreedt de slijter?", ["Het verbod om alcohol te verstrekken zonder vast te stellen dat de koper 18 jaar of ouder is.", "Niets, want de jongen heeft zelf niets over zijn leeftijd gezegd en had dat moeten doen.", "Het verbod op wederverstrekking, omdat de jongen de fles vermoedelijk met vrienden deelt.", "Niets, want in een slijterij mag sterke drank vanaf 16 jaar aan klanten worden verkocht."], "Artikel 20 van de Alcoholwet verbiedt alcohol te verstrekken aan iemand van wie niet is vastgesteld dat hij 18 jaar of ouder is. De verkoper moet de leeftijd dus zelf vaststellen, bijvoorbeeld met een identiteitsbewijs.", "art. 20 Alcoholwet", "qtaelqg"],
["bijz", "Wat is volgens de Alcoholwet verboden voor een horecaondernemer?", ["Alcohol schenken aan iemand die kennelijk dronken is.", "Alcohol schenken aan een gast die niets te eten bestelt bij zijn drankje.", "Na middernacht alcohol schenken zonder toestemming van de politie.", "Een gast meer dan drie glazen bier binnen een uur te schenken."], "De Alcoholwet verbiedt alcohol te verstrekken aan iemand die in kennelijke staat van dronkenschap is. Ook mag de ondernemer zo iemand niet toelaten in zijn zaak.", "art. 20 Alcoholwet", "q1t0aavt"],
["bijz", "Welk bestuursorgaan is bij de Omgevingswet meestal bevoegd voor toezicht en handhaving op activiteiten in de gemeente?", ["Het college van burgemeester en wethouders.", "De burgemeester alleen, als hoofd van de openbare orde.", "De minister van Infrastructuur en Waterstaat.", "De officier van justitie van het arrondissement."], "Bij de Omgevingswet is het bestuursorgaan dat bevoegd is voor de vergunning, ook bevoegd voor toezicht en handhaving. Voor de meeste activiteiten in de gemeente, zoals de regels van het omgevingsplan, is dat het college van burgemeester en wethouders.", "art. 18.2 Omgevingswet", "q1q5zwqh"],
["bijz", "Van wie heeft een sportvisser toestemming nodig om in een binnenwater te mogen vissen?", ["Van de rechthebbende op het visrecht, zoals een hengelsportvereniging.", "Van de gemeente, via een visvergunning die het gemeentehuis afgeeft.", "Van de Rijksdienst voor het Wegverkeer, via een visakte op naam.", "Van niemand, want vissen met één hengel is in alle binnenwateren vrij."], "Voor vissen in binnenwateren is schriftelijke toestemming nodig van degene die het visrecht heeft, meestal een hengelsportvereniging of federatie. In de praktijk is dat de VISpas met de lijst van viswateren.", "art. 21 Visserijwet 1963", "qz1ecuq"],
["bijz", "Een sportvisser kan bij een controle zijn schriftelijke toestemming niet laten zien. Wat geldt?", ["Hij overtreedt de Visserijwet: wie vist, moet de toestemming bij zich hebben en op verzoek tonen.", "Niets, als hij de toestemming binnen een week alsnog laat zien op het politiebureau.", "Niets, want de Visserijwet geldt alleen voor beroepsvissers met een boot en netten.", "Hij overtreedt alleen iets als hij op dat moment al een vis heeft gevangen."], "Wie vist, moet de schriftelijke toestemming bij zich hebben en die op eerste vordering laten zien aan een opsporingsambtenaar. Kan hij dat niet, dan overtreedt hij de Visserijwet 1963.", "art. 21 en 23 Visserijwet 1963", "q1b2yx3j"],
["bijz", "Een ondernemer laat zijn bedrijfsafval ophalen door een buurman met een aanhanger, die geen erkende inzamelaar is. Wat geldt?", ["De ondernemer overtreedt het verbod om bedrijfsafval af te geven aan iemand die daar niet toe bevoegd is.", "Alleen de buurman is strafbaar, omdat de ondernemer zijn afval netjes heeft laten ophalen.", "Niets, zolang de buurman het afval daarna zelf naar een milieustraat van de gemeente brengt.", "Niets, want de Wet milieubeheer geldt alleen voor gevaarlijk afval, zoals chemicaliën en olie."], "Wie zich van bedrijfsafval ontdoet, mag dat alleen afgeven aan iemand die daarvoor bevoegd is, zoals een erkende inzamelaar of verwerker. Geeft de ondernemer het af aan een ander, dan overtreedt hij artikel 10.37 van de Wet milieubeheer.", "art. 10.37 Wm", "qrg0r4"],
["bijz", "Op welk afval ziet het verbod van artikel 10.2 Wet milieubeheer (storten, op of in de bodem brengen of verbranden) sinds 1 januari 2024?", ["Huishoudelijk afval dat niet is afgegeven of ingezameld.", "Bedrijfsafval en gevaarlijk afval, ook als het is ingezameld.", "Alleen grofvuil dat groter is dan een gewone vuilniszak.", "Alleen afval dat in een natuurgebied of in het water belandt."], "Sinds de Omgevingswet (1 januari 2024) geldt het verbod van artikel 10.2 Wm alleen nog voor huishoudelijke afvalstoffen die niet zijn afgegeven of ingezameld. Je mag je daarvan niet ontdoen door ze te storten, op of in de bodem te brengen of te verbranden. Voor bedrijfsafval en gevaarlijk afval gelden nu de regels van het Besluit activiteiten leefomgeving (Bal).", "art. 10.2 Wm", "qju4vhp"],
["vrij", "Wie mag een verdachte aanhouden bij ontdekking op heterdaad?", ["Iedereen, dus ook een burger zonder opsporingsbevoegdheid.", "Alleen opsporingsambtenaren, zoals politieagenten en boa's.", "Alleen de officier van justitie of een hulpofficier van justitie.", "Alleen een boa met geweldsbevoegdheid en handboeien."], "Bij ontdekking op heterdaad is ieder bevoegd de verdachte aan te houden (artikel 53 Sv). Een burger moet de verdachte daarna wel direct overdragen aan een opsporingsambtenaar.", "art. 53 Sv", "q10m6npf"],
["vrij", "Aan wie moet een boa een aangehouden verdachte voorgeleiden?", ["Aan de officier van justitie of een hulpofficier van justitie.", "Aan de rechter-commissaris bij de rechtbank in het arrondissement.", "Aan de korpschef van de politie of diens plaatsvervanger.", "Aan de burgemeester van de gemeente waar hij is aangehouden."], "Een opsporingsambtenaar die een verdachte aanhoudt, geleidt hem onverwijld voor aan de officier van justitie of een hulpofficier van justitie. In de praktijk is dat meestal een hulpofficier van justitie op het politiebureau.", "art. 53 lid 3 en 54 Sv", "q972zm0"],
["vrij", "Hoe snel moet een aangehouden verdachte worden voorgeleid?", ["Onverwijld, dus zonder onnodige vertraging.", "Binnen drie dagen na de aanhouding, als het om een misdrijf gaat.", "Pas nadat de boa de verdachte zelf heeft verhoord over het feit.", "Binnen 24 uur, waarbij de nachtelijke uren niet worden meegeteld."], "De wet schrijft voor dat een aangehouden verdachte onverwijld wordt voorgeleid, zodat de officier of hulpofficier van justitie meteen kan toetsen of de aanhouding terecht is en wat er verder gebeurt.", "art. 53 lid 3 en 54 Sv", "q7xg7n7"],
["amb", "Je wordt als boa tijdens je werk bedreigd en doet aangifte. Welk adres mag je op de aangifte laten zetten?", ["Het adres van je werkgever, zodat de verdachte je huisadres niet te zien krijgt.", "Alleen je eigen huisadres, omdat een aangifte anders niet geldig is.", "Het adres van de rechtbank waar de zaak later wordt behandeld.", "Geen adres, want een aangifte van een boa is altijd anoniem."], "Werknemers met een publieke taak, zoals boa's, mogen bij een aangifte domicilie kiezen op het adres van hun werkgever. Zo komt hun huisadres niet in het dossier dat de verdachte kan inzien.", "Eenduidige Landelijke Afspraken (ELA); art. 163 Sv", "q1cy8eff"],
["amb", "Wat is volgens de Eenduidige Landelijke Afspraken het uitgangspunt bij de strafeis voor bedreiging of geweld tegen een boa?", ["Het openbaar ministerie eist een zwaardere straf dan bij hetzelfde feit tegen een gewone burger.", "Het openbaar ministerie seponeert de zaak als de boa geen zichtbaar letsel heeft opgelopen.", "Het openbaar ministerie eist dezelfde straf, omdat een boa wettelijk geen ambtenaar is.", "Het openbaar ministerie behandelt de zaak alleen als ook de werkgever aangifte doet."], "Volgens de Eenduidige Landelijke Afspraken van politie en openbaar ministerie krijgen zaken van agressie en geweld tegen werknemers met een publieke taak voorrang, en eist het openbaar ministerie een hogere straf dan bij hetzelfde feit tegen een gewone burger.", "Eenduidige Landelijke Afspraken (ELA); Aanwijzing kader voor strafvordering", "q1lpvl25"]
];
const Q8 = [
["spw", "Wat verstaan we volgens artikel 1 Spoorwegwet onder een spoorweg?", ["Een weg die bestemd is voor verkeer over spoorstaven of geleiderails.", "Een weg die bij koninklijk besluit is aangewezen als hoofdspoorweg.", "Een weg voor treinen die eigendom is van ProRail of de rijksoverheid.", "Een weg voor tram, metro en trein binnen de bebouwde kom."], "De Spoorwegwet omschrijft een spoorweg functioneel: een weg voor verkeer over spoorstaven of geleiderails. Ook nieuwe vormen van geleid verkeer vallen eronder.", "art. 1 Spoorwegwet", "qn8s01"],
["spw", "Wie is volgens artikel 1 Spoorwegwet een rechthebbende op een spoorweg?", ["De eigenaar, de bezitter of iemand met bijvoorbeeld een recht van erfpacht, huur of pacht.", "Alleen de vervoerder die van de minister de concessie voor het vervoer over die spoorweg heeft gekregen.", "Iedere reiziger met een geldig vervoerbewijs voor een trein op die spoorweg.", "Alleen de minister die verantwoordelijk is voor het spoor."], "Rechthebbende is een privaatrechtelijk begrip: de eigenaar of iemand met een ander recht op de grond, zoals erfpacht, opstal, vruchtgebruik, huur of pacht.", "art. 1 Spoorwegwet", "qn8s02"],
["spw", "Op welk artikel van de Wegenverkeerswet 1994 lijkt artikel 3 Spoorwegwet sterk?", ["Artikel 5 Wegenverkeerswet 1994, het verbod op gevaar of hinder op de weg.", "Artikel 6 Wegenverkeerswet 1994, het veroorzaken van een ernstig ongeval.", "Artikel 7 Wegenverkeerswet 1994, doorrijden na een ongeval.", "Artikel 8 Wegenverkeerswet 1994, rijden onder invloed."], "Artikel 3 Spoorwegwet is bewust gebaseerd op artikel 5 Wegenverkeerswet 1994: je mag je niet zo gedragen dat gevaar ontstaat of het verkeer wordt gehinderd.", "art. 3 Spoorwegwet", "qn8s03"],
["spw", "Iemand veroorzaakt door onoplettendheid gevaar voor het spoorverkeer, waardoor een trein een noodstop moet maken. Welk artikel uit het Wetboek van Strafrecht kan van toepassing zijn?", ["Artikel 165 Sr, het door schuld veroorzaken van gevaar voor het spoorverkeer.", "Artikel 164 Sr, het opzettelijk veroorzaken van gevaar voor het spoorverkeer.", "Artikel 351 Sr, het vernielen of beschadigen van spoorwegwerken.", "Artikel 350 Sr, het vernielen of beschadigen van andermans goed."], "Bij schuld (onoplettendheid) gaat het om artikel 165 Sr. Artikel 164 Sr vereist opzet en artikel 351 Sr gaat over het vernielen van spoorwegwerken. Artikel 3 Spoorwegwet laat deze misdrijven onverlet.", "art. 165 Sr; Spoorwegwet", "qn8s04"],
["spw", "Welk artikel uit het Wetboek van Strafrecht stelt het opzettelijk vernielen of beschadigen van spoorwegwerken strafbaar?", ["Artikel 351 Sr.", "Artikel 164 Sr.", "Artikel 350 Sr.", "Artikel 141 Sr."], "Artikel 351 Sr gaat over het vernielen of beschadigen van werken voor het verkeer, zoals spoorwegwerken. Artikel 350 Sr is de gewone vernieling van andermans goed.", "art. 351 Sr; Spoorwegwet", "qn8s05"],
["spw", "Voor wie geldt het verbod van artikel 3 Spoorwegwet?", ["Voor iedereen, dus ook voor iemand die niet met de trein reist.", "Alleen voor reizigers met een vervoerbewijs voor de trein.", "Alleen voor personeel van de vervoerder en de infrabeheerder.", "Alleen voor bestuurders van voertuigen die het spoor kruisen."], "Artikel 3 Spoorwegwet richt zich tot 'een ieder'. Ook omstanders, spelende kinderen of iemand die over het spoor loopt, kunnen het verbod overtreden.", "art. 3 Spoorwegwet", "qn8s06"],
["spw", "Iemand opent een kast langs de tramlijn en verzet een wissel. Welk verbod uit artikel 15 lid 1 Wet lokaal spoor overtreedt hij?", ["Ingrijpen in de bediening of werking van installaties van de lokale spoorweginfrastructuur (sub a).", "Het verwijderen, beschadigen of wijzigen van de lokale spoorweginfrastructuur (sub b).", "Het verwijderen, beschadigen of wijzigen van onderdelen van de lokale spoorweginfrastructuur (sub b).", "Zich zo gedragen dat het verkeer over de lokale spoorweg wordt gehinderd (sub d)."], "Het bedienen van een wissel is ingrijpen in de bediening of werking van installaties (sub a). Sub b gaat over het verwijderen, beschadigen of wijzigen van de infrastructuur zelf.", "art. 15 Wet lokaal spoor", "qn8s07"],
["spw", "Een jongen schroeft bevestigingsmaterialen los van een metrorail. Welk verbod uit artikel 15 lid 1 Wet lokaal spoor overtreedt hij in de eerste plaats?", ["Het verwijderen, beschadigen of wijzigen van de lokale spoorweginfrastructuur (sub b).", "Ingrijpen in de bediening of werking van installaties van de lokale spoorweginfrastructuur (sub a).", "Zich bevinden op of langs een voor personen afgesloten lokale spoorweg (sub c).", "Het laten lopen van dieren langs een afgesloten lokale spoorweg (sub c)."], "Losschroeven van onderdelen is het verwijderen of beschadigen van de infrastructuur (sub b). Bevindt hij zich daarbij op een afgesloten baan, dan overtreedt hij ook sub c.", "art. 15 Wet lokaal spoor", "qn8s08"],
["spw", "Een hondenbezitter laat zijn hond lopen op het grasveld langs een afgesloten metrobaan. Wat geldt volgens artikel 15 lid 1 Wet lokaal spoor?", ["Het is verboden om dieren te laten lopen op of langs een voor personen afgesloten lokale spoorweg.", "Het mag, zolang de hond aangelijnd is en de eigenaar zelf buiten het hek naast de afgesloten baan blijft.", "Het mag, want het verbod geldt alleen voor personen en niet voor dieren.", "Het is alleen verboden als er op dat moment een metro aankomt."], "Artikel 15 lid 1 sub c Wet lokaal spoor verbiedt niet alleen zelf op of langs een afgesloten lokale spoorweg te zijn, maar ook daar dieren te drijven of te laten lopen.", "art. 15 Wet lokaal spoor", "qn8s09"],
["spw", "Een man gaat na een ruzie op de tramrails staan en weigert opzij te gaan, zodat de tram niet verder kan. Welk verbod uit artikel 15 lid 1 Wet lokaal spoor overtreedt hij?", ["Zich zo gedragen dat het verkeer over de lokale spoorweg wordt gehinderd (sub d).", "Ingrijpen in de bediening of werking van installaties van de lokale spoorweginfrastructuur (sub a).", "Het verwijderen, beschadigen of wijzigen van de lokale spoorweginfrastructuur (sub b).", "Zich bevinden op een voor personen afgesloten lokale spoorweg (sub c)."], "Door op de rails te blijven staan hindert hij het verkeer over de lokale spoorweg (sub d). Een tramlijn op straat is meestal niet voor personen afgesloten, dus sub c past hier niet.", "art. 15 Wet lokaal spoor", "qn8s10"],
["spw", "Een monteur van het vervoerbedrijf loopt tijdens zijn werk over een afgesloten metrobaan. Overtreedt hij artikel 15 Wet lokaal spoor?", ["Nee, het verbod geldt niet voor handelingen bij de rechtmatige uitoefening van beheer, vervoer of toezicht.", "Ja, het verbod geldt voor iedereen zonder uitzondering, ook voor personeel.", "Ja, tenzij hij vooraf schriftelijk toestemming heeft gekregen van de burgemeester van de gemeente waar de baan ligt.", "Nee, maar alleen als hij een hesje draagt en de metro stilstaat."], "Artikel 15 lid 2 Wet lokaal spoor maakt een uitzondering voor handelingen in het kader van de rechtmatige uitoefening van het beheer, het vervoer of het toezicht.", "art. 15 Wet lokaal spoor", "qn8s11"],
["gem", "Welk orgaan stelt de algemene plaatselijke verordening (APV) vast?", ["De gemeenteraad.", "De burgemeester.", "Het college van burgemeester en wethouders.", "Gedeputeerde Staten van de provincie."], "De gemeenteraad maakt de verordeningen die hij in het belang van de gemeente nodig oordeelt, zoals de APV.", "art. 149 Gemeentewet", "qn8g01"],
["gem", "Welk orgaan is volgens artikel 125 Gemeentewet in de regel bevoegd tot het opleggen van een last onder bestuursdwang?", ["Het college van burgemeester en wethouders.", "De gemeenteraad.", "De officier van justitie in het arrondissement.", "De commissaris van de Koning."], "Volgens artikel 125 Gemeentewet is het college bevoegd tot bestuursdwang. De burgemeester is bevoegd als het gaat om regels die hij zelf uitvoert, zoals bij de openbare orde.", "art. 125 Gemeentewet", "qn8g02"],
["gem", "Welke bevoegdheid geeft artikel 175 Gemeentewet de burgemeester?", ["Bij oproerige beweging, ernstige wanorde of rampen de bevelen geven die nodig zijn om de orde te handhaven.", "Een verordening vaststellen die direct geldt zonder bekrachtiging door de raad.", "Een gebiedsverbod, groepsverbod of meldplicht opleggen aan iemand die herhaaldelijk de openbare orde verstoort.", "Een woning sluiten waar drugs worden verkocht."], "Artikel 175 Gemeentewet geeft de burgemeester de bevoegdheid tot een noodbevel. Een noodverordening staat in artikel 176, een gebiedsverbod in artikel 172a en woningsluiting in artikel 13b Opiumwet.", "art. 175 Gemeentewet", "qn8g03"],
["gem", "Wat kan de burgemeester volgens artikel 172a Gemeentewet opleggen aan iemand die herhaaldelijk de openbare orde verstoort?", ["Een gebiedsverbod, een meldplicht of een groepsverbod.", "Een taakstraf van maximaal twintig uur.", "Een bestuurlijke strafbeschikking met een geldboete.", "Een inreisverbod voor alle gemeenten in de regio."], "Met artikel 172a Gemeentewet kan de burgemeester bij herhaalde verstoring van de openbare orde een gebiedsverbod, groepsverbod of meldplicht opleggen.", "art. 172a Gemeentewet", "qn8g04"],
["gem", "Waarop houdt de burgemeester volgens artikel 174 Gemeentewet toezicht?", ["Op openbare samenkomsten en vermakelijkheden en op gebouwen die voor het publiek openstaan.", "Op de bouw van nieuwe woningen, bedrijfsgebouwen en wegen binnen de grenzen van de gemeente.", "Op het werk van de officier van justitie en de politie in de gemeente.", "Op de begroting en de uitgaven van de gemeente."], "Artikel 174 Gemeentewet geeft de burgemeester het toezicht op openbare samenkomsten, vermakelijkheden en voor het publiek openstaande gebouwen, zoals horeca.", "art. 174 Gemeentewet", "qn8g05"],
["gem", "Welke organisatie is het advies- en meldpunt voor huiselijk geweld en kindermishandeling?", ["Veilig Thuis.", "Slachtofferhulp Nederland.", "De Raad voor de Kinderbescherming.", "Het Centrum voor Jeugd en Gezin."], "Veilig Thuis is het advies- en meldpunt voor huiselijk geweld en kindermishandeling. Iedere gemeente moet zo'n meldpunt hebben.", "Wet maatschappelijke ondersteuning 2015 (Veilig Thuis)", "qn8g06"],
["gem", "Je wordt gebeld over een man die verward over straat loopt. Er is geen strafbaar feit en geen direct gevaar. Met welke partner neem je in de regel contact op?", ["Het meldpunt zorg en overlast van de gemeente of de GGD.", "De officier van justitie voor een strafrechtelijk onderzoek.", "Het Openbaar Ministerie voor een gedwongen opname.", "De rechter-commissaris voor een bevel tot bewaring."], "Bij verward gedrag zonder strafbaar feit en zonder direct gevaar schakel je de zorgketen in, zoals het meldpunt zorg en overlast of de GGD. Bij direct gevaar bel je de meldkamer.", "Toetsmatrijs Domein I, toetsterm 1.3.2", "qn8g07"],
["gem", "Wat is een Zorg- en Veiligheidshuis?", ["Een samenwerkingsverband van zorg-, straf- en bestuurspartners voor complexe problemen rond personen.", "Een opvang voor slachtoffers van huiselijk geweld en hun kinderen.", "Een gebouw waar de politie, de boa's en de toezichthouders van de gemeente samen hun dienst beginnen en eindigen.", "Een gevangenis voor jongeren met een zorgmaatregel."], "In een Zorg- en Veiligheidshuis werken gemeenten, politie, justitie en zorgpartners samen aan complexe casussen waarin zorg en veiligheid samenkomen.", "Toetsmatrijs Domein I, toetsterm 1.3.2", "qn8g08"],
["prof", "Wat verstaan we onder integriteit van een boa?", ["Handelen volgens de normen en waarden van je beroep, ook als niemand meekijkt.", "Alle regels zo streng mogelijk toepassen, zonder rekening te houden met de situatie.", "Je eigen mening geven over de regels die je moet handhaven.", "Alleen optreden als je leidinggevende daar opdracht voor geeft."], "Integer handelen betekent eerlijk en betrouwbaar werken volgens de normen van je beroep en je werkgever, ook als niemand toekijkt.", "Beroepshouding: integriteit", "qn8p01"],
["prof", "Een ondernemer biedt je na een controle gratis koffie met gebak aan 'voor de moeite'. Wat doe je?", ["Je slaat het beleefd af en volgt de regels van je werkgever over giften.", "Je neemt het aan, want weigeren is onbeleefd tegenover een ondernemer.", "Je neemt het aan als de waarde onder de tien euro blijft.", "Je neemt het aan en meldt het achteraf aan je collega's."], "Giften kunnen de schijn van partijdigheid wekken. Je slaat het beleefd af en houdt je aan de gedragscode van je werkgever over geschenken.", "Beroepshouding: integriteit", "qn8p02"],
["prof", "Je merkt dat een collega bij controles regelmatig bekenden laat gaan. Wat doe je?", ["Je spreekt hem erop aan en meldt het zo nodig bij je leidinggevende of een vertrouwenspersoon.", "Je zegt niets, want het is niet jouw taak om collega's te controleren.", "Je meldt het eerst bij de pers en de gemeenteraad, zodat het probleem snel openbaar wordt besproken.", "Je doet hetzelfde bij je eigen bekenden, zodat het eerlijk is."], "Integriteit is ook een zaak van het team. Eerst aanspreken; helpt dat niet of is het ernstig, dan meld je het bij je leidinggevende of de vertrouwenspersoon integriteit.", "Beroepshouding: integriteit", "qn8p03"],
["prof", "Mag je als boa op sociale media iets plaatsen over een incident uit je dienst?", ["Alleen binnen de regels van je werkgever en zonder persoonsgegevens of vertrouwelijke informatie.", "Ja, zolang je het bericht op je eigen privéaccount plaatst, buiten diensttijd en niet in uniform.", "Ja, zolang je het incident pas na een week plaatst.", "Ja, als je de namen van betrokkenen alleen afkort."], "Berichten over je werk kunnen persoonsgegevens en vertrouwelijke informatie bevatten en het vertrouwen schaden. Volg het socialemediabeleid van je werkgever.", "Beroepshouding: sociale media", "qn8p04"],
["prof", "Wat is het doel van intervisie?", ["Met collega's leren van werksituaties door vragen te stellen en samen te reflecteren.", "Een beoordeling door je leidinggevende over je functioneren van het afgelopen jaar.", "Een training waarin je nieuwe wetten en bevoegdheden leert.", "Een gesprek met een burger die een klacht over je heeft ingediend."], "Bij intervisie bespreek je met collega's situaties uit je werk. Door vragen en reflectie leer je van elkaar, zonder dat er een oordeel wordt gegeven.", "Beroepshouding: reflectie en intervisie", "qn8p05"],
["prof", "Je ontdekt dat je een fout hebt gemaakt in een bekeuring die je gisteren schreef. Wat getuigt van een professionele houding?", ["De fout erkennen, melden en laten herstellen volgens de werkwijze van je organisatie.", "Niets doen, want de betrokkene kan zelf bezwaar maken als hij de fout ontdekt in de bekeuring.", "De bekeuring zelf vernietigen, zodat niemand de fout ontdekt.", "De betrokkene bellen en zeggen dat hij de boete niet hoeft te betalen."], "Professioneel handelen betekent fouten erkennen en via de juiste weg laten herstellen. Zelf iets vernietigen of iemand iets beloven valt buiten je bevoegdheid.", "Beroepshouding: integriteit", "qn8p06"],
["waa", "Met welke zintuigen neem je waar?", ["Met al je zintuigen: zien, horen, ruiken, voelen en proeven.", "Alleen met zien en horen, want alleen die tellen in een verslag.", "Alleen met zien, want dat is het betrouwbaarste zintuig.", "Met zien, horen en ruiken, want voelen en proeven zijn geen waarneming."], "Waarnemen doe je met al je zintuigen. Ook een geur (alcohol, brandlucht) of iets wat je voelde kan een belangrijke waarneming zijn.", "Waarnemen: zintuigen", "qn8w01"],
["waa", "Wat verstaan we onder selectieve waarneming?", ["Je neemt vooral waar wat je verwacht of wat je aandacht trekt, en mist de rest.", "Je kiest bewust welke waarnemingen je in het verslag zet en welke niet.", "Je neemt alleen waar wat in je opdracht van de meldkamer stond.", "Je laat waarnemingen weg die niet in het voordeel van de verdachte zijn."], "Je hersenen filteren informatie. Je ziet sneller wat je verwacht of wat opvalt en mist andere details. Daarom is bewust en systematisch waarnemen belangrijk.", "Waarnemen: factoren die waarneming beïnvloeden", "qn8w02"],
["waa", "Wat verstaan we onder een signalement?", ["Een beschrijving van de uiterlijke kenmerken van een persoon.", "Een opsporingsbericht van de politie op televisie of internet.", "Een melding van de meldkamer met een opdracht voor de boa.", "Een lijst van personen die bekend zijn bij de politie."], "Een signalement beschrijft hoe iemand eruitziet: onder meer geslacht, geschatte leeftijd, lengte, postuur, haar, kleding en opvallende kenmerken.", "Waarnemen: signalement", "qn8w03"],
["waa", "Welke kenmerken zijn in een signalement het nuttigst om iemand later terug te vinden?", ["Kenmerken die niet snel veranderen, zoals lengte, postuur, littekens en tatoeages.", "De kleur en het merk van de jas en de schoenen, omdat die het meest opvallen bij een signalement.", "De merknaam van de schoenen en de tas.", "De stemming van de persoon, zoals boos of vrolijk."], "Kleding kan snel worden gewisseld. Kenmerken die blijven, zoals lengte, postuur, littekens en tatoeages, helpen het meest om iemand later te herkennen.", "Waarnemen: signalement", "qn8w04"],
["waa", "Je weet niet precies hoe lang een verdachte is. Hoe vermeld je zijn lengte in je verslag?", ["Als schatting met een marge, bijvoorbeeld ongeveer 1,80 tot 1,85 meter.", "Je laat de lengte weg, omdat je die niet hebt gemeten.", "Je noemt een precieze lengte, zodat het verslag betrouwbaarder lijkt.", "Je schrijft 'gemiddelde lengte', zodat iedereen weet wat bedoeld wordt."], "Een geschatte lengte met marge is bruikbaar en eerlijk. 'Gemiddeld' zegt weinig en een precieze lengte die je niet weet, is onjuist.", "Waarnemen: signalement", "qn8w05"],
["waa", "Wat beschrijf je bij een voertuig in je verslag?", ["Soort, merk, type, kleur, kenteken en bijzonderheden zoals schade of stickers.", "Alleen het kenteken, want daarmee is het voertuig altijd terug te vinden.", "Alleen het merk en de kleur, want het kenteken is privé.", "Alleen of het voertuig snel of langzaam reed."], "Het kenteken is belangrijk, maar kan vals zijn of verwisseld worden. Daarom beschrijf je ook soort, merk, type, kleur en opvallende kenmerken.", "Waarnemen: specificaties", "qn8w06"],
["waa", "Wat beschrijf je in de aanvangssituatie van een waarnemingsverslag?", ["De situatie voordat het voorval begint: plaats, tijd, aanwezigen en omstandigheden.", "Wat de verdachte na afloop tegen je zei over zijn motief en over de aanleiding van het voorval.", "Je eigen mening over wie er schuldig is aan het voorval.", "De straf die volgens jou bij het voorval past."], "De aanvangssituatie schetst de beginsituatie: waar en wanneer, wie er aanwezig waren en onder welke omstandigheden, zoals licht en drukte.", "Rubric Waarneming en verslaglegging (ExTH)", "qn8w07"],
["waa", "Een omstander vertelt je wie volgens hem de dader is. Hoe vermeld je dat in je verslag?", ["Als verklaring van de omstander, met zijn gegevens, apart van je eigen waarneming.", "Als je eigen waarneming, omdat de omstander betrouwbaar overkomt.", "Je vermeldt het niet, want alleen je eigen waarnemingen tellen.", "Je vermeldt het als jouw eigen waarneming, zonder te zeggen van wie de informatie afkomstig is."], "Informatie van een ander is horen zeggen. Je vermeldt van wie je het hebt en houdt het gescheiden van wat je zelf zag of hoorde.", "Waarnemen: eigen waarneming en horen zeggen", "qn8w08"],
["waa", "Wat is een veelvoorkomend effect van stress op je waarneming?", ["Tunnelvisie: je aandacht richt zich op een klein deel en je mist details.", "Je ziet en hoort scherper, waardoor je meer details onthoudt.", "Je onthoudt de volgorde van gebeurtenissen juist beter.", "Stress heeft bij getrainde boa's geen invloed op de waarneming."], "Onder stress vernauwt je aandacht zich. Je mist details en kunt de volgorde of duur van gebeurtenissen verkeerd inschatten.", "Waarnemen: factoren die waarneming beïnvloeden", "qn8w09"],
["waa", "Wat verstaan we onder het 'wapenfocus'-effect?", ["Een wapen trekt zo veel aandacht dat je andere details, zoals het gezicht van de dader, slechter onthoudt.", "Je ziet een gewoon voorwerp, zoals een telefoon of een sleutelbos, sneller aan voor een wapen als je gespannen bent.", "Je onthoudt het type wapen slecht omdat je er niet naar durft te kijken.", "Een getuige noemt achteraf vaak een wapen dat er niet was."], "Bij wapenfocus richt de aandacht zich op het wapen. Daardoor worden andere kenmerken, zoals het gezicht en de kleding van de dader, minder goed onthouden.", "Waarnemen: factoren die waarneming beïnvloeden", "qn8w10"],
["waa", "Waarom maak je zo snel mogelijk aantekeningen van een voorval?", ["Het geheugen vervaagt snel en details raken vermengd met latere informatie.", "Omdat aantekeningen na een uur niet meer als bewijs mogen worden gebruikt.", "Omdat de verdachte recht heeft op een kopie van je aantekeningen.", "Omdat je anders het voorval niet mag melden bij de meldkamer."], "Herinneringen veranderen snel, bijvoorbeeld door gesprekken met anderen. Directe aantekeningen leggen vast wat je echt hebt waargenomen.", "Waarnemen: aantekeningen maken", "qn8w11"],
["waa", "Wat verstaan we onder het halo-effect bij waarnemen?", ["Eén opvallende eigenschap kleurt je oordeel over de hele persoon.", "Licht van bijvoorbeeld een lantaarnpaal maakt kleuren onbetrouwbaar.", "Je onthoudt het begin en het eind van een voorval het best.", "Je neemt in een groep meer waar dan wanneer je alleen bent."], "Bij het halo-effect beïnvloedt één eigenschap, bijvoorbeeld een net pak of een tatoeage, je hele beeld van iemand. Dat kan je waarneming en oordeel vertekenen.", "Waarnemen: factoren die waarneming beïnvloeden", "qn8w12"],
["waa", "In welke volgorde beschrijf je de gebeurtenissen in een waarnemingsverslag?", ["Chronologisch, in de volgorde waarin ze gebeurden.", "Van het belangrijkste naar het minst belangrijke feit.", "Eerst de gevolgen, daarna de oorzaken.", "In de volgorde waarin je ze je herinnert."], "Een chronologische opbouw maakt het verslag logisch en controleerbaar voor de lezer.", "Waarnemen: verslaglegging", "qn8w13"],
["waa", "Wat beschrijf je bij de specificaties in een waarnemingsverslag?", ["Gedetailleerde kenmerken van personen, voertuigen en voorwerpen, zoals signalementen.", "De wetsartikelen die volgens jou zijn overtreden en de sanctie die daar volgens jou bij hoort.", "Je eigen naam, functie en dienstnummer.", "De tijd die je nodig had om het verslag te schrijven."], "Specificaties zijn de details die de lezer nodig heeft om personen, voertuigen en voorwerpen te herkennen, zoals signalementen, kentekens en kleuren.", "Rubric Waarneming en verslaglegging (ExTH)", "qn8w14"],
["waa", "Een man rent na een ruzie weg. Welke zin beschrijft dit objectief?", ["'De man rende weg in de richting van het station.'", "'De man vluchtte omdat hij wist dat hij schuldig was.'", "'De man was bang en zette het op een lopen.'", "'De man probeerde aan zijn straf te ontkomen.'"], "Een objectieve beschrijving geeft alleen wat je zag: wie, wat en waarheen. Over schuld, angst of motief kun je zonder meer informatie niets zeggen.", "Waarnemen: feit en interpretatie", "qn8w15"],
["pv", "Wat verstaan we onder een proces-verbaal?", ["Een schriftelijk verslag van een opsporingsambtenaar over wat hij zelf heeft waargenomen of gedaan.", "Een brief van de officier van justitie aan de verdachte waarin staat welke straf of maatregel hij krijgt.", "Een verklaring die de verdachte zelf schrijft en ondertekent.", "Een formulier waarmee een burger een klacht indient over een ambtenaar."], "Een proces-verbaal is het verslag van een opsporingsambtenaar over wat hij heeft waargenomen of verricht. Het wordt opgemaakt op ambtseed of ambtsbelofte.", "art. 152 Sv; art. 153 Sv", "qn8v01"],
["pv", "Wanneer moet je volgens artikel 152 Sv een proces-verbaal opmaken?", ["Zo spoedig mogelijk.", "Binnen zeven dagen.", "Binnen 24 uur.", "Aan het eind van de maand."], "Artikel 152 Sv bepaalt dat de opsporingsambtenaar zo spoedig mogelijk een proces-verbaal opmaakt van het strafbare feit of van wat hij heeft gedaan of bevonden.", "art. 152 Sv", "qn8v02"],
["pv", "Wat leg je vast in een proces-verbaal van aangifte?", ["De verklaring van iemand die aangifte doet van een strafbaar feit.", "De verklaring van de verdachte na zijn aanhouding.", "Je eigen bevindingen bij een surveillance.", "Het besluit van de officier van justitie om te vervolgen."], "Bij een aangifte leg je de verklaring van de aangever vast. De aangever ondertekent de aangifte.", "art. 163 Sv", "qn8v03"],
["pv", "Wat bedoelen we met redenen van wetenschap in een proces-verbaal?", ["Hoe je aan je kennis bent gekomen, bijvoorbeeld 'ik zag' of 'ik hoorde'.", "De wetsartikelen waarop de verdenking is gebaseerd, met de bijbehorende maximale straffen.", "De opleiding en ervaring van de verbalisant.", "De reden waarom de verdachte het feit heeft gepleegd."], "Met redenen van wetenschap maak je duidelijk waarop je kennis berust: wat je zelf zag, hoorde of vaststelde. Zo kan de lezer je bevindingen beoordelen.", "art. 153 Sv (redenen van wetenschap)", "qn8v04"],
["pv", "Wie ondertekent een proces-verbaal van bevindingen?", ["De opsporingsambtenaar die het heeft opgemaakt.", "De verdachte, voor gezien.", "De hulpofficier van justitie.", "De leidinggevende van de boa."], "Een proces-verbaal wordt persoonlijk opgemaakt, gedateerd en ondertekend door de opsporingsambtenaar die het opmaakt.", "art. 153 Sv", "qn8v05"],
["pv", "Waarom schrijf je in een proces-verbaal van bevindingen in de ik-vorm en niet in de wij-vorm?", ["Omdat elke verbalisant alleen verklaart over wat hij zelf heeft waargenomen of gedaan.", "Omdat de wij-vorm in de Nederlandse taal niet formeel genoeg is voor een officieel stuk van de overheid.", "Omdat een proces-verbaal maar door één boa mag worden opgemaakt.", "Omdat de verdachte zo beter weet tegen wie hij bezwaar moet maken."], "Een proces-verbaal is een persoonlijke verklaring. Met 'ik' is duidelijk wie wat heeft waargenomen. Zag een collega iets, dan vermeld je dat als zijn waarneming.", "Proces-verbaal: schrijfstijl", "qn8v06"],
["pv", "Hoe noemen we een proces-verbaal waarin je beschrijft wat je hebt gezien, gehoord en gedaan?", ["Een proces-verbaal van bevindingen.", "Een proces-verbaal van aangifte.", "Een proces-verbaal van verhoor.", "Een proces-verbaal van inbeslagneming."], "In een proces-verbaal van bevindingen leg je vast wat je zelf hebt waargenomen en gedaan. Bij aangifte en verhoor leg je een verklaring van een ander vast.", "Proces-verbaal: soorten", "qn8v07"],
["pv", "Je hebt bij een verdachte een veiligheidsfouillering uitgevoerd. Wat vermeld je daarover in je proces-verbaal?", ["Welke bevoegdheid je gebruikte, op grond van welk artikel, waarom en wat het resultaat was.", "Alleen dat de fouillering heeft plaatsgevonden, zonder verdere details over de aanleiding of het resultaat.", "Niets, want een fouillering hoort niet in het proces-verbaal.", "Alleen wat je hebt gevonden, zodat de lezer niet wordt afgeleid."], "De rechter moet kunnen toetsen of je bevoegd was en rechtmatig handelde. Daarom vermeld je de bevoegdheid, de grondslag, de aanleiding en het resultaat.", "art. 152 Sv; bevoegdheden beschrijven", "qn8v08"],
["pv", "Wat verstaan we onder daderwetenschap?", ["Kennis over het strafbare feit die alleen de dader kan hebben.", "Kennis van de politie over eerdere feiten van de verdachte.", "Wetenschappelijk onderzoek naar het gedrag van daders.", "Kennis die een getuige heeft over de identiteit van de dader."], "Daderwetenschap is informatie die alleen de dader kan weten, bijvoorbeeld een detail dat niet openbaar is gemaakt. Leg zulke uitspraken letterlijk vast.", "Proces-verbaal: daderwetenschap", "qn8v09"],
["pv", "Waarom neem je een verhoor bij voorkeur op in vraag-en-antwoordvorm?", ["Zo blijft zichtbaar welke vragen zijn gesteld en wat de verdachte daarop antwoordde.", "Zo hoeft de verdachte zijn verklaring niet meer te ondertekenen en kan het verhoor sneller worden afgerond.", "Omdat de verklaring anders niet mag worden gebruikt als bewijs.", "Omdat de verdachte dan geen cautie meer hoeft te krijgen."], "Volgens artikel 29a Sv wordt de verklaring zoveel mogelijk in de eigen woorden van de verdachte opgenomen. De vraag-en-antwoordvorm laat zien hoe de verklaring tot stand kwam.", "art. 29a Sv", "qn8v10"],
["pv", "De verdachte wil bij het voorlezen van zijn verklaring nog iets aanvullen. Wat doe je?", ["Je neemt de aanvulling op in het proces-verbaal van verhoor.", "Je weigert, want de verklaring is al opgeschreven.", "Je schrijft de aanvulling op een los briefje voor de officier van justitie.", "Je maakt een nieuw proces-verbaal en vernietigt het oude."], "De verdachte mag opmerkingen maken bij zijn verklaring. Die neem je op in het proces-verbaal. Wil hij niet tekenen, dan vermeld je dat met de reden.", "art. 29a Sv", "qn8v11"],
["pv", "Welke gegevens horen in de kop van een proces-verbaal?", ["Het soort proces-verbaal, het nummer, de naam en functie van de verbalisant, en datum en tijd.", "De straf die de verdachte volgens de verbalisant moet krijgen en de mening van zijn leidinggevende daarover.", "De mening van de leidinggevende over het optreden.", "Het telefoonnummer en het privéadres van de verbalisant."], "In de kop staan de gegevens waarmee het proces-verbaal kan worden geïdentificeerd: soort, nummer, wie het opmaakt (naam en functie) en wanneer.", "Proces-verbaal: opbouw", "qn8v12"],
["pv", "Waarom moet een proces-verbaal ook begrijpelijk zijn voor iemand die er niet bij was?", ["Omdat de officier van justitie en de rechter er een oordeel op baseren zonder erbij te zijn geweest.", "Omdat het proces-verbaal na afloop openbaar wordt gemaakt op de website van de gemeente of de vervoerder.", "Omdat het anders niet kan worden vertaald voor een buitenlandse verdachte.", "Omdat alleen een begrijpelijk proces-verbaal mag worden ondertekend."], "De lezers van je proces-verbaal waren er niet bij. Zij moeten op basis van jouw tekst kunnen beoordelen wat er gebeurde en of je rechtmatig handelde.", "art. 344 Sv; doel van het proces-verbaal", "qn8v13"],
["pv", "Je weet niet zeker welke kleur de auto van de verdachte had. Wat schrijf je op?", ["Dat je het niet zeker weet, bijvoorbeeld 'vermoedelijk donkerblauw'.", "De kleur die het meest waarschijnlijk is, zonder voorbehoud.", "Niets over de kleur, ook al heb je een indruk.", "De kleur die een collega achteraf noemde, als jouw waarneming."], "Een eerlijk voorbehoud maakt je verslag betrouwbaar. De lezer weet dan hoe zeker een detail is. Een waarneming van een collega vermeld je als de zijne.", "Proces-verbaal: objectief verbaliseren", "qn8v14"],
["pv", "Aan wie zend je volgens artikel 156 Sv je processen-verbaal en de inbeslaggenomen voorwerpen?", ["Aan de officier van justitie, eventueel via de hulpofficier van justitie.", "Aan de burgemeester van de gemeente waar het feit is gepleegd.", "Aan de rechter-commissaris van de rechtbank.", "Aan de werkgever van de verdachte."], "Artikel 156 Sv bepaalt dat opsporingsambtenaren hun processen-verbaal, aangiften en in beslag genomen voorwerpen onverwijld naar de (hulp)officier van justitie zenden.", "art. 156 Sv", "qn8v15"],
["avg", "Wat verstaan we volgens artikel 4 AVG onder een persoonsgegeven?", ["Alle informatie over een geïdentificeerde of identificeerbare natuurlijke persoon.", "Alleen de naam, het adres, de woonplaats en het burgerservicenummer van een persoon.", "Alleen gegevens die in de Basisregistratie Personen staan.", "Alleen gegevens die iemand zelf aan de overheid heeft gegeven."], "Een persoonsgegeven is alle informatie die direct of indirect iets zegt over een herkenbaar persoon, zoals een kenteken, foto of telefoonnummer.", "art. 4 AVG", "qn8a01"],
["avg", "Hoe lang mogen persoonsgegevens volgens de AVG worden bewaard?", ["Niet langer dan nodig is voor het doel waarvoor ze zijn verwerkt.", "Tien jaar, de vaste termijn voor alle overheidsorganisaties.", "Tot de betrokkene overlijdt of verhuist naar een andere gemeente.", "Zo lang de organisatie wil, als de gegevens goed beveiligd zijn."], "Volgens het beginsel van opslagbeperking (artikel 5 AVG) bewaar je gegevens niet langer dan nodig voor het doel. Voor de Wpg gelden eigen termijnen.", "art. 5 AVG", "qn8a02"],
["avg", "Wat verstaan we volgens de AVG onder het verwerken van persoonsgegevens?", ["Elke handeling met persoonsgegevens, zoals verzamelen, opslaan, raadplegen en verwijderen.", "Alleen het doorgeven van persoonsgegevens aan een andere organisatie, zoals de politie of het CJIB.", "Alleen het digitaal opslaan van persoonsgegevens in een systeem.", "Alleen het publiceren van persoonsgegevens op internet."], "Verwerken is een breed begrip. Ook alleen het raadplegen of vernietigen van gegevens is een verwerking.", "art. 4 AVG", "qn8a03"],
["avg", "Wat houdt de verantwoordingsplicht uit artikel 5 AVG in?", ["Een organisatie moet kunnen aantonen dat zij zich aan de beginselen van de AVG houdt.", "Een betrokkene moet kunnen aantonen dat zijn gegevens onjuist zijn.", "Een boa moet elke raadpleging van gegevens vooraf laten goedkeuren.", "De Autoriteit Persoonsgegevens moet elk jaar alle organisaties controleren."], "De verwerkingsverantwoordelijke is verantwoordelijk voor de naleving van de beginselen en moet die naleving kunnen aantonen, bijvoorbeeld met beleid en registers.", "art. 5 AVG", "qn8a04"],
["avg", "Wie houdt binnen een organisatie intern toezicht op de verwerking van persoonsgegevens?", ["De functionaris voor gegevensbescherming.", "De Autoriteit Persoonsgegevens.", "De burgemeester van de gemeente.", "De officier van justitie."], "Een overheidsorganisatie moet een functionaris voor gegevensbescherming aanstellen. Die houdt intern toezicht. De Autoriteit Persoonsgegevens is de externe toezichthouder.", "art. 37 tot en met 39 AVG", "qn8a05"],
["avg", "Wat houdt het recht op vergetelheid in?", ["Het recht om onder voorwaarden je persoonsgegevens te laten wissen.", "Het recht om na vijf jaar niet meer vervolgd te worden voor een feit.", "Het recht om je naam te laten veranderen in de Basisregistratie Personen.", "Het recht om geen getuigenis af te leggen bij de rechter."], "Volgens artikel 17 AVG kan een betrokkene vragen om zijn gegevens te wissen, bijvoorbeeld als ze niet meer nodig zijn. Er zijn uitzonderingen, zoals een wettelijke bewaarplicht.", "art. 17 AVG", "qn8a06"],
["wijk", "Wat is buurtbemiddeling?", ["Getrainde vrijwilligers helpen buren om samen een conflict op te lossen.", "De gemeente legt buren een boete op als ze blijven ruziën.", "De rechter beslist in een snelle procedure over een burenruzie.", "De politie spreekt beide buren aan en noteert hun gegevens."], "Bij buurtbemiddeling helpen getrainde vrijwilligers buren om zelf afspraken te maken. Dat werkt vaak beter dan handhaven bij een burenruzie.", "Functiegerichte training Wijkgericht werken (ExTH-geaccrediteerd)", "qn8k01"],
["wijk", "Wat is een voorwaarde voor buurtbemiddeling?", ["Beide partijen doen vrijwillig mee.", "Er moet eerst aangifte zijn gedaan bij de politie.", "Een van de buren moet een huurwoning hebben.", "De burgemeester moet toestemming geven."], "Buurtbemiddeling werkt alleen als beide partijen bereid zijn mee te doen. Bij strafbare feiten of geweld is het niet geschikt.", "Functiegerichte training Wijkgericht werken (ExTH-geaccrediteerd)", "qn8k02"],
["wijk", "Wat is een buurtschouw?", ["Een ronde door de wijk met bewoners en partners om knelpunten in de openbare ruimte vast te stellen.", "Een controle van alle woningen in de wijk op illegale bewoning, onderverhuur en woonfraude door de gemeente.", "Een bijeenkomst waar bewoners hun stem uitbrengen over een nieuw plan.", "Een cameratoezicht dat de gemeente tijdelijk in een wijk plaatst."], "Bij een buurtschouw lopen bewoners en partners samen door de wijk. Ze noteren knelpunten, zoals kapotte verlichting of rommelhoeken, en spreken acties af.", "Functiegerichte training Wijkgericht werken (ExTH-geaccrediteerd)", "qn8k03"],
["wijk", "Waarom koppel je terug aan een bewoner die een melding heeft gedaan?", ["Zodat het vertrouwen blijft en hij ook in de toekomst meldingen doet.", "Omdat de bewoner wettelijk recht heeft op inzage in het proces-verbaal.", "Omdat je zonder terugkoppeling geen nieuwe melding mag aannemen.", "Zodat de bewoner kan beslissen welke sanctie je oplegt."], "Wie hoort wat er met zijn melding gebeurde, blijft melden. Je deelt daarbij geen persoonsgegevens of vertrouwelijke informatie.", "Functiegerichte training Wijkgericht werken (ExTH-geaccrediteerd)", "qn8k04"],
["wijk", "Wat bedoelen we met de signalerende rol van de boa in de wijk?", ["Signalen opmerken en doorgeven aan de partner die er iets mee kan.", "Verkeersborden plaatsen waar dat volgens bewoners nodig is.", "Alle signalen zelf oplossen, zonder andere organisaties in te schakelen.", "Bewoners waarschuwen voor controles die eraan komen."], "Een boa is ogen en oren in de wijk. Signalen over zorg, verwaarlozing of ondermijning geef je door aan de juiste partner, zoals het wijkteam of de wijkagent.", "Functiegerichte training Wijkgericht werken (ExTH-geaccrediteerd)", "qn8k05"],
["wijk", "Welke partner is meestal als eerste aan zet bij overlast van een huurder van een sociale huurwoning?", ["De woningcorporatie, als verhuurder.", "De officier van justitie.", "De Raad voor de Kinderbescherming.", "De Belastingdienst."], "De woningcorporatie kan als verhuurder de huurder aanspreken en afspraken maken. Samen met de boa, wijkagent en het wijkteam kan dat de overlast aanpakken.", "Functiegerichte training Wijkgericht werken (ExTH-geaccrediteerd)", "qn8k06"],
["wijk", "Een ondernemer klaagt over jongeren die steeds voor zijn winkel hangen. Wat past bij wijkgericht werken?", ["Met jongerenwerk, wijkagent en ondernemer de oorzaak bekijken en samen afspraken maken.", "De jongeren elke dag opnieuw een bekeuring geven, tot ze ergens anders in de wijk gaan hangen.", "De ondernemer adviseren om zelf beveiliging in te huren.", "De melding afwijzen omdat hangen op straat niet strafbaar is."], "Wijkgericht werken zoekt een duurzame oplossing met partners. Handhaven kan onderdeel zijn, maar alleen bekeuren verplaatst het probleem vaak.", "Functiegerichte training Wijkgericht werken (ExTH-geaccrediteerd)", "qn8k07"],
["wijk", "Wat is de taak van het sociaal wijkteam?", ["Inwoners dicht bij huis helpen met vragen over zorg, werk, inkomen en opvoeding.", "Toezicht houden op de naleving van de APV in de wijk.", "Het opsporen van strafbare feiten in samenwerking met de politie.", "Het onderhoud van groen en straten in de wijk regelen."], "Het sociaal wijkteam helpt inwoners met hulpvragen. Een boa kan signalen over zorg doorgeven aan het wijkteam.", "Functiegerichte training Wijkgericht werken (ExTH-geaccrediteerd)", "qn8k08"],
["wijk", "Welk signaal in een wijk kan wijzen op ondermijning?", ["Een winkel die bijna nooit klanten heeft, maar toch al jaren open blijft.", "Een groep buren die samen een straatfeest organiseert.", "Een bewoner die vaak klaagt over geluidsoverlast.", "Een school die een nieuw schoolplein aanlegt."], "Ondermijning is verweving van onderwereld en bovenwereld. Een zaak zonder klanten die toch blijft bestaan, kan wijzen op witwassen. Zo'n signaal geef je door.", "Functiegerichte training Wijkgericht werken (ExTH-geaccrediteerd)", "qn8k09"],
["wijk", "Waarom is het nuttig om als boa vaak in dezelfde wijk te werken?", ["Je bouwt een netwerk en vertrouwen op en herkent sneller wat afwijkt.", "Je hoeft dan minder processen-verbaal op te maken.", "Bewoners mogen je dan rechtstreeks opdrachten geven.", "Je bent dan bevoegd voor meer strafbare feiten dan in andere wijken."], "Door vaste gezichten in de wijk ontstaat vertrouwen. Je kent de mensen en de plekken en ziet sneller als er iets verandert.", "Functiegerichte training Wijkgericht werken (ExTH-geaccrediteerd)", "qn8k10"],
["cult", "Wat verstaan we onder een stereotype?", ["Een vereenvoudigd beeld van een groep dat op alle leden van die groep wordt geplakt.", "Een strafbare uitlating over een groep mensen vanwege hun afkomst.", "Een gewoonte die in een bepaalde cultuur veel voorkomt.", "Een ervaring die je zelf met iemand uit een groep hebt gehad."], "Een stereotype is een algemeen beeld van een groep. Het wordt een probleem als je iemand alleen op basis van dat beeld beoordeelt.", "Functiegerichte training Cultureel vakmanschap (ExTH-geaccrediteerd)", "qn8c01"],
["cult", "Wat is het verschil tussen een vooroordeel en discriminatie?", ["Een vooroordeel is een oordeel vooraf; discriminatie is iemand op grond daarvan ongelijk behandelen.", "Een vooroordeel is strafbaar; discriminatie is alleen onbeleefd en daarom niet strafbaar.", "Een vooroordeel gaat over personen; discriminatie gaat over organisaties.", "Er is geen verschil; beide woorden betekenen hetzelfde."], "Iedereen heeft vooroordelen. Discriminatie ontstaat als je mensen daardoor ongelijk behandelt. Dat is verboden (artikel 1 Grondwet).", "art. 1 Gw; Cultureel vakmanschap", "qn8c02"],
["cult", "Op welke grond spreek je iemand bij voorkeur aan voor een controle?", ["Op zijn gedrag of op concrete informatie, zoals een signalement.", "Op zijn uiterlijk, omdat dat het snelst opvalt.", "Op zijn leeftijd, omdat jongeren vaker overtredingen plegen.", "Op de wijk waar hij woont, omdat daar meer overlast is."], "Een controle moet een objectieve grond hebben, zoals gedrag of een signalement. Zo voorkom je etnisch profileren en willekeur.", "Functiegerichte training Cultureel vakmanschap (ExTH-geaccrediteerd)", "qn8c03"],
["cult", "Waarom leg je uit waarom je iemand aanspreekt of controleert?", ["Het voorkomt het gevoel van willekeur of discriminatie en vergroot het begrip.", "Omdat de controle juridisch ongeldig is als je de reden niet vooraf mondeling hebt uitgelegd.", "Omdat de betrokkene anders niet hoeft mee te werken.", "Omdat je anders een klacht van je leidinggevende krijgt."], "Uitleg maakt je optreden voorspelbaar en eerlijk. Mensen accepteren een controle beter als ze begrijpen waarom die plaatsvindt.", "Functiegerichte training Cultureel vakmanschap (ExTH-geaccrediteerd)", "qn8c04"],
["cult", "Iemand kijkt je tijdens het gesprek nauwelijks aan. Wat doe je?", ["Je trekt geen conclusie; in sommige culturen is wegkijken een teken van respect.", "Je gaat ervan uit dat hij liegt en vraagt door tot hij je aankijkt.", "Je beëindigt het gesprek, omdat hij geen contact wil.", "Je vraagt hem streng om je aan te kijken als hij praat."], "Oogcontact heeft niet in elke cultuur dezelfde betekenis. Interpreteer non-verbaal gedrag voorzichtig en let op wat iemand zegt en doet.", "Functiegerichte training Cultureel vakmanschap (ExTH-geaccrediteerd)", "qn8c05"],
["cult", "Welk artikel van het Wetboek van Strafrecht stelt groepsbelediging strafbaar, zoals je opzettelijk beledigend uitlaten over een groep vanwege hun ras of godsdienst?", ["Artikel 137c Sr.", "Artikel 137d Sr.", "Artikel 266 Sr.", "Artikel 261 Sr."], "Artikel 137c Sr gaat over groepsbelediging. Artikel 137d Sr gaat over aanzetten tot haat, discriminatie of geweld, artikel 266 Sr over eenvoudige belediging van een persoon en artikel 261 Sr over smaad.", "art. 137c Sr", "qn8c06"],
["cult", "Een vrouw met een hoofddoek wil niet door een mannelijke collega worden gefouilleerd. Wat doe je?", ["Je laat zo mogelijk een vrouwelijke collega de fouillering uitvoeren, zoals bij elke fouillering.", "Je legt uit dat de fouillering door de mannelijke collega moet gebeuren, omdat hij al ter plaatse is.", "Je ziet af van de fouillering, ook als die nodig is voor de veiligheid.", "Je vraagt haar om de hoofddoek eerst zelf af te doen."], "Fouilleren gebeurt zoveel mogelijk door iemand van hetzelfde geslacht. Dat geldt voor iedereen en sluit aan bij haar wens.", "Ambtsinstructie; Cultureel vakmanschap", "qn8c07"],
["cult", "Waarom gebruik je bij een taalbarrière liever geen kind als tolk?", ["Het kind komt in een lastige positie en vertaalt mogelijk niet neutraal of volledig.", "Kinderen mogen volgens de wet niet met een boa praten.", "Een kind als tolk maakt het gesprek ongeldig, zodat de rechter het later niet als bewijs kan gebruiken.", "Een kind als tolk maakt het gesprek ongeldig voor de rechter."], "Een kind kan zich verantwoordelijk voelen, dingen weglaten of verzachten. Gebruik liever een volwassene of een professionele tolk.", "Functiegerichte training Cultureel vakmanschap (ExTH-geaccrediteerd)", "qn8c08"],
["cult", "Hoe kun je controleren of je beslissing om iemand aan te spreken vrij is van vooroordelen?", ["Je vraagt je af of je dit bij iedereen in dezelfde situatie ook zou doen.", "Je vraagt een collega of hij de persoon ook verdacht vindt.", "Je kijkt of de persoon eerder bij de politie bekend was.", "Je spreekt alleen mensen aan die je niet kent."], "Een eenvoudige toets is: zou ik dit ook doen als iemand er anders uitzag, maar hetzelfde deed? Zo maak je onbewuste vooroordelen zichtbaar.", "Functiegerichte training Cultureel vakmanschap (ExTH-geaccrediteerd)", "qn8c09"],
["cult", "Wat is een gevolg van etnisch profileren voor het werk van de boa?", ["Het vertrouwen van groepen in de overheid neemt af, waardoor zij minder snel melden of meewerken.", "Het aantal meldingen in de wijk neemt juist toe, omdat bewoners zich door de extra controles veiliger voelen.", "De boa krijgt meer bevoegdheden om te controleren.", "Het heeft geen gevolgen zolang de controle volgens de regels verloopt."], "Wie zich onterecht gecontroleerd voelt, verliest vertrouwen. Dat maakt samenwerking met bewoners moeilijker en schaadt het gezag van de boa.", "Functiegerichte training Cultureel vakmanschap (ExTH-geaccrediteerd)", "qn8c10"],
["jgd", "In welke drie soorten worden problematische jeugdgroepen vaak ingedeeld?", ["Hinderlijk, overlastgevend en crimineel.", "Rustig, druk en gewelddadig.", "Licht, middelzwaar en zwaar.", "Lokaal, regionaal en landelijk."], "Met de shortlistmethodiek worden jeugdgroepen ingedeeld als hinderlijk, overlastgevend of crimineel. Per soort past een andere aanpak met partners.", "Functiegerichte training Jeugd (ExTH-geaccrediteerd)", "qn8j01"],
["jgd", "Welk deel van de hersenen is bij jongeren nog in ontwikkeling en is belangrijk voor plannen en het overzien van gevolgen?", ["De prefrontale cortex.", "De kleine hersenen.", "De hersenstam.", "De hypothalamus."], "De prefrontale cortex is pas rond het 23e tot 25e jaar volgroeid. Daardoor overzien jongeren gevolgen minder goed en handelen ze sneller impulsief.", "Functiegerichte training Jeugd (ExTH-geaccrediteerd)", "qn8j02"],
["jgd", "Welke houding werkt meestal het best als je een jongere aanspreekt op zijn gedrag?", ["Respectvol en duidelijk, zonder te preken of te dreigen.", "Streng en afstandelijk, zodat hij je gezag voelt.", "Joviaal en met veel grappen, zodat hij je aardig vindt.", "Kort en zakelijk, zonder uitleg over het waarom."], "Jongeren reageren goed op respect en duidelijkheid. Preken of dreigen roept verzet op; uitleg over het waarom vergroot de kans dat ze meewerken.", "Functiegerichte training Jeugd (ExTH-geaccrediteerd)", "qn8j03"],
["jgd", "Je houdt een minderjarige verdachte aan. Wie moet volgens het Wetboek van Strafvordering zo snel mogelijk worden geïnformeerd?", ["Zijn ouders of voogd.", "Zijn school of leerplichtambtenaar.", "Zijn huisarts.", "De Raad voor de Kinderbescherming."], "Bij de aanhouding van een minderjarige worden de ouders of de voogd zo snel mogelijk op de hoogte gebracht.", "art. 488b Sv", "qn8j04"],
["jgd", "Tot welke leeftijd kan de rechter volgens artikel 77c Sr het jeugdstrafrecht toepassen op een jongvolwassene?", ["Tot 23 jaar ten tijde van het feit.", "Tot 21 jaar ten tijde van de zitting.", "Tot 18 jaar ten tijde van het feit.", "Tot 25 jaar ten tijde van de zitting."], "Met het adolescentenstrafrecht kan de rechter het jeugdstrafrecht toepassen op jongvolwassenen van 18 tot 23 jaar, gekeken naar hun persoonlijkheid en de omstandigheden.", "art. 77c Sr", "qn8j05"],
["jgd", "Welk feit kan typisch met een Halt-afdoening worden afgedaan?", ["Een vernieling of vuurwerkoverlast door een jongere van 15 jaar.", "Een woninginbraak met geweld door een jongere van 17 jaar.", "Handel in harddrugs door een jongere van 16 jaar.", "Een zware mishandeling door een jongvolwassene van 19 jaar."], "Halt is bedoeld voor jongeren van 12 tot 18 jaar met een licht strafbaar feit, zoals vernieling, winkeldiefstal of vuurwerkoverlast.", "art. 77e Sr; Halt-afdoening", "qn8j06"],
["jgd", "Wie handhaaft de Leerplichtwet 1969 bij schoolverzuim?", ["De leerplichtambtenaar van de gemeente.", "De directeur van de school.", "De jongerenwerker in de wijk.", "De Inspectie van het Onderwijs."], "De leerplichtambtenaar ziet toe op de naleving van de Leerplichtwet en kan bij verzuim een proces-verbaal opmaken.", "art. 16 Leerplichtwet 1969", "qn8j07"],
["jgd", "Tot wanneer geldt de kwalificatieplicht volgens de Leerplichtwet 1969?", ["Tot 18 jaar, of tot de jongere een startkwalificatie heeft.", "Tot 16 jaar, ongeacht het diploma dat de jongere op dat moment al heeft behaald.", "Tot 21 jaar, als de jongere nog thuis woont.", "Tot de jongere werk heeft gevonden."], "Na de volledige leerplicht geldt de kwalificatieplicht: een jongere moet onderwijs volgen tot hij 18 is of een startkwalificatie heeft (havo, vwo of mbo-2).", "art. 4a Leerplichtwet 1969", "qn8j08"],
["jgd", "Wie mag een minderjarige verdachte volgens artikel 488ab Sv bijstaan tijdens het verhoor?", ["Een vertrouwenspersoon, zoals een ouder.", "Een klasgenoot die getuige was.", "De jongerenwerker die de melding deed.", "Een journalist, als de jongere dat wil."], "Een minderjarige verdachte kan zich bij het verhoor laten bijstaan door een vertrouwenspersoon, meestal een ouder. Dat is naast zijn recht op een advocaat.", "art. 488ab Sv", "qn8j09"],
["jgd", "Je ziet bij een jongere signalen die kunnen wijzen op kindermishandeling. Wat doe je?", ["De signalen vastleggen en overleggen met je leidinggevende of Veilig Thuis.", "De jongere direct confronteren met je vermoeden in het bijzijn van zijn vrienden.", "Niets doen, omdat het geen strafbaar feit is dat je zelf hebt gezien.", "De ouders direct aanspreken en een bekeuring geven."], "Bij signalen van kindermishandeling volg je de meldcode: signalen vastleggen, overleggen (bijvoorbeeld met Veilig Thuis) en zo nodig melden.", "Meldcode huiselijk geweld en kindermishandeling", "qn8j10"],
["jgd", "Hoe communiceer je het best met een jongere die moeite heeft om je te begrijpen, bijvoorbeeld door een licht verstandelijke beperking?", ["Korte en concrete zinnen, één vraag tegelijk, en controleren of hij het begrijpt.", "Juist uitgebreid uitleggen, met alle wetsartikelen erbij, zodat hij weet dat het serieus is.", "Hard praten, zodat hij goed hoort wat je zegt.", "Alles via zijn vrienden laten uitleggen."], "Mensen met een licht verstandelijke beperking zijn vaak lastig te herkennen. Gebruik eenvoudige taal, geef tijd en laat in eigen woorden herhalen wat er is afgesproken.", "Functiegerichte training Jeugd (ExTH-geaccrediteerd)", "qn8j11"],
["mo1", "Iemand belt met een melding over een vechtpartij die op dit moment gaande is. Wat vraag je als eerste?", ["Waar het precies gebeurt en of er gewonden of wapens zijn.", "Hoe de melder heet en wat zijn geboortedatum is.", "Of de melder de betrokkenen kent en hoe lang de ruzie al speelt.", "Of de melder bereid is later een verklaring af te leggen."], "Bij een acute situatie gaat veiligheid voor. Eerst de plaats en het gevaar (gewonden, wapens), zodat er direct hulp kan komen. De gegevens van de melder volgen daarna.", "Politie: 112 bij spoed; werkinstructie meldkamer", "qmo1a01"],
["mo1", "Welke vragen helpen je om een melding volledig op te nemen?", ["Wie, wat, waar, wanneer, hoe en waarom.", "Alleen wie en wat, de rest zoek je later zelf uit.", "De vragen die de melder zelf belangrijk vindt.", "Alleen gesloten vragen die met ja of nee te beantwoorden zijn."], "Met de vragen wie, wat, waar, wanneer, hoe en waarom krijg je een volledig beeld. Zo hoef je de melder niet opnieuw te bellen en kan een collega direct verder.", "Studiestof Melding opnemen en verwerken; 7 W's verslaglegging", "qmo1a02"],
["mo1", "Een melder vertelt een lang en verward verhaal. Hoe houd je het gesprek bruikbaar?", ["Luisteren, samenvatten wat je hebt gehoord en gericht doorvragen.", "De melder onderbreken en zeggen dat hij later terug moet bellen.", "Het hele verhaal woordelijk opschrijven zonder vragen te stellen.", "Zelf invullen wat de melder waarschijnlijk bedoelt."], "Met luisteren, samenvatten en doorvragen (LSD) breng je structuur aan en controleer je of je het goed begrepen hebt, zonder dat de melder zich afgekapt voelt.", "Gesprekstechniek LSD (luisteren, samenvatten, doorvragen)", "qmo1a03"],
["mo1", "Waarom vat je aan het eind van een telefonische melding de belangrijkste gegevens samen?", ["Om te controleren of je de melding goed hebt begrepen en genoteerd.", "Omdat de melder anders geen recht heeft op terugkoppeling.", "Om het gesprek zo lang mogelijk te laten duren.", "Omdat een melding pas geldig is als de melder akkoord gaat met de tekst."], "Door samen te vatten kan de melder fouten verbeteren, bijvoorbeeld een verkeerd huisnummer of een verkeerde tijd. Zo voorkom je dat collega's op de verkeerde plek zoeken.", "Gesprekstechniek: samenvatten", "qmo1a04"],
["mo1", "Een melder geeft het signalement van een persoon. In welke volgorde vraag je het uit?", ["Van algemeen naar bijzonder: geslacht, leeftijd, lengte en postuur, daarna kleding en opvallende kenmerken.", "Eerst de schoenen, dan de broek, dan de jas en als laatste het gezicht.", "Alleen opvallende kenmerken, want de rest is bij iedereen hetzelfde.", "In de volgorde waarin de melder het zich herinnert, zonder door te vragen."], "Van algemeen naar bijzonder is overzichtelijk en makkelijk door te geven. Kleding beschrijf je van boven naar beneden; opvallende kenmerken zoals een tatoeage maken het signalement herkenbaar.", "Studiestof Waarnemen, signalementen en verslag", "qmo1a05"],
["mo1", "Een melder wil zijn naam niet geven. Wat doe je?", ["De melding toch aannemen en uitleggen dat hij ook anoniem kan melden bij Meld Misdaad Anoniem (0800-7000).", "De melding weigeren, omdat een melding zonder naam niets waard is.", "Dreigen dat hij strafbaar is als hij zijn naam niet geeft.", "Zijn telefoonnummer laten opzoeken om toch te weten wie hij is."], "Een melding zonder naam kan nog steeds bruikbare informatie bevatten. Wie bang is voor de gevolgen, kan anoniem melden bij Meld Misdaad Anoniem.", "Meld Misdaad Anoniem: 0800-7000", "qmo1a06"],
["mo1", "Wat is het verschil tussen een melding en een aangifte?", ["Een aangifte is een officiële mededeling van een strafbaar feit waar een proces-verbaal van wordt opgemaakt; een melding is een signaal of klacht.", "Er is geen verschil: elke melding is ook een aangifte.", "Een melding gaat naar de politie, een aangifte naar de gemeente.", "Een aangifte kan alleen schriftelijk, een melding alleen telefonisch."], "Aangifte doen is een recht van iedereen die kennis heeft van een strafbaar feit (artikel 161 Wetboek van Strafvordering). Een melding is breder: een klacht over overlast, een losliggende stoeptegel of een zorgsignaal.", "Artikel 161 Wetboek van Strafvordering", "qmo1a07"],
["mo1", "Een melder is erg emotioneel aan de telefoon. Wat werkt het best?", ["Rustig blijven praten, erkennen dat het naar is en daarna stap voor stap vragen stellen.", "De melder vragen terug te bellen als hij gekalmeerd is.", "Zelf ook harder gaan praten zodat je boven de emotie uitkomt.", "Direct ophangen en de melding als niet bruikbaar registreren."], "Erkenning van de emotie helpt de melder tot rust te komen. Daarna kun je met korte, concrete vragen de informatie verzamelen.", "Studiestof Bejegening: de-escalatie", "qmo1a08"],
["mo1", "Iemand meldt aan de balie dat er al weken een fiets met een kapot slot bij zijn voordeur staat. Wat vraag je?", ["Het adres, een beschrijving van de fiets en sinds wanneer hij daar staat.", "Of de melder de fiets zelf wil houden.", "Hoeveel de fiets volgens de melder waard is.", "Of de melder de eigenaar al heeft opgespoord."], "Voor een melding over een achtergelaten fiets heb je de plaats, een beschrijving en de duur nodig. Daarmee kan handhaving beoordelen of de fiets volgens de APV verwijderd mag worden.", "Model-APV: fietsen en wrakken op de weg", "qmo1a09"],
["mo1", "Waarom vraag je naar het telefoonnummer van de melder?", ["Om hem terug te kunnen bellen voor aanvullende vragen of een terugkoppeling.", "Omdat een melder zonder telefoonnummer strafbaar is.", "Om het nummer door te geven aan de persoon over wie wordt gemeld.", "Om de melder later op de hoogte te houden van acties van andere klanten."], "Met een telefoonnummer kun je doorvragen en de melder laten weten wat er met de melding gebeurt. Het nummer blijft vertrouwelijk.", "AVG: doelbinding", "qmo1a10"],
["mo1", "Een melder zegt: 'Daar loopt iemand verdacht rond.' Hoe vraag je door?", ["Vragen wat de persoon precies doet, waar hij is en hoe hij eruitziet.", "Direct concluderen dat het om een inbreker gaat.", "Zeggen dat je niets kunt doen zolang er geen strafbaar feit is.", "Vragen waarom de melder zelf op dat moment buiten was."], "'Verdacht' is een interpretatie. Door te vragen naar concreet gedrag, plaats en signalement krijg je feiten waarmee je kunt beoordelen wat er nodig is.", "Studiestof Waarnemen: feiten en interpretatie", "qmo1a11"],
["mo1", "Een melding komt binnen via de app van de gemeente, met een foto van gedumpt afval. Wat controleer je?", ["Of de locatie klopt en of er op de foto of in het afval aanwijzingen naar de vervuiler te zien zijn.", "Of de melder in dezelfde straat woont als waar het afval ligt.", "Of de foto mooi genoeg is om te publiceren.", "Niets, een melding via de app wordt automatisch afgehandeld."], "Ook een digitale melding moet bruikbaar zijn: de juiste plaats en mogelijke aanwijzingen naar de veroorzaker. Bij afval kan een adres op een envelop een aanwijzing zijn voor handhaving.", "Model-APV: afvalstoffen; gemeentelijke meldingen openbare ruimte", "qmo1a12"],
["mo1", "Een melder spreekt slecht Nederlands. Wat doe je?", ["Korte, eenvoudige zinnen gebruiken en zo nodig een collega of tolk inschakelen.", "De melding niet aannemen tot hij met iemand terugkomt die Nederlands spreekt.", "Harder en sneller praten zodat hij het beter verstaat.", "Zelf raden wat hij bedoelt om het gesprek kort te houden."], "Eenvoudige taal en controle of je elkaar begrijpt maken de melding betrouwbaar. Een collega die de taal spreekt of een tolk kan helpen.", "Studiestof Cultureel vakmanschap", "qmo1a13"],
["mo1", "Je neemt een melding op straat aan van een voorbijganger. Wat doe je voordat hij weggaat?", ["Zijn naam en telefoonnummer noteren voor het geval je nog vragen hebt.", "Hem vragen een handtekening onder je notitie te zetten.", "Hem verplichten mee te lopen naar de plek van het voorval.", "Hem laten weten dat hij niets meer hoort over de melding."], "Een getuige die weggaat zonder contactgegevens ben je kwijt. Noteer zijn gegevens zodat je hem later kunt benaderen, bijvoorbeeld voor een verklaring.", "Werkinstructie melding opnemen", "qmo1a14"],
["mo2", "Hoe leg je een melding vast?", ["Feitelijk en objectief: wat de melder heeft gezien en gehoord, met tijd en plaats.", "Met je eigen inschatting van de schuldvraag erbij.", "Kort en in steekwoorden die alleen jij begrijpt.", "Pas aan het eind van je dienst, uit je hoofd."], "Een collega moet de melding kunnen begrijpen zonder jou te spreken. Feiten, tijd en plaats zijn controleerbaar; je eigen mening hoort er niet in.", "Studiestof Waarnemen en verslag", "qmo2a01"],
["mo2", "Een melder zegt: 'Die buurman is gewoon gestoord.' Hoe neem je dat op?", ["Als uitspraak van de melder, en je vraagt door naar wat de buurman concreet doet.", "Als vaststaand feit: de buurman is gestoord.", "Je laat het weg, want een uitspraak van een melder telt niet.", "Je schrijft op dat de buurman psychisch ziek is."], "Een oordeel van de melder is geen feit. Noteer het eventueel letterlijk als uitspraak en vraag naar het gedrag dat hij heeft gezien. Een diagnose stel jij niet.", "Studiestof Waarnemen: feiten en interpretatie", "qmo2a02"],
["mo2", "Welke gegevens over de melder leg je vast?", ["Alleen wat nodig is om de melding af te handelen en terug te koppelen.", "Zoveel mogelijk, zoals beroep, gezinssituatie en geloof.", "Geen enkele, want gegevens van melders vallen onder de AVG.", "Alleen zijn naam, nooit een telefoonnummer."], "De AVG vraagt dataminimalisatie: je verwerkt niet meer persoonsgegevens dan nodig is voor het doel. Naam en telefoonnummer zijn meestal genoeg.", "AVG artikel 5 lid 1 onder c (dataminimalisatie)", "qmo2a03"],
["mo2", "Waarom noteer je het tijdstip waarop de melding binnenkwam?", ["Om te kunnen nagaan hoe snel er is gereageerd en wanneer iets is gebeurd.", "Omdat een melding na een uur vervalt.", "Om de melder een rekening te kunnen sturen.", "Het tijdstip is alleen nodig bij meldingen via de app."], "Het tijdstip van binnenkomst laat zien hoe de melding is opgevolgd. Het tijdstip van het voorval zelf is belangrijk voor onderzoek en bewijs.", "Werkinstructie registratie meldingen", "qmo2a04"],
["mo2", "Een melder vertelt dat iemand heeft gezegd: 'Ik steek je huis in brand.' Hoe leg je dat vast?", ["Letterlijk, tussen aanhalingstekens, met wie het tegen wie zei.", "Als 'de man was boos en dreigde wat'.", "Je laat het weg omdat het niet is gebeurd.", "Als 'er is sprake van brandstichting'."], "Bij een bedreiging is de precieze tekst van belang voor de beoordeling. Daarom noteer je de uitspraak letterlijk en vermeld je wie het zei en tegen wie.", "Artikel 285 Wetboek van Strafrecht (bedreiging); studiestof verslag", "qmo2a05"],
["mo2", "Mag je een melding over een buurtbewoner met je eigen telefoon fotograferen en in een groepsapp met vrienden delen?", ["Nee, persoonsgegevens uit je werk deel je alleen via de systemen en met de mensen die het nodig hebben.", "Ja, als je de naam van de bewoner onherkenbaar maakt in de tekst.", "Ja, zolang je de foto na een week verwijdert.", "Ja, als de melder daar toestemming voor geeft."], "Gegevens uit meldingen zijn persoonsgegevens en soms politiegegevens (Wpg). Ze mogen alleen voor het doel van je werk worden gebruikt, in de systemen van je werkgever.", "AVG artikel 5 (doelbinding); Wet politiegegevens", "qmo2a06"],
["mo2", "Wat leg je vast als je een melding doorzet naar een andere organisatie?", ["Naar wie je de melding hebt doorgezet, wanneer en eventueel met welk kenmerk.", "Niets, want de melding is dan niet meer van jou.", "Alleen of de melder tevreden was.", "De naam van je leidinggevende."], "Met deze gegevens kan iedereen later nagaan waar de melding is gebleven. Dat is ook nodig om de melder goed te kunnen informeren.", "Werkinstructie registratie meldingen", "qmo2a07"],
["mo2", "Wanneer maak je van een melding een proces-verbaal?", ["Als je zelf een strafbaar feit hebt vastgesteld of bevindingen voor een strafzaak vastlegt.", "Bij elke melding die binnenkomt.", "Alleen als de melder daarom vraagt.", "Nooit, een boa maakt geen proces-verbaal op."], "Een proces-verbaal is een officieel verslag van een opsporingsambtenaar, op ambtseed of ambtsbelofte. Een gewone melding registreer je in het meldsysteem.", "Artikel 152 en 153 Wetboek van Strafvordering", "qmo2a08"],
["mo2", "Een melder geeft je het kenteken van een auto. Wat doe je?", ["Je leest het kenteken hardop terug en noteert het met merk, type en kleur.", "Je onthoudt het en schrijft het later op.", "Je zoekt direct op wie de eigenaar is en belt hem.", "Je noteert alleen de letters, de cijfers zijn niet belangrijk."], "Door terug te lezen voorkom je fouten. Merk, type en kleur helpen om een verkeerd genoteerd kenteken te herkennen.", "Studiestof Waarnemen: voertuigen", "qmo2a09"],
["mo2", "Waarom beschrijf je bij een melding ook wat je zelf hebt gedaan?", ["Zodat collega's weten welke stappen al zijn gezet en wat nog moet gebeuren.", "Om te laten zien dat je goed werk hebt geleverd.", "Omdat de melder dat altijd wil lezen.", "Dat hoeft niet, alleen de melding zelf telt."], "Een melding is vaak de start van een dossier. Als duidelijk is wat er al is gedaan, voorkom je dubbel werk en vergeten stappen.", "Werkinstructie registratie meldingen", "qmo2a10"],
["mo2", "Een melder vraagt of de persoon over wie hij meldt zijn naam te horen krijgt. Wat antwoord je?", ["Dat zijn gegevens vertrouwelijk worden behandeld en niet zonder reden worden gedeeld.", "Dat de persoon altijd mag weten wie over hem heeft gemeld.", "Dat je dat niet weet en dat het niet belangrijk is.", "Dat hij zijn naam beter niet had kunnen geven."], "De gegevens van een melder zijn vertrouwelijk. Uitzonderingen, bijvoorbeeld in een strafzaak, bespreek je niet zelf maar volgens de werkafspraken.", "AVG; werkafspraken melders", "qmo2a11"],
["mo2", "Je neemt een melding aan en ontdekt dat er al drie meldingen over hetzelfde adres zijn. Wat doe je?", ["Je koppelt de melding aan de eerdere meldingen, zodat het patroon zichtbaar wordt.", "Je verwijdert de oude meldingen, want alleen de nieuwste telt.", "Je registreert de nieuwe melding niet, want hij is al bekend.", "Je belt de eerdere melders om te vragen of ze het eens zijn."], "Meerdere meldingen over hetzelfde adres kunnen wijzen op een structureel probleem. Door ze te koppelen kun je met partners gericht aanpakken.", "Studiestof Wijkgericht werken: probleemgericht werken", "qmo2a12"],
["mo2", "Welke formulering is objectief?", ["'De man liep zwalkend en viel twee keer tegen een lantaarnpaal.'", "'De man was stomdronken.'", "'De man was zichtbaar onder invloed van drugs.'", "'De man gedroeg zich asociaal.'"], "Een objectieve beschrijving geeft het gedrag weer dat je hebt waargenomen. Dronkenschap of drugsgebruik is een conclusie die je niet zonder meer kunt trekken.", "Studiestof Waarnemen: feiten en interpretatie", "qmo2a13"],
["mo2", "Hoe lang bewaar je gegevens uit een afgehandelde melding?", ["Niet langer dan nodig, volgens de bewaartermijnen van je organisatie.", "Voor altijd, je weet nooit wanneer je ze nog nodig hebt.", "Tot de melder belt dat ze weg mogen.", "Tot je zelf van baan wisselt."], "De AVG schrijft voor dat persoonsgegevens niet langer worden bewaard dan nodig is voor het doel (opslagbeperking). Je organisatie legt de termijnen vast.", "AVG artikel 5 lid 1 onder e (opslagbeperking)", "qmo2a14"],
["mo3", "Iemand meldt dat er op dit moment wordt ingebroken in een woning. Wat moet er gebeuren?", ["Direct 112 bellen of de meldkamer van de politie inschakelen.", "De melding inplannen voor de volgende dienst.", "Doorverwijzen naar het algemene nummer van de gemeente.", "De melder vragen eerst zelf foto's te maken."], "Een heterdaadsituatie met mogelijk gevaar is spoed. Dan moet de politie direct komen; 112 is daarvoor het nummer.", "Politie: 112 bij spoed", "qmo3a01"],
["mo3", "Iemand wil de politie spreken over een fietsdiefstal van vorige week. Welk nummer geef je?", ["0900-8844, het nummer van de politie zonder spoed.", "112, want het gaat om een strafbaar feit.", "0800-2000, het nummer van Veilig Thuis.", "144, het nummer voor dierennood."], "112 is alleen voor spoed. Voor zaken zonder spoed, zoals een diefstal die al voorbij is, is de politie bereikbaar via 0900-8844, of de melder doet online aangifte.", "Politie: 0900-8844 (geen spoed)", "qmo3a02"],
["mo3", "Een buurvrouw maakt zich zorgen over een kind dat steeds met blauwe plekken op straat speelt. Waar kan zij advies krijgen of melden?", ["Bij Veilig Thuis (0800-2000).", "Bij het Meldpunt zorgwekkend gedrag (0800-1205).", "Bij Meld Misdaad Anoniem (0800-7000).", "Bij de afdeling openbare ruimte van de gemeente."], "Veilig Thuis is het advies- en meldpunt voor huiselijk geweld en kindermishandeling. Bij direct gevaar bel je 112.", "Veilig Thuis: 0800-2000; Wet meldcode huiselijk geweld en kindermishandeling", "qmo3a03"],
["mo3", "Iemand meldt een verwarde man die al dagen in het park slaapt en tegen zichzelf praat. Er is geen direct gevaar. Waar kan de melding heen?", ["Naar het Meldpunt zorgwekkend gedrag van de gemeente (0800-1205).", "Naar 112, want het gaat om een verward persoon.", "Naar Veilig Thuis, omdat het om een volwassene gaat.", "Nergens, slapen in een park is niet verboden."], "Voor zorgen over iemand met verward of zorgwekkend gedrag zonder direct gevaar is er het Meldpunt zorgwekkend gedrag. Bij gevaar voor de persoon of anderen bel je 112.", "Rijksoverheid: Meldpunt zorgwekkend gedrag 0800-1205", "qmo3a04"],
["mo3", "Een melder ziet een hond die in een afgesloten auto in de zon zit en hijgt. Welk nummer is bedoeld voor dierennood?", ["144.", "112.", "0900-8844.", "0800-2000."], "144 is het nummer voor dieren in nood. Bij een hond in een hete auto kan het om spoed gaan; afhankelijk van de situatie wordt ook de politie ingeschakeld.", "Landelijke Inspectiedienst Dierenbescherming: 144", "qmo3a05"],
["mo3", "Een bewoner meldt een losliggende stoeptegel waar iemand over kan struikelen. Wie pakt dit op?", ["De afdeling beheer openbare ruimte van de gemeente.", "De politie via 0900-8844.", "Handhaving, met een bekeuring voor de eigenaar van het huis.", "Veilig Thuis."], "Onderhoud van de openbare ruimte is een taak van de gemeente als wegbeheerder. Je zet de melding door naar de afdeling die daarvoor verantwoordelijk is.", "Wegenwet; gemeentelijke meldingen openbare ruimte", "qmo3a06"],
["mo3", "Welke melding heeft de hoogste prioriteit?", ["Een kind dat alleen langs een drukke weg loopt.", "Een fout geparkeerde auto voor een uitrit.", "Hondenpoep op een speelveld.", "Een overvolle afvalbak bij een bushokje."], "Bij prioriteren gaat de veiligheid van mensen voor. Een kind alleen langs een drukke weg verkeert in direct gevaar.", "Werkinstructie prioritering meldingen", "qmo3a07"],
