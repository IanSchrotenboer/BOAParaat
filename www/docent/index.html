["mo3", "Een melder vraagt wanneer de overlast van een hangplek is opgelost. Wat zeg je?", ["Wat je gaat doen en wanneer hij ongeveer iets hoort, zonder te beloven wat je niet zeker weet.", "Dat het morgen is opgelost.", "Dat je daar niets over mag zeggen.", "Dat hij beter zelf met de jongeren kan gaan praten."], "Met eerlijk verwachtingsmanagement houd je het vertrouwen van de melder. Een belofte die je niet nakomt, leidt tot teleurstelling en minder meldingen.", "Studiestof Wijkgericht werken: terugkoppeling", "qmo3a08"],
["mo3", "Wat is een 'warme overdracht' van een melding?", ["Je draagt de melding persoonlijk over aan de nieuwe behandelaar en checkt dat hij hem oppakt.", "Je stuurt de melding door en gaat ervan uit dat het goed komt.", "Je geeft de melder het nummer van een andere organisatie.", "Je bewaart de melding tot het warmer weer is en de overlast terugkomt."], "Bij een warme overdracht voorkom je dat een melding tussen organisaties blijft liggen. Dat is vooral belangrijk bij zorgsignalen.", "Werkafspraken ketenpartners", "qmo3a09"],
["mo3", "Een melding gaat over iets waar handhaving niet over gaat. Wat doe je?", ["De melder vertellen bij wie hij wel terecht kan, of de melding zelf doorzetten.", "De melding weggooien, want het is niet jouw taak.", "Toch zelf optreden zodat de melder tevreden is.", "De melder vragen nooit meer te bellen."], "Ook als iets niet jouw taak is, help je de melder verder. Je verwijst door of zet de melding door naar de juiste partij en legt dat vast.", "Werkinstructie meldingen", "qmo3a10"],
["mo3", "Een bewoner meldt dat er 's nachts steeds andere mensen een woning in- en uitlopen en dat de ramen zijn afgeplakt. Wat kan dit zijn en wat doe je?", ["Een mogelijk signaal van ondermijning, zoals drugshandel; je legt het vast en geeft het door aan de politie.", "Een gezellige buurtbewoner; je doet er niets mee.", "Een overtreding van de APV; je schrijft direct een bekeuring uit.", "Een zaak voor Veilig Thuis."], "Afgeplakte ramen en veel wisselend bezoek kunnen wijzen op criminaliteit in een woning. Een boa onderzoekt dat niet zelf, maar legt de signalen vast en geeft ze door.", "Studiestof Wijkgericht werken: ogen en oren", "qmo3a11"],
["mo3", "Wanneer koppel je terug aan de melder?", ["Als de melding is afgehandeld of als duidelijk is wat ermee gebeurt.", "Pas als de melder zelf belt.", "Alleen als de melding tot een bekeuring heeft geleid.", "Terugkoppelen is niet toegestaan vanwege de AVG."], "Terugkoppeling laat zien dat de melding serieus is genomen. Je vertelt wat er is gedaan, zonder privégegevens van anderen te delen.", "Studiestof Wijkgericht werken: terugkoppeling", "qmo3a12"],
["mo3", "Twee meldingen komen tegelijk binnen: geluidsoverlast van een feest en een fietser die gewond op straat ligt. Wat doe je?", ["Eerst de gewonde fietser: hulpdiensten inschakelen via 112, daarna de geluidsoverlast.", "Eerst de geluidsoverlast, want die kwam als eerste binnen.", "Beide meldingen inplannen voor de volgende dag.", "De melder van het feest vragen zelf naar de fietser te gaan."], "Bij prioriteren gaat letsel en gevaar voor mensen altijd voor. Geluidsoverlast kan wachten tot de acute situatie is afgehandeld.", "Werkinstructie prioritering meldingen", "qmo3a13"],
["mo3", "Een melder belt de handhavingsdienst, terwijl er een gewonde op straat ligt. Wat doe je eerst?", ["Zorgen dat 112 is gebeld en de melder vragen bij de gewonde te blijven als dat veilig is.", "Uitleggen dat hij het verkeerde nummer heeft gebeld en ophangen.", "Eerst zijn naam, adres en geboortedatum noteren.", "Vragen of hij zeker weet dat het slachtoffer gewond is."], "Bij letsel moet direct medische hulp komen. Controleer of 112 is gebeld; de registratie komt daarna.", "Politie en ambulance: 112 bij spoed", "qmo3a14"],

const Q9 = [
["vrij", "Een vrouw wijst boa De Groot een man aan die haar fiets bij zich heeft. Volgens haar is de fiets twee dagen geleden gestolen. Is er sprake van ontdekking op heterdaad?", ["Nee, het feit is niet ontdekt tijdens of direct na het begaan.", "Ja, de verdachte heeft het gestolen goed op dat moment nog bij zich.", "Ja, de eigenares herkent haar eigen fiets en wijst de dader aan."], "Heterdaad (art. 128 lid 1 Sv) betekent dat het feit wordt ontdekt terwijl het wordt begaan of terstond daarna. Twee dagen later is dat niet meer zo, ook al heeft de verdachte de fiets nog.", "art. 128 Sv", "qx9a01"],
["vrij", "Boa Bakker ziet hoe een jongen met een steen de ruit van een bushokje inslaat. Mag de boa de jongen aanhouden?", ["Ja, bij heterdaad is ieder bevoegd de verdachte aan te houden.", "Nee, alleen een politieambtenaar mag een verdachte aanhouden.", "Ja, maar alleen nadat de officier van justitie toestemming heeft gegeven."], "Bij ontdekking op heterdaad is ieder bevoegd de verdachte aan te houden (art. 53 lid 1 Sv). Daarna geleidt de boa de verdachte voor aan de (hulp)officier van justitie.", "art. 53 Sv", "qx9a02"],
["vrij", "Wanneer mag een opsporingsambtenaar buiten heterdaad een verdachte aanhouden zonder bevel van de officier van justitie?", ["Bij een feit met voorlopige hechtenis, als het bevel niet kan worden afgewacht.", "Bij elk strafbaar feit, als de verdachte zijn identiteitsbewijs niet wil tonen.", "Bij een overtreding, als de verdachte binnen 24 uur na het feit wordt aangetroffen."], "Buiten heterdaad is aanhouden alleen mogelijk bij feiten waarvoor voorlopige hechtenis is toegelaten. De opsporingsambtenaar mag dat zelf doen als het bevel van de officier van justitie niet kan worden afgewacht (art. 54 lid 2 Sv).", "art. 54 Sv; art. 67 Sv", "qx9a03"],
["bev", "Een boa houdt een verdachte staande, houdt hem daarna aan en laat hem vervolgens ophouden voor onderzoek. Hoe heet het na elkaar inzetten van deze verschillende bevoegdheden?", ["Voortgezette toepassing van bevoegdheden.", "Herhaalde toepassing van eenzelfde bevoegdheid.", "Cumulatie van strafbare feiten."], "Bij voortgezette toepassing volgt op de ene bevoegdheid een andere, zwaardere. Bij herhaalde toepassing pas je dezelfde bevoegdheid in dezelfde zaak opnieuw toe. Voor elke stap moet je bevoegd zijn.", "Toetsmatrijs Domein I, toetsterm 2.2.3", "qx9a04"],
["amb", "Bij een evenement geeft een boa een groep die opschudding veroorzaakt het bevel om te vertrekken. Eén man blijft staan en blijft schreeuwen. Welk artikel uit het Wetboek van Strafrecht past het best?", ["Artikel 185 Sr, opschudding en zich niet verwijderen na een bevel.", "Artikel 184 Sr, het niet voldoen aan een bevel of vordering van een ambtenaar.", "Artikel 266 Sr, belediging van een ambtenaar in functie."], "Artikel 185 Sr is specifiek: opschudding veroorzaken en zich na een bevel niet verwijderen. Artikel 184 Sr is de algemene bepaling voor het niet voldoen aan een bevel of vordering.", "art. 185 Sr", "qx9a05"],
["amb", "Terwijl boa Yilmaz een bekeuring schrijft, zegt de bestuurder: 'Als je dat opschrijft, steek ik je neer.' Welk strafbaar feit pleegt hij?", ["Bedreiging van een ambtenaar (artikel 285 Sr).", "Belediging van een ambtenaar (artikel 266 en 267 Sr).", "Wederspannigheid (artikel 180 Sr)."], "Dreigen met een misdrijf tegen het leven is bedreiging (art. 285 Sr). Omdat het gericht is tegen een ambtenaar in de uitoefening van zijn functie, geldt een strafverhoging (lid 5). Wederspannigheid vereist verzet met geweld.", "art. 285 Sr", "qx9a06"],
["amb", "Een man scheldt een boa die een overtreding afhandelt uit met een grove ziektenaam. Welk artikel is van toepassing?", ["Artikel 266 jo. 267 Sr, belediging van een ambtenaar.", "Artikel 285 Sr, bedreiging van een ambtenaar in functie.", "Artikel 184 Sr, het belemmeren van een ambtshandeling."], "Uitschelden is eenvoudige belediging (art. 266 Sr). Omdat de boa in functie is, geldt de strafverhoging van artikel 267 Sr. Er wordt niet gedreigd en de ambtshandeling wordt niet belemmerd.", "art. 266 en 267 Sr", "qx9a07"],
["amb", "Een boa beveelt een man opzij te gaan zodat een ambulance kan passeren. De man weigert en blijft midden op de weg staan. Welk artikel past het best?", ["Artikel 184 Sr, het niet voldoen aan een bevel.", "Artikel 180 Sr, wederspannigheid tegen een ambtenaar in functie.", "Artikel 185 Sr, opschudding veroorzaken op de openbare weg."], "De man voldoet niet aan een bevel van een bevoegde ambtenaar (art. 184 Sr). Wederspannigheid vereist verzet met geweld of bedreiging met geweld, en van opschudding is geen sprake.", "art. 184 Sr", "qx9a08"],
["vd", "Een boa houdt een fietser staande en vraagt meteen: 'Waarom reed u door rood?' Wat had de boa vóór deze vraag moeten doen?", ["De fietser meedelen dat hij niet verplicht is te antwoorden.", "Niets, bij een overtreding hoeft geen cautie te worden gegeven.", "De fietser eerst wijzen op zijn recht op een advocaat."], "Vóór het verhoor van een verdachte geef je de cautie (art. 29 lid 2 Sv), ook bij een overtreding. Recht op een advocaat speelt bij een aangehouden verdachte.", "art. 29 Sv", "qx9a09"],
["vd", "Een boa zegt tegen een verdachte: 'Als u niet antwoordt, neem ik u mee naar het bureau.' Welk recht schendt de boa?", ["Het recht om in vrijheid te verklaren.", "Het recht op consultatiebijstand door een advocaat.", "Het recht op bijstand van een tolk tijdens het verhoor."], "Een verdachte moet zijn verklaring in vrijheid kunnen afleggen (art. 29 lid 1 Sv). Druk zetten met dreigementen is niet toegestaan.", "art. 29 Sv", "qx9a10"],
["vd", "Een aangehouden meerderjarige verdachte zegt dat hij geen advocaat wil spreken. Wat moet de boa doen?", ["Hem inlichten over de gevolgen en meedelen dat hij op zijn beslissing kan terugkomen.", "Toch een advocaat bellen, want een aangehouden verdachte kan geen afstand doen van rechtsbijstand.", "De beslissing noteren en de verdachte daarna direct verhoren."], "Een meerderjarige verdachte mag afstand doen van rechtsbijstand. De boa licht hem in over de gevolgen en zegt dat hij erop kan terugkomen (art. 28a lid 2 Sv). Voor minderjarigen geldt dat niet (art. 489 Sv).", "art. 28a Sv", "qx9a11"],
["pv", "Een boa schrijft in zijn proces-verbaal van bevindingen: 'Volgens mijn collega rookte de man in de stationshal.' Wat is daarmee mis?", ["Het is geen eigen waarneming van de boa die verbaliseert.", "De zin moet in de wij-vorm, omdat er twee boa's aanwezig waren.", "Er moet in de zin bij staan dat de man de cautie heeft gekregen."], "In een proces-verbaal van bevindingen beschrijf je wat je zelf hebt waargenomen of ondervonden. Wat een collega zag, legt die collega zelf vast.", "art. 152 Sv; Toetsmatrijs Domein I, toetsterm 2.6.2", "qx9a12"],
["bev", "Een jongen van 10 jaar wordt betrapt terwijl hij een autospiegel vernielt. Wat mag de boa?", ["Hem aanhouden en ophouden voor onderzoek; vervolging volgt niet.", "Niets, kinderen jonger dan 12 jaar vallen volledig buiten het strafrecht.", "Een proces-verbaal opmaken zodat de kinderrechter een straf kan opleggen."], "Een kind onder de 12 wordt niet vervolgd (art. 486 Sv). Wel mogen opsporingsambtenaren het kind staande houden, aanhouden en ophouden voor onderzoek (art. 487 Sv), bijvoorbeeld om de ouders in te lichten.", "art. 486 en 487 Sv", "qx9a13"],
["bev", "Hoe vaak kan een Halt-afdoening ten hoogste aan dezelfde jongere worden aangeboden?", ["Twee keer.", "Eén keer.", "Drie keer."], "Een Halt-afdoening kan ten hoogste twee keer worden aangeboden. Daarna volgt een andere afdoening.", "art. 77e Sr; Halt-afdoening", "qx9a14"],
["boa", "Een boa wordt gebeld over een vechtpartij tussen vijf personen op het marktplein. Wie is volgens het inzetcriterium aan zet?", ["De politie, omdat er sprake is van geweld.", "De boa, omdat het om de openbare ruimte gaat.", "De boa, als hij als eerste ter plaatse is."], "Volgens het inzetcriterium handelt de boa leefbaarheidsfeiten af. Bij geweld of een te verwachten gevaarlijke situatie is de politie aan zet.", "Beleidsregels boa (inzetcriterium)", "qx9a15"],
["bst", "Volgens de Awb kan een burger bezwaar maken tegen een besluit van de gemeente. Welke functie van het bestuursrecht zie je hierin?", ["De waarborgfunctie.", "De instrumentele functie.", "De vergeldende functie van het strafrecht."], "Het bestuursrecht heeft een instrumentele functie (de overheid bestuurt) en een waarborgfunctie (bescherming tegen de overheid). Bezwaar en beroep zijn waarborgen.", "Toetsmatrijs Domein I, toetsterm 3.1.1", "qx9b01"],
["bst", "Een gemeente stelt regels voor terrassen vast en controleert of horeca-ondernemers zich daaraan houden. Welke functie van het bestuursrecht zie je hierin?", ["De instrumentele functie.", "De waarborgfunctie.", "De vergeldende functie van het strafrecht."], "Met regels en handhaving gebruikt de overheid het bestuursrecht als instrument om de samenleving te besturen.", "Toetsmatrijs Domein I, toetsterm 3.1.1", "qx9b02"],
["bev", "Een boa controleert als toezichthouder een standplaatsvergunning en wil de marktkoopman een paar vragen stellen. Moet hij vooraf de cautie geven?", ["Alleen als het verhoor gericht is op een bestraffende sanctie.", "Ja, zodra hij op grond van artikel 5:16 Awb om inlichtingen vraagt.", "Nee, in het bestuursrecht bestaat de cautie niet; die hoort bij het strafrecht."], "Artikel 5:10a Awb kent een cautie in het bestuursrecht, maar alleen als het verhoor is gericht op een bestraffende sanctie. Voor gewone controlevragen geldt de medewerkingsplicht.", "art. 5:10a Awb", "qx9b03"],
["bev", "Een toezichthouder wil een bedrijfspand betreden om te controleren of de regels worden nageleefd. Wat geldt volgens artikel 5:15 Awb?", ["Hij mag elke plaats betreden, behalve een woning zonder toestemming.", "Hij mag het pand alleen betreden met toestemming van de eigenaar.", "Hij mag elke plaats betreden, ook een woning zonder toestemming van de bewoner."], "Een toezichthouder mag met de benodigde apparatuur elke plaats betreden, met uitzondering van een woning zonder toestemming van de bewoner. Zo nodig met hulp van de sterke arm.", "art. 5:15 Awb", "qx9b04"],
["bst", "Een ondernemer zet zonder vergunning een reclamebord op de stoep. De gemeente geeft hem twee dagen om het weg te halen; anders haalt de gemeente het zelf weg op zijn kosten. Welke sanctie is dit?", ["Een last onder bestuursdwang.", "Een last onder dwangsom.", "Een bestuurlijke boete wegens overtreding."], "Bij bestuursdwang treedt de overheid zelf feitelijk op tegen de overtreding, op kosten van de overtreder (art. 5:21 Awb).", "art. 5:21 Awb", "qx9b05"],
["bst", "Een ondernemer moet een illegale reclamezuil binnen een week weghalen. Doet hij dat niet, dan moet hij € 250 per dag betalen tot maximaal € 2.500. Welke sanctie is dit?", ["Een last onder dwangsom.", "Een last onder bestuursdwang.", "Een bestuurlijke boete."], "Bij een last onder dwangsom moet de overtreder een geldsom betalen zolang hij de overtreding niet beëindigt (art. 5:31d Awb). De sanctie zet hem aan zelf de overtreding op te heffen.", "art. 5:31d Awb", "qx9b06"],
["bst", "Wat is het verschil tussen een herstelsanctie en een bestuurlijke boete?", ["Een herstelsanctie herstelt; een bestuurlijke boete bestraft.", "Een herstelsanctie bestraft; een bestuurlijke boete is gericht op herstel van de situatie.", "Een herstelsanctie legt de rechter op; een boete legt de officier van justitie op."], "Herstelsancties, zoals bestuursdwang en dwangsom, zijn gericht op herstel. Een bestuurlijke boete is een bestraffende sanctie (art. 5:40 Awb).", "art. 5:2 en 5:40 Awb", "qx9b07"],
["bst", "Aan wie komt een ingevorderde dwangsom in beginsel toe?", ["Aan het bestuursorgaan dat de sanctie oplegde.", "Aan de Staat der Nederlanden, via het Centraal Justitieel Incassobureau.", "Aan de burger die de overtreding heeft gemeld."], "De ingevorderde som komt in beginsel toe aan het bestuursorgaan dat de sanctie heeft opgelegd (art. 5:10 lid 1 Awb).", "art. 5:10 Awb", "qx9b08"],
["apv", "Een grasveld in een stadspark is vrij toegankelijk voor iedereen. Is dit een openbare plaats volgens artikel 1:1 Model-APV?", ["Ja, het staat open voor het publiek.", "Nee, alleen wegen en pleinen zijn openbare plaatsen volgens de APV.", "Alleen als de gemeente er een bord met de naam van het park heeft geplaatst."], "Een openbare plaats is een plaats die krachtens bestemming of vast gebruik openstaat voor het publiek. Een vrij toegankelijk park valt daaronder.", "art. 1:1 Model-APV", "qx9c01"],
["apv", "Op het marktplein gaat een groep van twintig mensen met elkaar op de vuist. Welke bepaling uit de Model-APV is van toepassing?", ["Artikel 2:1 Model-APV, samenscholing en ordeverstoring.", "Artikel 2:47 Model-APV, hinderlijk gedrag op een openbare plaats.", "Artikel 4:6 Model-APV, geluidhinder."], "Artikel 2:1 Model-APV gaat over samenscholing en wanordelijkheden op een openbare plaats. Bij een vechtpartij is ook de politie aan zet.", "art. 2:1 Model-APV", "qx9c02"],
["apv", "Een man plakt zonder toestemming posters voor een concert op een elektriciteitskast van de netbeheerder. Welke bepaling past het best?", ["Artikel 2:42 Model-APV, plakken en kladden.", "Artikel 350 Sr, vernieling van andermans goed.", "Artikel 2:1 Model-APV, ordeverstoring."], "Plakken zonder toestemming van de eigenaar valt onder artikel 2:42 Model-APV. Vernieling vereist dat iets wordt vernield of beschadigd.", "art. 2:42 Model-APV", "qx9c03"],
["apv", "In een gebied waar de burgemeester alcoholgebruik op straat heeft verboden, drinkt een volwassen man een blikje bier op een bankje. Welke bepaling overtreedt hij?", ["Artikel 2:48 Model-APV, alcohol in een aangewezen gebied.", "Artikel 45 Alcoholwet, alcohol aanwezig hebben op straat.", "Artikel 2:47 Model-APV, hinderlijk gedrag op een openbare plaats."], "Artikel 2:48 Model-APV verbiedt alcoholgebruik op straat in een aangewezen gebied. Artikel 45 Alcoholwet geldt alleen voor minderjarigen.", "art. 2:48 Model-APV", "qx9c04"],
["apv", "Een man gebruikt op straat harddrugs in een gebied dat de burgemeester daarvoor heeft aangewezen. Welke bepaling overtreedt hij?", ["Artikel 2:74a Model-APV, drugsgebruik op straat.", "Artikel 2:74 Model-APV, drugshandel op straat.", "Artikel 2 Opiumwet, het aanwezig hebben van harddrugs."], "Artikel 2:74a Model-APV gaat over drugsgebruik op straat in een aangewezen gebied. Artikel 2:74 gaat over drugshandel. Het bezit kan daarnaast onder de Opiumwet vallen.", "art. 2:74a Model-APV", "qx9c05"],
["apv", "Een bewoner zet om 23.00 uur in zijn tuin een geluidsinstallatie hard aan. De buren hebben er last van. Welke bepaling past het best?", ["Artikel 4:6 Model-APV, overige geluidhinder.", "Artikel 2:1 Model-APV, ordeverstoring.", "Artikel 2:47 Model-APV, hinderlijk gedrag op een openbare plaats."], "Artikel 4:6 Model-APV verbiedt geluidhinder voor omwonenden. Een tuin is geen openbare plaats, dus artikel 2:47 past niet.", "art. 4:6 Model-APV", "qx9c06"],
["apv", "Binnen de bebouwde kom laat een vrouw haar hond op de stoep poepen en loopt door zonder op te ruimen. Welke bepaling overtreedt zij?", ["Artikel 2:58 Model-APV, verontreiniging door honden.", "Artikel 2:57 Model-APV, loslopende honden in de bebouwde kom.", "Artikel 2:47 Model-APV, hinderlijk gedrag."], "Artikel 2:58 Model-APV verplicht de eigenaar hondenpoep direct op te ruimen en een opruimmiddel bij zich te hebben.", "art. 2:58 Model-APV", "qx9c07"],
["apv", "Binnen de bebouwde kom laat een man zijn hond los lopen op een gewoon trottoir. Er is daar geen losloopplaats. Welke bepaling overtreedt hij?", ["Artikel 2:57 Model-APV, loslopende honden.", "Artikel 2:58 Model-APV, verontreiniging door honden.", "Artikel 2:47 Model-APV, hinderlijk gedrag."], "Volgens artikel 2:57 Model-APV moet een hond binnen de bebouwde kom aangelijnd zijn, behalve op een losloopplaats.", "art. 2:57 Model-APV", "qx9c08"],
["apv", "Een straatmuzikant speelt in de winkelstraat op een plek die het college niet heeft aangewezen voor straatartiesten. Welke bepaling overtreedt hij?", ["Artikel 2:9 Model-APV, straatartiesten.", "Artikel 5:18 Model-APV, standplaatsen zonder vergunning.", "Artikel 4:6 Model-APV, geluidhinder."], "Straatartiesten mogen alleen optreden op plaatsen en tijden die het college heeft aangewezen (art. 2:9 Model-APV).", "art. 2:9 Model-APV", "qx9c09"],
["apv", "Een vereniging gaat zonder vergunning langs de deuren om geld op te halen voor een goed doel. Welke bepaling overtreedt zij?", ["Artikel 5:13 Model-APV, collecteren.", "Artikel 5:14 Model-APV, venten.", "Artikel 5:18 Model-APV, standplaatsen."], "Voor collecteren is een vergunning nodig (art. 5:13 Model-APV). Venten is het aanbieden van goederen, niet het inzamelen van geld.", "art. 5:13 Model-APV", "qx9c10"],
["apv", "In een woonwijk staat een kleine vouwwagen al vijf dagen op de openbare weg. Welke bepaling is van toepassing?", ["Artikel 5:6 Model-APV, kampeermiddelen op de weg.", "Artikel 5:5 Model-APV, defecte voertuigen langer dan drie dagen op de weg.", "Artikel 5:8 Model-APV, grote voertuigen."], "Een kampeermiddel, zoals een vouwwagen, mag niet langer dan drie dagen op de weg staan (art. 5:6 Model-APV).", "art. 5:6 Model-APV", "qx9c11"],
["apv", "Een particulier organiseert op een parkeerterrein een rommelmarkt met twintig kramen voor publiek, zonder vergunning. Welke bepaling overtreedt hij?", ["Artikel 5:23 Model-APV, snuffelmarkt.", "Artikel 5:18 Model-APV, standplaatsen.", "Artikel 5:13 Model-APV, collecteren."], "Een snuffel- of rommelmarkt voor publiek mag alleen met een vergunning (art. 5:23 Model-APV).", "art. 5:23 Model-APV", "qx9c12"],
["apv", "Een man verbrandt in zijn achtertuin snoeiafval en oude meubels. Wat geldt volgens artikel 5:34 Model-APV?", ["Het is verboden, tenzij een ontheffing of uitzondering geldt.", "Het mag, omdat het in zijn eigen tuin gebeurt en niet op een openbare plaats.", "Het is alleen verboden tussen 22.00 en 07.00 uur."], "Artikel 5:34 Model-APV verbiedt vuur stoken en afval verbranden. Uitzonderingen gelden bijvoorbeeld voor een barbecue of sfeervuur. Sinds de Omgevingswet kan de regel ook in het omgevingsplan staan.", "art. 5:34 Model-APV", "qx9c13"],
["wvw", "Een auto staat geparkeerd op een plek waar een wegsleepregeling geldt. Wie moet de kosten van het wegslepen en bewaren betalen?", ["De eigenaar of houder van het voertuig.", "De bestuurder die de auto daar heeft geparkeerd.", "De gemeente die de wegsleepregeling heeft ingesteld."], "De kosten van overbrengen en bewaren komen voor rekening van de eigenaar of houder van het voertuig (art. 173 WVW 1994).", "art. 170 tot en met 174 WVW 1994", "qx9d01"],
["wvw", "Op wiens last kan een fout geparkeerd voertuig worden overgebracht en bewaard?", ["Op last van een aangewezen ambtenaar.", "Alleen op last van de officier van justitie in het arrondissement.", "Op last van het sleepbedrijf, als de auto in de weg staat."], "Het overbrengen en bewaren van voertuigen gebeurt op last van een bevoegde, aangewezen ambtenaar (art. 170 WVW 1994).", "art. 170 WVW 1994", "qx9d02"],
["wvw", "Een auto stopt langs een gele doorgetrokken streep om een passagier te laten uitstappen. Is dat toegestaan?", ["Nee, langs die streep is ook stilstaan verboden.", "Ja, kort stilstaan om in of uit te stappen mag langs elke gele streep.", "Ja, een gele doorgetrokken streep geeft alleen een parkeerverbod."], "Een gele doorgetrokken streep betekent een verbod om stil te staan. Een gele onderbroken streep betekent een parkeerverbod (art. 24 RVV 1990).", "art. 24 RVV 1990", "qx9d03"],
["wvw", "Binnen de bebouwde kom staat een bestelbus drie meter van een kruispunt stil om pakketten te laden en te lossen. Is dit in strijd met het parkeerverbod bij een kruispunt?", ["Nee, laden en lossen geldt niet als parkeren.", "Ja, binnen 5 meter van een kruispunt mag een voertuig niet stilstaan.", "Ja, laden en lossen mag alleen op een aangewezen laad- en losplaats."], "Parkeren is stilstaan langer dan nodig voor in- en uitstappen of laden en lossen (art. 1 RVV 1990). Het verbod binnen 5 meter van een kruispunt (art. 24) is een parkeerverbod, geen stopverbod.", "art. 1 en 24 RVV 1990", "qx9d04"],
["wvw", "Onder een bord E1 (parkeerverbod) laat een bestuurder zijn auto tien minuten staan terwijl hij een pizza afhaalt. Is dit een overtreding?", ["Ja, dit is parkeren onder een parkeerverbod.", "Nee, onder een bord E1 mag je tot een kwartier stilstaan.", "Nee, zolang de bestuurder in de buurt van zijn auto blijft, is het geen parkeren."], "Wie langer stilstaat dan nodig voor in- en uitstappen of laden en lossen, parkeert. Onder bord E1 is dat verboden.", "art. 1 RVV 1990; bord E1", "qx9d05"],
["wvw", "Bij een evenement geeft een verkeersregelaar een automobilist een stopteken, terwijl het verkeerslicht voor hem op groen staat. Wat moet de automobilist doen?", ["Stoppen, want de aanwijzing gaat voor op het verkeerslicht.", "Doorrijden, want een verkeerslicht gaat voor op een aanwijzing van een verkeersregelaar.", "Zelf beslissen, omdat een verkeersregelaar geen ambtenaar is."], "Weggebruikers moeten aanwijzingen van bevoegde personen opvolgen (art. 82 RVV 1990). Deze aanwijzingen gaan voor op verkeerslichten, verkeerstekens en regels (art. 63 RVV 1990).", "art. 82 en 63 RVV 1990", "qx9d06"],
["wvw", "Wie mag volgens artikel 82 RVV 1990 aanwijzingen geven ter regeling van het verkeer?", ["Bevoegde personen, zoals politie en verkeersregelaars.", "Iedere weggebruiker die bij een ongeval of een opstopping het verkeer regelt.", "Alleen politieambtenaren in uniform."], "Alleen bevoegde personen mogen het verkeer regelen. Een omstander die bij een ongeval gebaren maakt, is niet bevoegd.", "art. 82 RVV 1990", "qx9d07"],
["bijz", "Een jongen van 16 jaar staat op straat met een dichte fles wijn in zijn hand. Overtreedt hij artikel 45 Alcoholwet?", ["Ja, hij heeft op straat alcohol bij zich.", "Nee, alleen het drinken van alcohol is voor minderjarigen op straat verboden.", "Nee, het verbod geldt alleen voor jongeren onder de 16 jaar."], "Artikel 45 Alcoholwet verbiedt minderjarigen om op publiek toegankelijke plaatsen alcohol aanwezig te hebben. Dat de fles dicht is, maakt niet uit.", "art. 45 Alcoholwet", "qx9e01"],
["bijz", "Een 19-jarige koopt bier en geeft op het strand een blikje aan zijn vriend van 16. Wie is strafbaar volgens de Alcoholwet?", ["Beiden.", "Alleen de 19-jarige, voor het doorgeven van alcohol aan een minderjarige.", "Alleen de 16-jarige, voor het aanwezig hebben van alcohol."], "De meerderjarige overtreedt artikel 45a (wederverstrekking), de minderjarige artikel 45 (aanwezig hebben op een publiek toegankelijke plaats).", "art. 45 en 45a Alcoholwet", "qx9e02"],
["bijz", "Een supermarkt is op een dinsdag om 22.30 uur open voor publiek. De gemeente heeft geen vrijstelling of ontheffing gegeven. Mag dat?", ["Nee, na 22.00 uur moet een winkel dicht zijn.", "Ja, op werkdagen gelden geen wettelijke openingstijden voor winkels.", "Ja, op werkdagen mag een winkel open tot middernacht."], "Volgens artikel 2 Winkeltijdenwet zijn winkels op werkdagen dicht vóór 06.00 en na 22.00 uur en op zon- en feestdagen. De gemeenteraad kan vrijstelling of ontheffing regelen (art. 3).", "art. 2 en 3 Winkeltijdenwet", "qx9e03"],
["bijz", "Wat is volgens artikel 1 Winkeltijdenwet een winkel?", ["Een publiek toegankelijke ruimte waar goederen aan particulieren worden verkocht.", "Een plaats waar diensten aan particulieren worden verleend, zoals een kapper of een nagelstudio.", "Een ruimte waarvoor de gemeente een exploitatievergunning heeft verleend."], "De Winkeltijdenwet gaat over de verkoop van goederen aan particulieren in een besloten ruimte. Dienstverlening, zoals een kapper, valt er niet onder.", "art. 1 Winkeltijdenwet", "qx9e04"],
["bijz", "Een boa die bevoegd is voor economische delicten, vermoedt dat een marktkoopman illegaal vuurwerk verkoopt. Mag hij de administratie van de koopman inzien?", ["Ja, hij mag inzage vorderen van gegevens en bescheiden.", "Nee, alleen met een machtiging van de rechter-commissaris.", "Alleen als de koopman daar zelf mee instemt."], "Bij economische delicten mag de opsporingsambtenaar inzage vorderen van alle gegevens en bescheiden (art. 19 WED).", "art. 19 WED", "qx9e05"],
["bijz", "Mag een opsporingsambtenaar bij een vermoedelijk economisch delict een bestelbus en de lading onderzoeken?", ["Ja, hij mag vervoermiddelen en de lading onderzoeken.", "Nee, alleen een vrachtwagen met een gewicht boven de 3.500 kilogram.", "Alleen met een schriftelijk bevel van de officier van justitie."], "De WED geeft de bevoegdheid om vervoermiddelen en hun lading te onderzoeken (art. 23 WED).", "art. 23 WED", "qx9e06"],
["bijz", "Een ondernemer weigert bij een controle op een economisch delict zijn opslagruimte te openen. Wat geldt volgens artikel 24a WED?", ["Hij moet de redelijkerwijs gevorderde medewerking verlenen.", "Medewerking is vrijwillig, omdat de ondernemer verdachte is en zichzelf niet hoeft te belasten.", "Medewerking kan alleen worden gevorderd door de officier van justitie."], "Artikel 24a WED verplicht iedereen om alle medewerking te verlenen die de opsporingsambtenaar redelijkerwijs kan vorderen bij zijn bevoegdheden.", "art. 24a WED", "qx9e07"],
["bijz", "Een bedrijf stort puin en oude verfblikken in een greppel langs een weg. Onder welke regeling valt dit?", ["Het Besluit activiteiten leefomgeving (storten van bedrijfsafval).", "Artikel 10.2 Wet milieubeheer, het dumpen van huishoudelijk afval buiten een inzamelpunt.", "Artikel 2:42 Model-APV, plakken en kladden."], "Sinds de Omgevingswet vallen het storten van bedrijfsafval en gevaarlijke stoffen onder het Besluit activiteiten leefomgeving. Artikel 10.2 Wm gaat alleen nog over huishoudelijk afval.", "Besluit activiteiten leefomgeving (§ 3.2.14)", "qx9e08"],
["bijz", "Na werkzaamheden aan een straat laat een aannemer bouwafval en materiaal achter rond de werkplek. Wat geldt volgens de bruidsschat van het omgevingsplan?", ["Afval van de activiteit moet rond de locatie worden opgeruimd.", "De gemeente ruimt het afval op en stuurt de rekening naar de bewoners van de straat.", "Het mag blijven liggen tot bewoners een klacht indienen."], "De bruidsschat in het omgevingsplan bepaalt dat afval en materialen die van een activiteit afkomstig zijn, rond de locatie moeten worden opgeruimd (art. 22.53).", "Omgevingsplan (bruidsschat), art. 22.53", "qx9e09"],
["bijz", "Een visser laat een VISpas zien die vorig jaar is verlopen. Heeft hij een geldige schriftelijke toestemming om te vissen?", ["Nee, de toestemming moet geldig zijn op het moment van vissen.", "Ja, een VISpas blijft geldig zolang de visser lid is van een vereniging.", "Ja, als hij de pas binnen een week verlengt."], "Wie vist, moet een geldige schriftelijke toestemming van de rechthebbende bij zich hebben (art. 23 Visserijwet 1963). Een verlopen pas is geen geldige toestemming.", "art. 23 Visserijwet 1963", "qx9e10"],
["bijz", "Van wie moet een visser volgens de Visserijwet 1963 schriftelijke toestemming hebben?", ["Van de rechthebbende op het visrecht.", "Van de burgemeester van de gemeente waar hij vist.", "Van de provincie of het waterschap waarin het water ligt."], "De schriftelijke toestemming komt van degene aan wie het visrecht toekomt, bijvoorbeeld via een VISpas van een hengelsportvereniging.", "art. 23 Visserijwet 1963", "qx9e11"],
["bijz", "Een snackbar zet zijn bedrijfsafval in de grijze container voor huishoudelijk afval. Wie is strafbaar?", ["De ondernemer van de snackbar.", "De gemeente, omdat zij de container voor huishoudelijk afval heeft geplaatst.", "De inzamelaar die de container leegt."], "Bedrijfsafval mag niet als huishoudelijk afval worden aangeboden. Strafbaar is de ondernemer die zich van het afval ontdoet (art. 10.37 Wm; afvalstoffenverordening).", "art. 10.37 Wm", "qx9e12"],
["wp", "Een man staat zonder vervoerbewijs op een perron achter de OV-poortjes om iemand uit te zwaaien. De vervoerder heeft dit gebied duidelijk aangemerkt als voorziening waarvoor een geldig vervoerbewijs nodig is. Overtreedt hij artikel 70 Wp2000?", ["Ja, ook voor die voorziening is een vervoerbewijs nodig.", "Nee, alleen in het voertuig zelf is een geldig vervoerbewijs verplicht volgens de wet.", "Nee, zolang hij niet in de trein stapt."], "Artikel 70 Wp2000 verbiedt gebruik te maken van het openbaar vervoer en van door de vervoerder duidelijk kenbaar gemaakte voorzieningen zonder geldig vervoerbewijs.", "art. 70 Wp2000", "qx9f01"],
["wp", "Bij een controle houdt een reiziger zijn hand voor de kaartlezer van de boa, zodat zijn kaart niet kan worden gescand. Welk verbod overtreedt hij?", ["Het belemmeren van de controle (artikel 71 Wp2000).", "Reizen zonder geldig vervoerbewijs (artikel 70 Wp2000).", "Het verstoren van de orde, rust en veiligheid in het openbaar vervoer (artikel 72 Wp2000)."], "Artikel 71 Wp2000 verbiedt het belemmeren of verhinderen van de controle van vervoerbewijzen, naast het misbruiken of bewerken van een vervoerbewijs.", "art. 71 Wp2000", "qx9f02"],
["wp", "In de stationshal hangt een bord met een doorgestreept skateboard. Een jongen skatet toch door de hal. Welke bepaling overtreedt hij?", ["Artikel 73 Wp2000, want het bord geldt als aanwijzing.", "Artikel 72 Wp2000, want hij verstoort de orde en rust in het station.", "Artikel 70 Wp2000, want hij gebruikt een voorziening zonder vervoerbewijs."], "Aanduidingen in beeld en geschrift worden gelijkgesteld met aanwijzingen (art. 53 Bp2000). Wie het bord negeert, volgt een aanwijzing niet op (art. 73 Wp2000).", "art. 73 Wp2000; art. 53 Bp2000", "qx9f03"],
["wp", "Een reiziger blokkeert met zijn koffers het gangpad van een volle trein. Hij weigert ze te verplaatsen nadat de boa dat namens de vervoerder vraagt. Welke bepaling past het best?", ["Artikel 73 Wp2000, het niet opvolgen van een aanwijzing.", "Artikel 184 Sr, het niet voldoen aan een bevel van een ambtenaar in functie.", "Artikel 71 Wp2000, het belemmeren van de controle."], "In het openbaar vervoer is artikel 73 Wp2000 de specifieke bepaling voor het niet opvolgen van aanwijzingen over orde, rust, veiligheid of bedrijfsgang.", "art. 73 Wp2000", "qx9f04"],
["wp", "Een reiziger zonder geldig vervoerbewijs weigert zijn naam en adres op te geven aan de boa. Wat geldt?", ["Hij moet zijn gegevens op eerste vordering opgeven.", "Hij hoeft niets op te geven zolang hij de boete direct ter plaatse betaalt.", "Alleen een politieambtenaar mag deze gegevens van hem vragen."], "Volgens artikel 92 Wp2000 moet een reiziger op eerste vordering zijn naam, adres en geboortedatum opgeven. Niet meewerken leidt tot strafverzwaring (art. 101 lid 2 Wp2000).", "art. 92 Wp2000", "qx9f05"],
["wp", "Een reiziger heeft meerdere keren de orde verstoord in de trein. Wat kan de vervoerder volgens artikel 98 Wp2000 doen?", ["Hem onder voorwaarden de toegang ontzeggen.", "Hem een bestuurlijke boete opleggen naast het boetebedrag voor het vervoerbewijs.", "Hem een gevangenisstraf opleggen."], "Artikel 98 Wp2000 maakt het mogelijk om onder voorwaarden een vervoerbewijs in te trekken en de toegang tot het openbaar vervoer of een station te ontzeggen.", "art. 98 Wp2000", "qx9f06"],
["wp", "Een man met een opgelegde ontzegging van de toegang tot een station komt toch het station in. Wat geldt?", ["Hij overtreedt de ontzegging.", "Dat mag, zolang hij een geldig vervoerbewijs bij zich heeft.", "Alleen de rechter kan hem dan nog uit het station wegsturen."], "Het is verboden in strijd te handelen met een opgelegde ontzegging (art. 98 lid 4 Wp2000).", "art. 98 Wp2000", "qx9f07"],
["wp", "Wanneer vervalt het recht op strafvervolging van een reiziger die zonder geldig vervoerbewijs reisde?", ["Als hij vervoerprijs en boete op tijd betaalt.", "Als hij na de controle alsnog een kaartje koopt bij de automaat.", "Na één jaar, als hij in die tijd geen nieuwe overtreding begaat."], "Betaalt de reiziger tijdig de vervoerprijs en het boetebedrag, dan vervalt het recht op strafvervolging (art. 48 lid 7 Bp2000; art. 102 Wp2000).", "art. 102 Wp2000; art. 48 Bp2000", "qx9f08"],
["bp", "Een moeder reist met haar dochter van drie jaar in de trein. Heeft het kind een eigen vervoerbewijs nodig?", ["Nee, een begeleid kind onder de vier reist vrij.", "Ja, ieder kind heeft een eigen vervoerbewijs nodig, ook als het op schoot zit.", "Nee, kinderen tot twaalf jaar reizen gratis."], "Volgens artikel 45 lid 1 sub a Bp2000 geldt vrij vervoer voor kinderen jonger dan vier jaar die worden begeleid.", "art. 45 Bp2000", "qx9g01"],
["bp", "Een blinde reiziger neemt zijn geleidehond mee in de trein. Moet voor de hond een vervoerprijs worden betaald?", ["Nee, voor een geleidehond hoeft niet te worden betaald.", "Ja, voor elke hond is een dagkaart nodig, ook voor een hulphond of geleidehond.", "Alleen buiten de spitsuren is de hond gratis."], "Artikel 46 lid 1 Bp2000: voor handbagage en voor een hond die een gehandicapte begeleidt, is geen vervoerprijs verschuldigd.", "art. 46 Bp2000", "qx9g02"],
["bp", "Een reiziger met een OV-chipkaart wil met de trein. Bij de ingang van het station staan incheckpalen. Wanneer moet hij inchecken?", ["Voordat hij het station of het voertuig betreedt.", "Zo snel mogelijk na het instappen, bij de conducteur.", "Pas als er een controle plaatsvindt."], "Volgens artikel 47 lid 1 sub a Bp2000 voorziet de reiziger zich van een geldig vervoerbewijs vóór het betreden van het voertuig, de halte of het station waar dat kan.", "art. 47 Bp2000", "qx9g03"],
["bp", "Een reiziger zonder geldig vervoerbewijs kan bij de controle niet direct betalen. Wat geldt volgens artikel 48 Bp2000?", ["Hij krijgt een bewijs en kan binnen veertien dagen betalen.", "Hij moet bij het volgende station uitstappen en krijgt geen boete.", "Hij krijgt meteen een proces-verbaal; uitstel van betaling is niet mogelijk."], "Kan de reiziger niet direct betalen, dan krijgt hij een bewijs en veertien dagen uitstel (art. 48 lid 5 Bp2000). Betaalt hij niet, dan volgt een nieuwe termijn met een verhoging.", "art. 48 Bp2000", "qx9g04"],
["bp", "Wat betaalt een reiziger die bij een controle geen geldig vervoerbewijs heeft?", ["Het boetebedrag en de vervoerprijs.", "Alleen het boetebedrag, zonder de prijs van de reis.", "Alleen de vervoerprijs."], "Volgens artikel 48 lid 3 Bp2000 betaalt de reiziger het boetebedrag samen met de vervoerprijs.", "art. 48 Bp2000", "qx9g05"],
["bp", "Bij de ingang van een station hangt een pictogram met een doorgestreepte fiets. Iemand fietst door de stationshal. Geldt het pictogram als aanwijzing?", ["Ja, een pictogram geldt als aanwijzing.", "Nee, alleen een mondelinge aanwijzing van personeel van de vervoerder telt.", "Nee, alleen als er op dat moment een boa bij staat."], "Artikel 53 Bp2000 stelt aanduidingen in beeld en geschrift gelijk met aanwijzingen van de vervoerder.", "art. 53 Bp2000", "qx9g06"],
["ovt", "Een toezichthouder in de trein vraagt een reiziger om inlichtingen. Moet de reiziger meewerken?", ["Ja, hij moet redelijkerwijs meewerken.", "Nee, medewerking aan een toezichthouder is vrijwillig, behalve bij een strafbaar feit.", "Alleen als de toezichthouder in uniform is."], "Artikel 5:20 Awb verplicht iedereen om binnen een redelijke termijn alle medewerking te verlenen die de toezichthouder redelijkerwijs kan vorderen.", "art. 5:20 Awb", "qx9h01"],
["ovt", "Wat bepaalt artikel 5:13 Awb over de bevoegdheden van een toezichthouder?", ["Alleen voor zover dat redelijkerwijs nodig is.", "Hij mag ze onbeperkt gebruiken zolang hij in functie is en zich kan legitimeren.", "Hij mag ze alleen gebruiken met toestemming van zijn leidinggevende."], "Artikel 5:13 Awb bevat het evenredigheidsbeginsel voor toezichthouders: bevoegdheden alleen gebruiken voor zover redelijkerwijs nodig.", "art. 5:13 Awb", "qx9h02"],
["ovt", "Welke Awb-bevoegdheid heeft een toezichthouder in het openbaar vervoer volgens artikel 90 Wp2000 niet?", ["Het onderzoeken van zaken en nemen van monsters.", "Het vorderen van inlichtingen van reizigers en personeel.", "Het vorderen van inzage van een identiteitsbewijs."], "Artikel 91 Wp2000 verklaart de Awb-bevoegdheden van toepassing, maar artikel 90 sluit het onderzoeken van zaken en het nemen van monsters uit.", "art. 90 en 91 Wp2000", "qx9h03"],
["amb", "Een man verzet zich met geweld tegen zijn aanhouding door een boa. De boa breekt daarbij zijn pols. Welk artikel uit het Wetboek van Strafrecht past het best?", ["Artikel 181 Sr, wederspannigheid met letsel.", "Artikel 180 Sr, wederspannigheid tegen een ambtenaar in functie.", "Artikel 300 Sr, eenvoudige mishandeling."], "Heeft wederspannigheid lichamelijk letsel tot gevolg, dan geldt artikel 181 Sr, met een hogere straf naarmate het letsel ernstiger is.", "art. 181 Sr", "qx9i01"],
["amb", "Drie jongeren verzetten zich samen met geweld tegen een boa die hen wil aanhouden. De boa raakt gewond. Welk artikel past het best?", ["Artikel 182 Sr, met verenigde krachten.", "Artikel 181 Sr, wederspannigheid met letsel door één dader.", "Artikel 141 Sr, openlijke geweldpleging."], "Artikel 182 Sr gaat over ambtsdwang en wederspannigheid door twee of meer personen met verenigde krachten.", "art. 182 Sr", "qx9i02"],
["amb", "Na een controle stuurt een man de boa een bericht: 'Ik weet waar je woont, ik steek je huis in brand.' Welk artikel is van toepassing?", ["Artikel 285 Sr, bedreiging van een ambtenaar.", "Artikel 266 Sr, belediging van een ambtenaar in de uitoefening van zijn functie.", "Artikel 284 Sr, dwang."], "Bedreiging met brandstichting is strafbaar, ook schriftelijk (art. 285 lid 1 en 2 Sr). Gebeurt het tegen een ambtenaar ter zake van zijn functie, dan geldt strafverhoging (lid 5).", "art. 285 Sr", "qx9i03"],
["amb", "Een man probeert een boa te slaan, maar mist. Is hij strafbaar voor poging tot mishandeling?", ["Nee, poging tot eenvoudige mishandeling is niet strafbaar.", "Ja, poging tot mishandeling van een ambtenaar is strafbaar.", "Ja, maar alleen als de boa daarvan schrok."], "Volgens artikel 300 lid 5 Sr is poging tot eenvoudige mishandeling niet strafbaar. Het gedrag kan wel een ander feit opleveren, zoals bedreiging.", "art. 300 Sr", "qx9i04"],
["amb", "Een man slaat een boa tijdens een controle. Wat geldt voor de strafmaat?", ["De straf kan met een derde worden verhoogd.", "De straf is gelijk aan die voor iedere andere eenvoudige mishandeling zonder letsel.", "Het is een overtreding, omdat er geen letsel is."], "Bij mishandeling van een ambtenaar in de rechtmatige uitoefening van zijn bediening kan de gevangenisstraf met een derde worden verhoogd (art. 304 Sr).", "art. 300 en 304 Sr", "qx9i05"],
["vrij", "Een staande gehouden verdachte geeft de boa een valse naam en geboortedatum op. Welk artikel is van toepassing?", ["Artikel 435 sub 4 Sr, valse persoonsgegevens.", "Artikel 231 Sr, het gebruiken van een vals of vervalst identiteitsbewijs.", "Artikel 447e Sr, het niet tonen van een identiteitsbewijs."], "Het opgeven van een valse naam, adres of geboortedatum aan een ambtenaar is strafbaar volgens artikel 435 sub 4 Sr.", "art. 435 Sr", "qx9j01"],
["vrij", "Een man van 25 jaar heeft geen identiteitsbewijs bij zich als de boa daar bevoegd om vraagt. Welk artikel is van toepassing?", ["Artikel 447e Sr, het niet voldoen aan de toonplicht.", "Artikel 435 sub 4 Sr, het opgeven van valse gegevens.", "Artikel 184 Sr, het niet voldoen aan een vordering."], "Voor het niet tonen van een identiteitsbewijs bij een bevoegde vordering is artikel 447e Sr de specifieke bepaling (toonplicht, art. 2 Wet op de identificatieplicht).", "art. 447e Sr; art. 2 Wet op de identificatieplicht", "qx9j02"],
["vrij", "Een winkelmedewerker betrapt een man op het bekladden van een etalageruit. Twee minuten later komt de boa aanlopen. Is er nog sprake van ontdekking op heterdaad?", ["Ja, het feit is terstond nadat het is begaan ontdekt.", "Nee, de boa heeft het feit niet zelf gezien.", "Nee, na het begaan van het feit is er geen heterdaad meer."], "Heterdaad hangt af van het moment van ontdekking, niet van wie het ontdekte. Hier is het feit ontdekt tijdens het begaan (art. 128 lid 1 Sv), en de boa kan de verdachte direct aanhouden.", "art. 128 Sv", "qx9j03"],
["vrij", "Wat moet een boa doen nadat hij een verdachte op heterdaad heeft aangehouden?", ["Hem zo snel mogelijk voorgeleiden.", "Hem na zes uur vrijlaten als hij een verklaring heeft afgelegd.", "Hem direct naar de rechter-commissaris brengen."], "Na een aanhouding geleidt de opsporingsambtenaar de verdachte zo spoedig mogelijk voor aan de (hulp)officier van justitie (art. 53 lid 2 Sv).", "art. 53 Sv", "qx9j04"]
];

<div class="tbl"><table><caption class="eyebrow">Klik op een leerling voor de foute vragen en examens</caption><thead><tr>${KOL.map(([c,n,cl])=>`<th class="${cl||""}" aria-sort="${key===c?(dir>0?"ascending":"descending"):"none"}"><button data-sort="${c}">${n}${key===c?(dir>0?" ▲":" ▼"):""}</button></th>`).join("")}</tr></thead><tbody>
${rows.map(x=>`<tr class="klik" data-l="${esc(x.id)}"><td><button class="naam" data-l="${esc(x.id)}">${esc(x.naam)}</button></td><td>${wanneer(x.laatst)}</td><td class="r num">${x.gemaakt}</td>
<td class="r num">${x.pog?x.goed+"%":"–"}</td><td class="r num">${x.fout.length}</td><td class="r num">${x.beste===null?"–":x.beste+"%"}</td><td class="r num">${casusTxt(x.casusBeste)}</td><td>${status(x)}</td></tr>`).join("")||`<tr><td colspan="8">Geen leerling gevonden.</td></tr>`}
</tbody></table></div>`}
function modSelect(id,v){return `<select id="${id}" aria-label="Kies een module"><option value="">Alle modules</option>${MODS.map(m=>`<option value="${m}"${v===m?" selected":""}>${esc(MODNAAM[m])}</option>`).join("")}</select>`}
function vraagKaart(p,i){const q=p.q;return `<details class="vraag"><summary><span class="rang num">${i+1}</span><span><span class="vt">${esc(q.q)}</span>
<span class="vm"><span>${esc(MODKORT[q.m])} · ${esc(q.cat)}</span><span class="num">${p.gemaakt} leerlingen maakten hem</span></span></span>
<span class="score"><b class="num">${p.perc}%</b><br><span class="small num">${p.fout} van ${p.gemaakt} fout</span></span></summary>
<div class="body"><p class="juist">Juist: ${esc(q.a)}</p><p>${esc(q.e)}</p>${q.r?`<span class="chip">${esc(q.r)}</span>`:""}
<p class="small"><b>Nu nog fout bij:</b> ${p.wie.map(esc).join(", ")}</p></div></details>`}
function foutPaneel(k){const lijst=meestFout(k,st.mod);const ow=onderwerpen(k,st.mod);const max=Math.max(1,...ow.map(o=>o.perc));
return `<div class="filters">${modSelect("modFilter",st.mod)}<span class="small">Vragen die minstens 3 leerlingen maakten. Het percentage is het deel van die leerlingen bij wie de laatste poging fout was.</span></div>
<div class="kop"><h2>Top 10 vragen</h2>${lijst.length?`<button class="btn sm" data-kopieer="klas">Kopieer als lesopdracht</button>`:""}</div>
<div id="kopieMelding" role="status" class="small"></div>
${lijst.length?lijst.map(vraagKaart).join(""):`<div class="leeg">Nog te weinig gemaakte vragen${st.mod?" in deze module":""}. Een vraag telt mee als minstens 3 leerlingen hem maakten.</div>`}
<h2>Onderwerpen met de meeste fouten</h2>
${ow.length?`<div class="bars">${ow.map(o=>`<div class="barrow"><span>${esc(o.cat)} <span class="small">· ${esc(MODKORT[o.m])}</span></span><span class="bt" aria-hidden="true"><b style="width:${Math.round(100*o.perc/max)}%"></b></span><span class="bv">${o.perc}% fout</span></div>`).join("")}</div>`:`<div class="leeg">Nog te weinig antwoorden.</div>`}`}
function leerlingView(k,x){const fout=x.fout.filter(q=>!st.lmod||q.m===st.lmod);const groepen={};fout.forEach(q=>(groepen[q.c]||(groepen[q.c]={cat:q.cat,m:q.m,qs:[]})).qs.push(q));
main.innerHTML=`<a class="linkbtn terug" href="#klas-${esc(k.klas.id)}">← Terug naar ${esc(k.klas.naam)}</a>
<div class="kop"><div class="stack"><span class="eyebrow">Leerling · ${esc(k.klas.naam)}</span><h1>${esc(x.naam)}</h1><span class="small">${esc(x.email)} · laatst actief ${wanneer(x.laatst)}</span></div><div>${status(x)}</div></div>
<div class="tiles">
<div class="tile"><span class="v num">${x.gemaakt}</span><span class="l">vragen gemaakt</span></div>
<div class="tile"><span class="v num">${x.pog?x.goed+"%":"–"}</span><span class="l">goed beantwoord</span></div>
<div class="tile"><span class="v num">${x.fout.length}</span><span class="l">vragen nu nog fout</span></div>
<div class="tile"><span class="v num">${x.week}</span><span class="l">vragen geoefend deze week</span></div>
</div>
<div class="twee">
<div class="kaart"><h2>Voortgang per module</h2>
${MODS.map(m=>{const v=pct(x.perMod[m].beheerst,PERMOD[m]);return `<div class="modrow"><span>${esc(MODNAAM[m])}</span><span class="meter" aria-hidden="true"><i><b style="width:${v}%"></b></i></span><span class="num small" style="text-align:right">${v}%</span></div>`}).join("")}
<p class="small">Deel van alle vragen in de module dat de leerling bij de laatste poging goed had.</p></div>
<div class="kaart"><h2>Oefenexamens, casussen en gesprekken</h2>
${x.ex.length||x.casus.length?[...x.ex.map(e=>`<div class="examrow"><span>${esc(e.naam)} <span class="small">· ${datum(e.d)}</span></span><span class="pill ${e.p?"ok":"bad"} num">${e.score}%</span></div>`),
...x.casus.map(c=>`<div class="examrow"><span>${c.soort} ${esc(c.naam)} <span class="small">· ${c.soort==="Melding"?"Melding":"Bejegening"}${c.d?" · "+datum(c.d):""}</span></span><span class="pill ${c.o==="Onvoldoende"?"bad":"ok"} num">${c.p}/${c.m}</span></div>`)].join(""):`<p class="small">Nog geen oefenexamens, casussen of gesprekken.</p>`}</div>
</div>
<div class="kop"><h2>Vragen die nu nog fout zijn</h2><div class="filters">${modSelect("lmodFilter",st.lmod)}${fout.length?`<button class="btn sm" data-kopieer="leerling">Kopieer als lesopdracht</button>`:""}</div></div>
<div id="kopieMelding" role="status" class="small"></div>
${fout.length?Object.values(groepen).sort((a,b)=>b.qs.length-a.qs.length).map(g=>`<div class="groep"><h3>${esc(g.cat)} <span class="small">${esc(MODKORT[g.m])} · ${g.qs.length} ${g.qs.length===1?"vraag":"vragen"}</span></h3>
${g.qs.map(q=>{const v=x.s[q.id];return `<details class="vraag"><summary><span class="rang">•</span><span class="vt">${esc(q.q)}</span><span class="small num">${v[1]} van ${v[0]} goed</span></summary>
<div class="body"><p class="juist">Juist: ${esc(q.a)}</p><p>${esc(q.e)}</p>${q.r?`<span class="chip">${esc(q.r)}</span>`:""}</div></details>`}).join("")}</div>`).join(""):`<div class="leeg">Geen openstaande foute vragen${st.lmod?" in deze module":""}.</div>`}`;
main.focus({preventScroll:true})}
function opdrachtTekst(){const k=D.data[st.klas];
if(st.leerling){const x=k.ls.find(l=>l.id===st.leerling);const f=x.fout.filter(q=>!st.lmod||q.m===st.lmod);
return `Lesopdracht voor ${x.naam}\nHerhaal deze vragen in Boa Paraat:\n\n`+f.map((q,i)=>`${i+1}. ${q.q}\n   (${MODKORT[q.m]} · ${q.cat}${q.r?" · "+q.r:""})`).join("\n")}
return `Lesopdracht voor ${k.klas.naam}\nDeze vragen gingen in de klas het vaakst fout. Bespreek ze en oefen ze opnieuw:\n\n`+meestFout(k,st.mod).map((p,i)=>`${i+1}. ${p.q.q}\n   Juist: ${p.q.a} (${MODKORT[p.q.m]} · ${p.q.cat})`).join("\n")}
function codesBlok(r){return `<div class="kaart"><h2>Codes voor ${esc(r.naam)}</h2>
<p class="melding info"><b>Bewaar deze codes nu.</b> Je ziet ze maar één keer: de database bewaart alleen een controlegetal.</p>
${r.docent?`<h3>Docentcode</h3><div class="codes"><code class="doc">${esc(r.docent)}</code></div>`:""}
${r.leerlingen&&r.leerlingen.length?`<h3>${r.leerlingen.length} leerlingcodes</h3><div class="codes">${r.leerlingen.map(c=>`<code>${esc(c)}</code>`).join("")}</div>`:""}
<div class="row"><button class="btn" data-kopieer="codes">Kopieer alle codes</button></div><div id="kopieMelding" role="status" class="small"></div></div>`}
function beheerView(){
main.innerHTML=`<div class="kop"><div class="stack"><span class="eyebrow">Beheer</span><h1>Klassen en codes</h1></div></div>
${st.nieuwKlas?codesBlok(st.nieuwKlas):""}
<form class="kaart" id="klasForm" novalidate><h2>Nieuwe klas</h2>
<div class="veld"><label for="kNaam">Naam van de klas</label><input type="text" id="kNaam" maxlength="80" placeholder="BOA Basis · groep A"></div>
<div class="veld"><label for="kStart">Gestart (optioneel)</label><input type="text" id="kStart" maxlength="40" placeholder="nov 2026"></div>
<div class="veld"><label for="kAantal">Aantal leerlingcodes</label><input type="number" id="kAantal" min="1" max="60" value="20" inputmode="numeric"></div>
<p class="small">Je krijgt de leerlingcodes en één docentcode.</p>
<div><button class="btn hi" type="submit">Klas aanmaken</button></div><div id="klasMelding" role="status"></div></form>
<h2>Alle klassen</h2><div id="beheerLijst" class="lijst"><div class="leeg" role="status">Laden…</div></div>`;
rpc("beheer_klassen").then(ls=>{const el=document.getElementById("beheerLijst");if(!el)return;
el.innerHTML=(ls||[]).map(k=>`<div class="kaart"><div class="kop"><div class="stack"><b>${esc(k.naam)}</b><span class="small num">${k.start?"gestart "+esc(k.start)+" · ":""}${k.leerlingcodes_gebruikt} van ${k.leerlingcodes} leerlingcodes gebruikt · docent: ${k.docenten.length?k.docenten.map(esc).join(", "):k.docentcode_open?"code nog niet gebruikt":"geen"}</span></div></div>
<div class="row"><button class="btn sm" data-act="codes-erbij" data-id="${esc(k.id)}" data-naam="${esc(k.naam)}" data-rol="leerling">5 leerlingcodes erbij</button><button class="btn sm" data-act="codes-erbij" data-id="${esc(k.id)}" data-naam="${esc(k.naam)}" data-rol="docent">Nieuwe docentcode</button>
${st.weg===k.id?`</div><div class="confirm"><span><b>${esc(k.naam)} verwijderen?</b> Leerlingen en docenten worden uit de klas gehaald. Hun eigen voortgang blijft bewaard.</span><div class="row"><button class="btn danger sm" data-act="klas-weg-ja" data-id="${esc(k.id)}">Verwijderen</button><button class="btn sm" data-act="klas-weg-nee">Annuleren</button></div></div>`
:`<button class="btn sm" data-act="klas-weg" data-id="${esc(k.id)}">Verwijderen</button></div>`}</div>`).join("")||`<div class="leeg">Nog geen klassen.</div>`},
()=>{const el=document.getElementById("beheerLijst");if(el)el.innerHTML=`<p class="melding fout">De klassen konden niet worden geladen.</p>`})}
async function route(){const h=location.hash.slice(1);st.leerling="";
if(h.startsWith("leerling-")){st.klas=h.slice(9,45);st.leerling=h.slice(46)}
else if(h.startsWith("klas-"))st.klas=h.slice(5);
else if(h!=="beheer")st.klas=(D.klassen&&D.klassen[0]&&D.klassen[0].id)||"";
if(st.klas&&D.klassen&&!D.klassen.some(k=>k.id===st.klas))st.klas="";
toon();window.scrollTo({top:0});
if(st.klas&&D.data&&!D.data[st.klas]){try{await klasLaden(st.klas);toon()}catch(e){st.fout="Deze klas kon niet worden geladen. Probeer het opnieuw.";toon();st.fout=""}}}
window.addEventListener("hashchange",route);
document.addEventListener("click",async e=>{const t=e.target.closest("[data-act],[data-tab],[data-sort],[data-l],[data-kopieer]");if(!t)return;const a=t.dataset.act;
if(a==="google"){googleStart();return}
if(a==="mail"){inlog.mail=1;inlog.fout="";toon();focus("#mIn");return}
if(a==="mail-terug"){inlog.mail=inlog.mail===2?1:0;inlog.fout="";toon();return}
if(a==="uitloggen"){const s=sesGet();if(s)fetch(CLOUD.url+"/auth/v1/logout",{method:"POST",headers:{apikey:CLOUD.key,Authorization:"Bearer "+s.a}}).catch(()=>{});sesSet(null);D={};toon();return}
if(a==="opnieuw"){laden();return}
if(a==="vernieuw"){t.disabled=true;try{await klasLaden(st.klas,true)}catch(x){}toon();return}
if(a==="codes-erbij"){t.disabled=true;try{const r=await rpc("beheer_codes_erbij",{klas:t.dataset.id,rol:t.dataset.rol,aantal:t.dataset.rol==="docent"?1:5});
st.nieuwKlas={naam:t.dataset.naam,docent:r.rol==="docent"?r.codes[0]:"",leerlingen:r.rol==="leerling"?r.codes:[]};beheerView();window.scrollTo({top:0})}catch(x){t.disabled=false}return}
if(a==="klas-weg"){st.weg=t.dataset.id;beheerView();return}
if(a==="klas-weg-nee"){st.weg="";beheerView();return}
if(a==="klas-weg-ja"){try{await rpc("beheer_klas_verwijderen",{klas:t.dataset.id});st.weg="";await laden()}catch(x){}return}
if(t.dataset.tab){st.tab=t.dataset.tab;try{localStorage.setItem("boa-docent-tab",st.tab)}catch(x){}toon();focus("#tab-"+st.tab);return}
if(t.dataset.sort){const c=t.dataset.sort;st.sort=[c,st.sort[0]===c?-st.sort[1]:(c==="naam"?1:-1)];toon();focus(`[data-sort="${c}"]`);return}
if(t.dataset.l){location.hash="leerling-"+st.klas+"-"+t.dataset.l;return}
if(t.dataset.kopieer){const m=document.getElementById("kopieMelding");
const tekst=t.dataset.kopieer==="codes"?(st.nieuwKlas.docent?"Docentcode: "+st.nieuwKlas.docent+"\n\n":"")+(st.nieuwKlas.leerlingen.length?"Leerlingcodes:\n"+st.nieuwKlas.leerlingen.join("\n"):""):opdrachtTekst();
const toonTekst=()=>{if(m){m.innerHTML=`<textarea readonly rows="8" aria-label="Tekst om te kopiëren">${esc(tekst)}</textarea>`;const ta=m.querySelector("textarea");ta.focus();ta.select()}};
try{navigator.clipboard.writeText(tekst).then(()=>{if(m)m.textContent="Gekopieerd."},toonTekst)}catch(x){toonTekst()}}});
document.addEventListener("input",e=>{if(e.target.id==="zoek"){st.zoek=e.target.value;const pos=e.target.selectionStart;toon();const z=document.getElementById("zoek");if(z){z.focus();z.setSelectionRange(pos,pos)}}
if(e.target.id==="mCode"){const v=e.target.value.replace(/\D/g,"");if(v!==e.target.value)e.target.value=v;if(v.length===6&&!inlog.bezig)mailCheck(v)}});
document.addEventListener("change",e=>{if(e.target.id==="modFilter"){st.mod=e.target.value;toon();focus("#modFilter")}
if(e.target.id==="lmodFilter"){st.lmod=e.target.value;toon();focus("#lmodFilter")}});
document.addEventListener("submit",async e=>{e.preventDefault();const f=e.target.id;
if(f==="mForm")return mailStuur(document.getElementById("mIn").value);
if(f==="mCodeForm")return mailCheck(document.getElementById("mCode").value);
if(f==="addForm"){const inp=document.getElementById("docCode");const code=inp.value.trim();const zet=h=>{st.meld=h;const m=document.getElementById("addMelding");if(m)m.innerHTML=h};
if(code.replace(/[^A-Za-z0-9]/g,"").length<6){zet(`<p class="melding fout">Vul de docentcode in die je van de beheerder hebt gekregen.</p>`);inp.focus();return}
zet(`<p class="melding info">Bezig…</p>`);
try{const j=await rpc("klascode_inwisselen",{code,verwacht:"docent"});
if(!j||!j.ok){zet(`<p class="melding fout">${j&&j.reden==="soort"?"Dit is een leerlingcode. Leerlingen vullen die in de app in; hier gebruik je je docentcode (DOC-…).":j&&j.reden==="gebruikt"?"Deze docentcode is al gebruikt. Vraag de beheerder om een nieuwe.":j&&j.reden==="te_vaak"?"Te veel pogingen. Probeer het over een uur opnieuw.":"Deze docentcode kennen we niet. Controleer de code."}</p>`);inp.focus();return}
st.meld=`<p class="melding ok">${esc(j.klas.naam)} is toegevoegd.</p>`;await laden();location.hash="klas-"+j.klas.id}
catch(x){zet(`<p class="melding fout">De code kon niet worden gecontroleerd. Controleer je internetverbinding.</p>`)}return}
if(f==="klasForm"){const naam=document.getElementById("kNaam").value.trim(),start=document.getElementById("kStart").value.trim(),aantal=parseInt(document.getElementById("kAantal").value,10);const m=document.getElementById("klasMelding");
if(naam.length<2){m.innerHTML=`<p class="melding fout">Geef de klas een naam.</p>`;focus("#kNaam");return}
if(!(aantal>=1&&aantal<=60)){m.innerHTML=`<p class="melding fout">Kies 1 tot 60 leerlingcodes.</p>`;focus("#kAantal");return}
m.innerHTML=`<p class="melding info">Bezig…</p>`;
try{const r=await rpc("beheer_klas_maken",{naam,start,aantal});st.nieuwKlas=r;beheerView();window.scrollTo({top:0})}
catch(x){m.innerHTML=`<p class="melding fout">De klas kon niet worden aangemaakt. Probeer het opnieuw.</p>`}}});
(async()=>{if(CLOUD){await terugVanGoogle()}if(CLOUD&&sesGet())laden();else toon()})();</script>
</body>
</html>
