name: Android APK bouwen

# Bouwt bij elke update een release-APK (en een AAB voor de Play Store), ondertekend met de vaste sleutel
# uit de GitHub-geheimen. Zo kan een nieuwe versie over de vorige heen worden geïnstalleerd.
# Geheimen (Settings → Secrets and variables → Actions): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS.
# Zonder die geheimen wordt met een tijdelijke sleutel ondertekend: dan kan een update NIET over de oude versie heen.

# Op een tak die met proef- begint (bijvoorbeeld proef-betaalmuur) bouwt deze taak een PROEFVERSIE:
# app-ID nl.boa.phbtrainer.proef en naam 'Boa Paraat Proef', zodat hij naast de gewone app op de telefoon
# staat, met de proefbouw van de app (uit/proef-www-index.html). Die komt als 'pre-release' op GitHub en
# telt niet als nieuwste versie: gebruikers en de updatemelding merken er niets van.

on:
  push:
    branches: [main, 'proef-*']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HEEFT_SLEUTEL: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Afhankelijkheden installeren
        run: npm install

      - name: Proefversie klaarzetten (alleen op een proef-tak)
        if: startsWith(github.ref_name, 'proef-')
        run: |
          python3 release.py --snel
          cp uit/proef-www-index.html www/index.html
          python3 - <<'PY'
          import json;p='capacitor.config.json';c=json.load(open(p))
          c['appId']='nl.boa.phbtrainer.proef';c['appName']='Boa Paraat Proef'
          json.dump(c,open(p,'w'),indent=2);print(c['appId'],c['appName'])
          PY
          grep -c "const PROEF=true" www/index.html

      - name: Android-project maken
        run: |
          npx cap add android
          npx cap sync android

      - name: Inloggen met Google - terugkeren naar de app (nl.boa.phbtrainer://login)
        run: |
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml';s=open(p).read()
          f='''
                      <intent-filter android:autoVerify="false">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="nl.boa.phbtrainer" android:host="login" />
                      </intent-filter>'''
          if 'android:scheme="nl.boa.phbtrainer"' not in s:
              i=s.index('</intent-filter>',s.index('android.intent.action.MAIN'))+len('</intent-filter>')
              s=s[:i]+f+s[i:]
          assert 'singleTask' in s, 'MainActivity moet launchMode singleTask hebben'
          # vouwtelefoons: bij open- en dichtvouwen niet herstarten (anders verlies je je plek in een sessie)
          import re
          m=re.search(r'android:configChanges="([^"]*)"',s)
          assert m, 'MainActivity mist configChanges'
          nodig=['orientation','screenSize','smallestScreenSize','screenLayout','density']
          mist=[k for k in nodig if k not in m.group(1).split('|')]
          if mist: s=s.replace(m.group(0),'android:configChanges="%s"'%'|'.join(m.group(1).split('|')+mist))
          print('configChanges:',re.search(r'android:configChanges="([^"]*)"',s).group(1))
          open(p,'w').write(s);print('deeplink toegevoegd')
          PY
          grep -n "nl.boa.phbtrainer\|launchMode" android/app/src/main/AndroidManifest.xml

      - name: App-iconen maken
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor "#2c4a73" --iconBackgroundColorDark "#10151c" --splashBackgroundColor "#2c4a73" --splashBackgroundColorDark "#10151c"

      - name: Meldingsicoon toevoegen
        run: cp -r assets/android/res/. android/app/src/main/res/

      - name: Versienummer zetten (elke bouw een hoger nummer)
        run: |
          VN=$(node -p "require('./package.json').version")
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VN\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Release-versie bouwen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Ondertekenen
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # elke stap meldt bij een fout zelf wat er misging (zichtbaar als melding in Actions)
          stap(){ naam="$1"; shift; if ! uit=$("$@" 2>&1); then echo "$uit"; echo "::error title=$naam::$(echo "$uit" | tail -n 8 | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; fi; echo "$uit" | tail -n 3; }
          KS="$RUNNER_TEMP/release.keystore"
          if [ "$HEEFT_SLEUTEL" = "true" ]; then
            echo "$KS_B64" | base64 -d > "$KS" || { echo "::error title=Sleutel::ANDROID_KEYSTORE_BASE64 is geen geldige base64-tekst"; exit 1; }
          else
            echo "::warning::Geen vaste sleutel ingesteld. Deze APK is ondertekend met een tijdelijke sleutel en kan niet over een eerdere versie heen worden geïnstalleerd. Zie LEESMIJ.md, 'Vaste sleutel'."
            KS_PASS=$(openssl rand -hex 16); KS_ALIAS=tijdelijk; export KS_PASS KS_ALIAS
            stap "Tijdelijke sleutel" keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias "$KS_ALIAS" -keyalg RSA -keysize 2048 -validity 365 -dname "CN=Boa Paraat test" -storepass "$KS_PASS" -keypass "$KS_PASS"
          fi
          APK=$(ls android/app/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1)
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab 2>/dev/null | head -n 1)
          [ -n "$APK" ] || { echo "::error title=Geen APK::$(find android/app/build/outputs -maxdepth 3 | tr '\n' ' ')"; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "build-tools: $BT, apk: $APK, aab: $AAB"
          stap "zipalign" "$BT/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          stap "apksigner" "$BT/apksigner" sign --ks "$KS" --ks-type PKCS12 --ks-pass env:KS_PASS --ks-key-alias "$KS_ALIAS" --key-pass env:KS_PASS --out Boa-Paraat.apk "$RUNNER_TEMP/aligned.apk"
          stap "Controle handtekening" "$BT/apksigner" verify --print-certs Boa-Paraat.apk
          FP=$("$BT/apksigner" verify --print-certs Boa-Paraat.apk | grep -m1 "SHA-256 digest" | awk '{print toupper($NF)}' | sed 's/../&:/g;s/:$//')
          VC=$(grep -m1 -oE "versionName \"[^\"]+\"" android/app/build.gradle)
          echo "::notice title=Ondertekend::$VC · sleutel SHA-256 $FP"
          if [ -n "$AAB" ]; then
            cp "$AAB" Boa-Paraat.aab
            stap "AAB ondertekenen" jarsigner -keystore "$KS" -storetype PKCS12 -storepass:env KS_PASS -keypass:env KS_PASS -sigalg SHA256withRSA -digestalg SHA-256 Boa-Paraat.aab "$KS_ALIAS"
          fi
          rm -f "$KS"

      - name: Versie bepalen
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VN=$(node -p "require('./package.json').version")
          echo "tag=v$VN" >> "$GITHUB_OUTPUT"
          if gh release view "v$VN" > /dev/null 2>&1; then echo "nieuw=false" >> "$GITHUB_OUTPUT"; else echo "nieuw=true" >> "$GITHUB_OUTPUT"; fi

      - name: Proefversie op GitHub (pre-release, alleen op een proef-tak)
        id: proef
        if: startsWith(github.ref_name, 'proef-')
        run: |
          cp Boa-Paraat.apk Boa-Paraat-Proef.apk && cp uit/Boa-Paraat-proef.html Boa-Paraat-proef.html
          echo "tag=proef-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Proefversie publiceren
        if: startsWith(github.ref_name, 'proef-')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.proef.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Proefversie ${{ github.ref_name }} (${{ steps.proef.outputs.tag }})
          prerelease: true
          make_latest: false
          body: |
            Proefversie, niet voor gebruikers. Tak `${{ github.ref_name }}`, commit ${{ github.sha }}.

            - `Boa-Paraat-Proef.apk`: installeert naast de gewone app als **Boa Paraat Proef**.
            - `Boa-Paraat-Proef-Windows.exe`, `Boa-Paraat-Proef-Mac.dmg`, `Boa-Paraat-Proef-Linux.deb` en `.AppImage`: de proefversie als programma voor de computer, **Boa Paraat Proef**, naast de gewone desktop-app (komen er een paar minuten later bij).
            - `Boa-Paraat-proef.html`: los bestand, zonder inloggen.
          files: |
            Boa-Paraat-Proef.apk
            Boa-Paraat-proef.html

      - name: Release op GitHub (alleen bij een nieuw versienummer)
        if: steps.v.outputs.nieuw == 'true' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Boa Paraat ${{ steps.v.outputs.tag }}
          body_path: release-notities/${{ steps.v.outputs.tag }}.md
          files: |
            Boa-Paraat.apk
            Boa-Paraat.aab

      - name: APK beschikbaar maken
        uses: actions/upload-artifact@v4
        with:
          name: Boa-Paraat-apk
          path: |
            Boa-Paraat.apk
            Boa-Paraat.aab
