name: Testen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Playwright installeren
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Bouwen, opschonen controleren en testen
        run: python3 release.py

      - name: Schermafdrukken bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schermafdrukken
          path: uit/schermen
